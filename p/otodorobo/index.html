<style>
@import url('https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap');
/* 単一テーマ：夜の屋敷。色が付いているのは擬音の描き文字と、見張りの灯りだけ */
:root{
  color-scheme: dark;
  --night:#0b0f18; --night2:#121827; --panel:#161d2d; --line:#28324a;
  --floor:#1b2232; --floor2:#1e2638; --seam:#151b28;
  --wall:#2a3347; --wall-face:#0a0d15; --wall-edge:#3c4762;
  --wood:#9a6538; --wood-dk:#4a2d17;
  --pit:#020306; --pit-rim:#323849;
  --iron:#a3acbf; --plate:#454e63; --plate-on:#ffcf5a;
  --moon:#e9eef7; --ink:#e9edf5; --ink2:#a5afc2; --ink3:#66718a;
  --beam:rgba(255,190,90,.17); --lantern:#ffb04a;
  --gem:#6fe6ff; --thief:#34a99e; --thief-dk:#123f3b; --mask:#04060a;
  --guard:#8f99b0; --guard-dk:#283044;
  --rock:#717789; --rock-dk:#3a3f4d; --rock-lt:#b7bcc9; --feather:#f3f5f9;
  --gacha:#ffd43b; --goton:#ff5e4d; --pyon:#45e391; --kotsu:#ff8bd8;
  --outline:#04060a; --white:#ffffff; --paper:#fbf4df; --bad:#ff5e4d;
  --sfx:'Dela Gothic One','Hiragino Kaku Gothic StdN','Hiragino Sans','Noto Sans JP',sans-serif;
  --sans:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--sans);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:3px solid var(--gacha);outline-offset:2px}

.wrap{height:100%;max-width:560px;margin:0 auto;position:relative;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{position:relative;height:100%}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;
  padding:max(8px,env(safe-area-inset-top,0px)) 0 max(10px,env(safe-area-inset-bottom,0px))}
.screen[hidden]{display:none}

.top{flex:none;display:flex;align-items:center;gap:6px;height:40px}
.logo{font-family:var(--sfx);font-size:18px;line-height:1;letter-spacing:.02em;margin-right:auto;color:var(--moon)}
.logo span{color:var(--kotsu)}
.hb{height:32px;min-width:40px;padding:0 10px;border:1.5px solid var(--line);border-radius:4px;font-size:13px;font-weight:700;color:var(--ink2);background:var(--night2)}
.hb[aria-pressed="false"]{color:var(--ink3);text-decoration:line-through}
.hb:active{background:var(--panel)}

.sub{flex:none;display:flex;align-items:center;gap:10px;height:34px;margin-bottom:6px}
#pips{display:flex;gap:3px;flex:none}
.pip{width:22px;height:22px;border-radius:3px;font-size:11px;font-weight:900;color:var(--ink3);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;background:var(--night)}
.pip.done{background:var(--line);color:var(--ink)}
.pip.cur{border-color:var(--gacha);color:var(--gacha)}
.pip:disabled{opacity:.35;cursor:default}
#hint{font-weight:900;font-size:14px;letter-spacing:.04em;color:var(--moon);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.stage{flex:1;min-height:0;position:relative;touch-action:none}
#cv{display:block;position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none}
#toast{position:absolute;left:50%;top:6px;transform:translateX(-50%);background:var(--night);border:1.5px solid var(--ink3);color:var(--ink);
  font-size:13px;font-weight:700;padding:5px 12px;border-radius:4px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .2s}
#toast.on{opacity:1}

.card{position:absolute;left:0;right:0;top:34%;display:flex;justify-content:center;pointer-events:none}
.card[hidden]{display:none}
.card-in{pointer-events:auto;background:var(--night);border:2px solid var(--moon);padding:16px 20px 16px;min-width:230px;text-align:left;box-shadow:6px 6px 0 rgba(0,0,0,.6)}
.card-t{font-family:var(--sfx);font-size:30px;line-height:1.1;color:var(--gacha)}
.card.lose .card-t{color:var(--goton)}
.card-s{font-size:13px;color:var(--ink2);margin:6px 0 14px;font-weight:700}
.btn{display:block;width:100%;height:48px;background:var(--moon);color:var(--night);font-family:var(--sfx);font-size:19px;letter-spacing:.08em;border-radius:3px}
.btn:active{transform:translateY(1px)}

#end{overflow-y:auto;touch-action:pan-y}
.end-in{margin:auto 0;padding:20px 0}
.end-k{font-size:13px;font-weight:700;color:var(--ink3);letter-spacing:.12em}
.end-n{font-family:var(--sfx);font-size:64px;line-height:1;margin:6px 0 2px;color:var(--gacha)}
.end-n small{font-size:24px;color:var(--ink2)}
.end-s{font-size:14px;color:var(--ink2);font-weight:700;margin-bottom:26px}
.q{font-weight:900;font-size:16px;margin-bottom:10px}
.opts{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.opt{height:48px;border:1.5px solid var(--line);border-radius:3px;text-align:left;padding:0 14px;font-weight:700;font-size:15px;background:var(--night2)}
.opt[aria-pressed="true"]{border-color:var(--kotsu);color:var(--kotsu);background:var(--panel)}
.thanks{height:22px;font-size:13px;color:var(--pyon);font-weight:700;margin-bottom:14px}
.link{display:block;margin:14px 0 0;font-size:13px;color:var(--ink3);text-decoration:underline;font-weight:700}
</style>

<div class="wrap"><div class="inner">
  <section class="screen" id="game">
    <div class="top">
      <div class="logo">オト<span>ドロボウ</span></div>
      <button class="hb" id="snd" type="button" aria-pressed="true">音</button>
      <button class="hb" id="reset" type="button" aria-label="やり直す">↺</button>
      <button class="hb" id="quit" type="button">おわる</button>
    </div>
    <div class="sub"><div id="pips"></div><div id="hint"></div></div>
    <div class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div id="toast"></div>
      <div class="card" id="card" hidden><div class="card-in"><div class="card-t" id="cardT"></div><div class="card-s" id="cardS"></div><button class="btn" id="cardB" type="button"></button></div></div>
    </div>
  </section>
  <section class="screen" id="end" hidden>
    <div class="end-in">
      <div class="end-k">ぬすみ出した宝</div>
      <div class="end-n"><span id="endN">0</span><small> / 7</small></div>

      <button class="link" id="back" type="button">つづきに戻る</button>
    </div>
  </section>
</div></div>

<script id="logic">
/* ===== ルール（純粋関数。Node でテストする） =====
 * 擬音（ステッカー）は「持ち主」に貼られている：マス（cell）・物（obj）・主人公（hero）。
 * ガチャ＝開く：壁/門に付いていると通れる。  ゴトン＝重い：物に付いていると押せず、スイッチを押す。
 * ピョン＝跳ねる：床に付いていると、その上から2マス先へ跳べる（間が壁でなければ）。
 * コツコツ＝足音：主人公に付いていると歩くたびに鳴る。ほかに貼るとそこで鳴り続ける。
 * 見張り：聞こえる範囲（距離²≦10）の音のうち最も近い方へ、向き直ってから1マスずつ歩く。正面の一直線に主人公が入ると失敗。
 */
const L = (() => {
  const R2 = 10, INV_MAX = 2;
  const DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]];
  const LABEL = { gacha: 'ガチャ', goton: 'ゴトン', pyon: 'ピョン', kotsu: 'コツコツ' };
  const KIND_JA = { wall: '壁', floor: '床', hole: '穴', gate: '鉄格子', switch: 'スイッチ', exit: '出口', rock: '石', feather: '羽', hero: '自分' };
  const clone = s => JSON.parse(JSON.stringify(s));
  const dirOf = (dx, dy) => dy < 0 ? 0 : dx > 0 ? 1 : dy > 0 ? 2 : 3;

  function parse(def) {
    const rows = def.rows, h = rows.length, w = rows[0].length;
    const s = { w, h, tiles: [], objs: [], stickers: [], guards: [], hero: null, treasure: null, inv: [], path: [], status: 'play', t: 0, moved: false, events: [] };
    let gi = 0;
    const stick = (snd, on) => s.stickers.push({ id: s.stickers.length, snd, on });
    const obj = (kind, x, y, hv) => { const o = { id: s.objs.length, kind, x, y }; s.objs.push(o); if (hv) stick('goton', { t: 'obj', id: o.id }); };
    for (let y = 0; y < h; y++) {
      const row = [];
      for (let x = 0; x < w; x++) {
        const c = rows[y][x]; let t = '.';
        if (c === '#') t = '#';
        else if (c === 'D') { t = '#'; stick('gacha', { t: 'cell', x, y }); }
        else if ('OKGE'.includes(c)) t = c;
        else if (c === 'P') stick('pyon', { t: 'cell', x, y });
        else if (c === 'R') obj('rock', x, y, true);
        else if (c === 'r') obj('rock', x, y, false);
        else if (c === 'F') obj('feather', x, y, false);
        else if (c === 'f') { t = 'K'; obj('feather', x, y, false); }
        else if (c === 'S') s.hero = { x, y, dir: 2, hasT: false };
        else if (c === 'T') s.treasure = { x, y };
        else if (c === 'g') s.guards.push({ x, y, dir: def.gdir[gi++], goal: null, hear: false });
        row.push(t);
      }
      s.tiles.push(row);
    }
    stick('kotsu', { t: 'hero' });
    return s;
  }

  /* --- 盤面の問い合わせ --- */
  const inb = (s, x, y) => x >= 0 && y >= 0 && x < s.w && y < s.h;
  const tile = (s, x, y) => inb(s, x, y) ? s.tiles[y][x] : '#';
  const objAt = (s, x, y) => s.objs.find(o => o.x === x && o.y === y) || null;
  const guardAt = (s, x, y) => s.guards.find(g => g.x === x && g.y === y) || null;
  const heroAt = (s, x, y) => s.hero.x === x && s.hero.y === y;
  const sameHolder = (a, b) => !!a && !!b && a.t === b.t && (a.t === 'hero' || (a.t === 'obj' ? a.id === b.id : a.x === b.x && a.y === b.y));
  const stickerOn = (s, h) => s.stickers.find(k => sameHolder(k.on, h)) || null;
  const cellHas = (s, x, y, snd) => s.stickers.some(k => k.snd === snd && k.on && k.on.t === 'cell' && k.on.x === x && k.on.y === y);
  const heavy = (s, o) => s.stickers.some(k => k.snd === 'goton' && k.on && k.on.t === 'obj' && k.on.id === o.id);
  const heroHas = (s, snd) => s.stickers.some(k => k.snd === snd && k.on && k.on.t === 'hero');
  /* スイッチ：重い物・主人公・見張りが乗っていると押される（軽い物では押せない） */
  function pressed(s) {
    for (let y = 0; y < s.h; y++) for (let x = 0; x < s.w; x++) {
      if (s.tiles[y][x] !== 'K') continue;
      const o = objAt(s, x, y);
      if ((o && heavy(s, o)) || heroAt(s, x, y) || guardAt(s, x, y)) return true;
    }
    return false;
  }
  function isOpen(s, x, y) {
    const t = tile(s, x, y);
    if (t === '#') return inb(s, x, y) && cellHas(s, x, y, 'gacha');
    if (t === 'G') return cellHas(s, x, y, 'gacha') || pressed(s);
    return true;
  }
  const ground = (s, x, y) => inb(s, x, y) && tile(s, x, y) !== 'O' && isOpen(s, x, y);
  const tall = (s, x, y) => !inb(s, x, y) || !isOpen(s, x, y);              // 跳び越せない・見通せない（穴は低い）
  const blocksSight = (s, x, y) => { if (tall(s, x, y)) return true; const o = objAt(s, x, y); return !!o && o.kind === 'rock'; };
  const free = (s, x, y) => ground(s, x, y) && !objAt(s, x, y) && !guardAt(s, x, y);

  /* --- 主人公の移動 --- */
  function heroSteps(s, x, y) {
    const out = [], spring = cellHas(s, x, y, 'pyon');
    for (const [dx, dy] of DIRS) {
      if (free(s, x + dx, y + dy)) out.push({ x: x + dx, y: y + dy, jump: false });
      if (spring && !tall(s, x + dx, y + dy) && free(s, x + 2 * dx, y + 2 * dy)) out.push({ x: x + 2 * dx, y: y + 2 * dy, jump: true });
    }
    return out;
  }
  function sightCells(s, g) {
    const out = [], [dx, dy] = DIRS[g.dir];
    let x = g.x + dx, y = g.y + dy;
    while (!blocksSight(s, x, y)) { out.push({ x, y }); x += dx; y += dy; }
    return out;
  }
  function watched(s) { const set = new Set(); for (const g of s.guards) for (const c of sightCells(s, g)) set.add(c.y * s.w + c.x); return set; }
  function bfs(s, avoid) {
    const W = s.w, prev = new Map(), q = [[s.hero.x, s.hero.y]];
    prev.set(s.hero.y * W + s.hero.x, -1);
    for (let i = 0; i < q.length; i++) {
      const [x, y] = q[i];
      for (const n of heroSteps(s, x, y)) {
        const k = n.y * W + n.x;
        if (prev.has(k) || (avoid && avoid.has(k))) continue;
        prev.set(k, y * W + x); q.push([n.x, n.y]);
      }
    }
    return prev;
  }
  function trace(prev, s, k) { const out = []; while (k !== -1) { out.push({ x: k % s.w, y: Math.floor(k / s.w) }); k = prev.get(k); } out.reverse(); out.shift(); return out; }
  /* タップした先への道。見張りの視線はできるだけ避ける。軽い物をタップしたら、回り込んで押す */
  function findPath(s, tx, ty) {
    if (!inb(s, tx, ty)) return null;
    const av = watched(s);
    for (const avoid of [av, null]) {
      const prev = bfs(s, avoid);
      const o = objAt(s, tx, ty);
      if (o) {
        if (heavy(s, o)) return null;
        let best = null;
        for (const [dx, dy] of DIRS) {
          const nx = tx - dx, ny = ty - dy, bx = tx + dx, by = ty + dy;
          if (!inb(s, nx, ny) || !prev.has(ny * s.w + nx) || !free(s, bx, by) || heroAt(s, bx, by)) continue;
          const p = trace(prev, s, ny * s.w + nx); p.push({ x: tx, y: ty });
          if (!best || p.length < best.length) best = p;
        }
        if (best) return best;
        continue;
      }
      const k = ty * s.w + tx;
      if (prev.has(k)) return trace(prev, s, k);
    }
    return null;
  }

  /* --- 音と見張り --- */
  function sources(s) {
    const out = [];
    for (const k of s.stickers) {
      if (k.snd !== 'kotsu' || !k.on) continue;
      if (k.on.t === 'hero') { if (s.moved) out.push({ x: s.hero.x, y: s.hero.y, hero: true }); }
      else if (k.on.t === 'obj') { const o = s.objs[k.on.id]; out.push({ x: o.x, y: o.y, hero: false }); }
      else out.push({ x: k.on.x, y: k.on.y, hero: false });
    }
    return out;
  }
  const d2 = (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2;
  function guardStep(s, g) {
    const W = s.w, prev = new Map(), q = [[g.x, g.y, 0]], goal = g.goal;
    prev.set(g.y * W + g.x, -1);
    let best = null, bm = Infinity, bd = Infinity;
    for (let i = 0; i < q.length; i++) {
      const [x, y, d] = q[i];
      const m = Math.abs(x - goal.x) + Math.abs(y - goal.y);
      if (m < bm || (m === bm && d < bd)) { bm = m; bd = d; best = y * W + x; }
      for (const [dx, dy] of DIRS) {
        const nx = x + dx, ny = y + dy, k = ny * W + nx;
        if (prev.has(k) || !ground(s, nx, ny) || objAt(s, nx, ny) || guardAt(s, nx, ny)) continue;
        prev.set(k, y * W + x); q.push([nx, ny, d + 1]);
      }
    }
    if (best === g.y * W + g.x) return null;
    let k = best; while (prev.get(k) !== g.y * W + g.x) k = prev.get(k);
    return { x: k % W, y: Math.floor(k / W) };
  }
  function guardsAct(s) {
    const src = sources(s);
    s.guards.forEach((g, i) => {
      const heard = src.filter(p => d2(p, g) <= R2).sort((a, b) => d2(a, g) - d2(b, g));
      g.hear = heard.length > 0;
      if (heard.length) { if (!g.goal) s.events.push({ k: 'alert', i }); g.goal = { x: heard[0].x, y: heard[0].y }; }
      if (!g.goal) return;
      if (g.x === g.goal.x && g.y === g.goal.y) { g.goal = null; return; }
      const st = guardStep(s, g);
      if (!st) {
        const dx = g.goal.x - g.x, dy = g.goal.y - g.y;
        g.dir = Math.abs(dx) >= Math.abs(dy) ? dirOf(Math.sign(dx), 0) : dirOf(0, Math.sign(dy));
        g.goal = null; return;
      }
      const d = dirOf(st.x - g.x, st.y - g.y);
      if (d !== g.dir) { g.dir = d; s.events.push({ k: 'turn', i }); return; }   // 振り向くのに1拍
      g.x = st.x; g.y = st.y; s.events.push({ k: 'gstep', i });
      if (g.x === g.goal.x && g.y === g.goal.y) g.goal = null;
    });
  }
  function caught(s) {
    for (const g of s.guards) {
      if (heroAt(s, g.x, g.y)) return true;
      if (sightCells(s, g).some(c => heroAt(s, c.x, c.y))) return true;
    }
    return false;
  }

  /* --- 1拍すすめる --- */
  function tick(s0) {
    const s = clone(s0); s.events = []; s.moved = false;
    if (s.status !== 'play') return s;
    s.t++;
    const was = pressed(s), h = s.hero;
    if (s.path.length) {
      const n = s.path[0], dx = n.x - h.x, dy = n.y - h.y, ad = Math.abs(dx) + Math.abs(dy);
      let ok = false, jump = false;
      if (ad === 1) {
        const o = objAt(s, n.x, n.y);
        if (o) {
          const bx = n.x + dx, by = n.y + dy;
          if (!heavy(s, o) && free(s, bx, by)) { o.x = bx; o.y = by; ok = true; s.events.push({ k: 'push', id: o.id }); }
        } else ok = free(s, n.x, n.y);
      } else if (ad === 2 && (dx === 0 || dy === 0)) {
        ok = jump = cellHas(s, h.x, h.y, 'pyon') && !tall(s, h.x + dx / 2, h.y + dy / 2) && free(s, n.x, n.y);
      }
      if (ok) {
        if (jump) s.events.push({ k: 'jump', x: h.x, y: h.y });
        h.x = n.x; h.y = n.y; h.dir = dirOf(Math.sign(dx), Math.sign(dy)); s.path.shift(); s.moved = true;
        s.events.push({ k: 'step', x: h.x, y: h.y, loud: heroHas(s, 'kotsu') });
        const t = tile(s, h.x, h.y);
        if (t === '#' || (t === 'G' && cellHas(s, h.x, h.y, 'gacha'))) s.events.push({ k: 'door', x: h.x, y: h.y });
        if (s.treasure && s.treasure.x === h.x && s.treasure.y === h.y) { h.hasT = true; s.treasure = null; s.events.push({ k: 'treasure' }); }
      } else { s.path = []; s.events.push({ k: 'blocked' }); }
    }
    const lose = () => { s.status = 'caught'; s.path = []; s.events.push({ k: 'caught' }); return s; };
    if (caught(s)) return lose();
    if (h.hasT && tile(s, h.x, h.y) === 'E') { s.status = 'win'; s.path = []; s.events.push({ k: 'win' }); return s; }
    guardsAct(s);
    const now = pressed(s);
    if (now !== was) s.events.push({ k: now ? 'press' : 'release' });
    if (caught(s)) return lose();
    return s;
  }

  /* --- 擬音をはがす・貼る --- */
  function canPeel(s, id) {
    const k = s.stickers[id];
    if (!k || !k.on) return 'none';
    if (k.on.t === 'cell' && k.snd === 'gacha') { const { x, y } = k.on; if (heroAt(s, x, y) || guardAt(s, x, y) || objAt(s, x, y)) return 'occupied'; }
    return null;

    const chars = [...txt], ws = chars.map(ch => ctx.measureText(ch).width * .9), tw = ws.reduce((a, b) => a + b, 0);
    let px = -tw / 2;
    const gl = chars.map((ch, i) => { const r = { ch, x: px + ws[i] / 2, y: (i % 2 ? 1 : -1) * size * .06, s: i === 0 ? 1.14 : 1, a: (((i * 7) % 5) - 2) * .06 }; px += ws[i]; return r; });
    const each = fn => { for (const g of gl) { ctx.save(); ctx.translate(g.x, g.y); ctx.rotate(g.a); ctx.scale(g.s, g.s); fn(g.ch); ctx.restore(); } };
    if (lift > 0) { ctx.save(); ctx.translate(lift * .4, lift); ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.lineWidth = size * .3; each(ch => { ctx.strokeText(ch, 0, 0); }); ctx.restore(); }
    ctx.strokeStyle = C.outline; ctx.lineWidth = size * .3; each(ch => ctx.strokeText(ch, 0, 0));
    ctx.strokeStyle = C.white; ctx.lineWidth = size * .12; each(ch => ctx.strokeText(ch, 0, 0));
    ctx.fillStyle = col; each(ch => ctx.fillText(ch, 0, 0));
    if (curl > 0) { // めくれ
      const ex = tw / 2 + size * .08, ey = size * .42, k = size * (.22 + curl * .5);
      ctx.fillStyle = C.paper; ctx.strokeStyle = C.outline; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(ex, ey - k); ctx.lineTo(ex - k, ey); ctx.lineTo(ex - k * .25, ey - k * .25); ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    ctx.restore();
  }
  function drawStickers(now) {
    for (const q of placed(now)) {
      const k = q.k, i = k.id;
      let rot = (((i * 37) % 11) - 5) * .025, bob = 0, sx = 0;
      if (!reduced) { rot += Math.sin(now / 900 + i) * .04; bob = Math.sin(now / 600 + i * 1.7) * 2.5; }
      if (shake && shake.id === i && now - shake.t0 < 400) sx = Math.sin((now - shake.t0) / 25) * 5;
      if (k.snd === 'kotsu' && k.on.t !== 'hero' && !reduced) { sx += Math.sin(now / 40) * 1.2; }   // 鳴りつづけている
      let curl = .3, size = q.size;
      if (drag && drag.sid === i && !drag.peeled) { const d = Math.hypot(drag.x - drag.sx, drag.y - drag.sy); curl = .3 + d / 16; size *= 1 + d / 120; }
      drawSfx(L.LABEL[k.snd], SCOL[k.snd], q.x + sx, q.y + bob, size, { rot, curl, lift: 4 });
    }
  }
  function drawPops(now) {
    pops = pops.filter(p => now - p.t0 < 800);
    for (const p of pops) {
      const a = (now - p.t0) / 800;
      drawSfx(p.txt, p.col, cx(p.x), cy(p.y) - a * G.cell * .6, G.cell * p.size * (1 + (reduced ? 0 : (1 - a) * .2)), { alpha: 1 - a * a, curl: 0, lift: 2, rot: -.08 });
    }
  }
  function drawMarker(now) {
    if (!marker || !S.path.length) return;
    const t = reduced ? 0 : (now / 400) % 1;
    ctx.strokeStyle = C.moon; ctx.globalAlpha = .7 - t * .5; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx(marker.x), cy(marker.y), G.cell * (.18 + t * .14), 0, Math.PI * 2); ctx.stroke(); ctx.globalAlpha = 1;
  }
  function drawBag() {
    const y = G.bagY;
    ctx.fillStyle = C.night2; rr(0, y, G.W, G.bagH, 4); ctx.fill();
    ctx.strokeStyle = C.line; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = C.ink2; ctx.font = `900 13px ${css.getPropertyValue('--sans')}`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText('ぬすんだ音', 10, y + G.bagH / 2 - 8);
    ctx.fillStyle = C.ink3; ctx.font = `700 11px ${css.getPropertyValue('--sans')}`; ctx.fillText(S.inv.length + ' / ' + L.INV_MAX, 10, y + G.bagH / 2 + 10);
    G.slots.forEach((s, i) => {
      ctx.setLineDash([4, 4]); ctx.strokeStyle = C.line; ctx.lineWidth = 1.5; rr(s.x, s.y, s.w, s.h, 4); ctx.stroke(); ctx.setLineDash([]);
      const id = S.inv[i];
      if (id == null || (drag && drag.sid === id)) return;
      const k = S.stickers[id];
      drawSfx(L.LABEL[k.snd], SCOL[k.snd], s.x + s.w / 2, s.y + s.h / 2, Math.min(s.h * .5, 26), { curl: .35, lift: 3, rot: -.05 });
    });
    if (drag && drag.peeled && inBag({ y: drag.y })) { ctx.strokeStyle = C.moon; ctx.lineWidth = 2; rr(1, y + 1, G.W - 2, G.bagH - 2, 4); ctx.stroke(); }
  }
  /* ドラッグ中：貼るとどうなるかの予告 */
  function drawPreview(now) {
    if (!drag || !drag.peeled || inBag(drag)) return;
    const c = cellAt(aim(drag)); if (!c) return;
    const k = S.stickers[drag.sid], h = L.holderAt(S, c.x, c.y);
    const why = (drag.from === 'board' && L.sameHolder(k.on, h)) ? 'same' : L.canPaste(S, drag.sid, h);
    const X = G.ox + c.x * G.cell, Y = G.oy + c.y * G.cell, cc = G.cell, col = SCOL[k.snd];
    let text;
    if (why === 'same') text = 'もとの場所';
    else if (why) {
      ctx.strokeStyle = C.bad; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(X + cc * .2, Y + cc * .2); ctx.lineTo(X + cc * .8, Y + cc * .8); ctx.moveTo(X + cc * .8, Y + cc * .2); ctx.lineTo(X + cc * .2, Y + cc * .8); ctx.stroke();
      text = WHY[why] || '貼れない';
    } else {
      const eff = L.effect(S, k.snd, h), kind = L.holderKind(S, h);
      text = L.KIND_JA[kind] + ' → ' + eff.text;
      ctx.save(); ctx.beginPath(); ctx.rect(G.clip.x, G.clip.y, G.clip.w, G.clip.h); ctx.clip();
      ctx.setLineDash([5, 4]); ctx.lineWidth = 2.5; ctx.strokeStyle = eff.e === 'none' ? C.ink3 : col;
      ctx.strokeRect(X + 2, Y + 2, cc - 4, cc - 4); ctx.setLineDash([]);
      ctx.globalAlpha = .9;
      if (eff.e === 'door' || eff.e === 'gate') { // 通れる穴があく
        ctx.fillStyle = C.floor; ctx.fillRect(X + cc * .18, Y + cc * .18, cc * .64, cc * .64);
        ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.beginPath();
        ctx.moveTo(X + cc * .3, Y + cc * .5); ctx.lineTo(X + cc * .7, Y + cc * .5); ctx.moveTo(X + cc * .58, Y + cc * .38); ctx.lineTo(X + cc * .7, Y + cc * .5); ctx.lineTo(X + cc * .58, Y + cc * .62); ctx.stroke();
      } else if (eff.e === 'heavy') {
        ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.beginPath();
        for (const s of [-.22, .22]) { ctx.moveTo(X + cc * (.5 + s), Y + cc * .15); ctx.lineTo(X + cc * (.5 + s), Y + cc * .8); ctx.moveTo(X + cc * (.38 + s), Y + cc * .66); ctx.lineTo(X + cc * (.5 + s), Y + cc * .8); ctx.lineTo(X + cc * (.62 + s), Y + cc * .66); }
        ctx.stroke();
      } else if (eff.e === 'spring') { // 跳べる先
        for (const [dx, dy] of L.DIRS) {
          const mx = c.x + dx, my = c.y + dy, lx = c.x + 2 * dx, ly = c.y + 2 * dy;
          if (L.isOpen(S, mx, my) && L.free(S, lx, ly) && !L.heroAt(S, lx, ly)) {
            ctx.strokeStyle = col; ctx.lineWidth = 2.5; ctx.beginPath();
            ctx.moveTo(cx(c.x), cy(c.y)); ctx.quadraticCurveTo(cx(mx) + (dy ? cc * .7 : 0), cy(my) - (dx ? cc * .7 : 0), cx(lx), cy(ly)); ctx.stroke();
            ctx.fillStyle = col; ctx.beginPath(); ctx.arc(cx(lx), cy(ly), cc * .12, 0, Math.PI * 2); ctx.fill();
          }
        }
      } else if (eff.e === 'noise') { // 聞こえる範囲と、振り向く見張り
        ctx.strokeStyle = col; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(cx(c.x), cy(c.y), R * cc, 0, Math.PI * 2); ctx.stroke();
        ctx.globalAlpha = .12; ctx.fillStyle = col; ctx.fill(); ctx.globalAlpha = 1;
        S.guards.forEach((g, i) => {
          if ((g.x - c.x) ** 2 + (g.y - c.y) ** 2 > L.R2) return;
          const p = guardPos(i, now);
          drawSfx('！', C.white, cx(p.x), cy(p.y) - cc * .6, cc * .5, { curl: 0, lift: 2 });
        });
      }
      ctx.restore();
    }
    // 説明の札
    ctx.font = `900 13px ${css.getPropertyValue('--sans')}`;
    const tw = ctx.measureText(text).width + 20, th = 28;
    const bx = (G.W - tw) / 2, by = drag.y > G.oy + G.cell * S.h / 2 ? G.oy + 6 : G.bagY - th - 8;
    ctx.fillStyle = C.night; ctx.strokeStyle = why && why !== 'same' ? C.bad : col; ctx.lineWidth = 2; rr(bx, by, tw, th, 4); ctx.fill(); ctx.stroke();
    ctx.fillStyle = C.ink; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(text, bx + 10, by + th / 2 + 1);
  }
  function drawDragged(now) {
    if (!drag || !drag.peeled) return;
    const k = S.stickers[drag.sid];
    drawSfx(L.LABEL[k.snd], SCOL[k.snd], drag.x, drag.y - LIFT, stickerSize(k.snd) * 1.25, { curl: .9, lift: 12, rot: reduced ? 0 : Math.sin(now / 200) * .05 });
  }
  /* 1問目：指で「はがして、壁へ」 */
  function drawHand(x, y, a) {
    ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y);
    ctx.fillStyle = C.moon; ctx.strokeStyle = C.outline; ctx.lineWidth = 2;
    ctx.beginPath(); rr(-5, -2, 10, 26, 5); ctx.fill(); ctx.stroke();
    ctx.beginPath(); rr(-12, 12, 26, 24, 8); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  function drawHint(now) {
    if (lv !== 0 || hintDone || drag || S.status !== 'play') return;
    const k = S.stickers.find(s => s.snd === 'gacha'); if (!k || !k.on || k.on.t !== 'cell') return;
    const from = { x: cx(k.on.x), y: cy(k.on.y) }, to = { x: cx(3), y: cy(2) };
    const T = 2600, t = reduced ? .55 : ((now - levelStartAt) % T) / T;
    let x = from.x, y = from.y, a = 1, carry = false;
    if (t < .15) { a = t / .15; }
    else if (t < .3) { carry = t > .22; y = from.y - (t - .15) / .15 * 10; }
    else if (t < .8) { const q = (t - .3) / .5, e = q * q * (3 - 2 * q); x = from.x + (to.x - from.x) * e; y = from.y - 10 + (to.y - from.y + 10) * e; carry = true; }
    else { x = to.x; y = to.y; a = 1 - (t - .8) / .2; carry = t < .86; }
    if (carry) drawSfx('ガチャ', C.gacha, x, y - 30, stickerSize('gacha') * 1.15, { alpha: a * .85, curl: .9, lift: 10 });
    drawHand(x + 4, y + 2, a);
    // 行き先の壁を点滅
    ctx.save(); ctx.globalAlpha = .35 + .35 * Math.sin(now / 250); ctx.strokeStyle = C.gacha; ctx.setLineDash([5, 4]); ctx.lineWidth = 2;
    ctx.strokeRect(G.ox + 3 * G.cell + 3, G.oy + 2 * G.cell + 3, G.cell - 6, G.cell - 6); ctx.restore();
  }

  function frame(now) {
    if (S && !$('#game').hidden) {
      if (S.status === 'play' && $('#card').hidden && now - lastTick >= TICK) doTick(now);
      const real = S;
      if (drag && drag.peeled && drag.from === 'board') { S = L.clone(real); S.stickers[drag.sid].on = null; }   // はがした跡は元にもどって見える
      try {
        ctx.clearRect(0, 0, G.W, G.H);
        ctx.fillStyle = C.night; ctx.fillRect(0, 0, G.W, G.H);
        const k = G.clip;
        ctx.save(); ctx.beginPath(); ctx.rect(k.x, k.y, k.w, k.h); ctx.clip();
        drawTiles(now); drawBeams(now); drawRipples(now); drawMarker(now); drawObjs(now); drawActors(now);
        ctx.restore();
        ctx.strokeStyle = C.line; ctx.lineWidth = 1.5; ctx.strokeRect(k.x - .75, k.y - .75, k.w + 1.5, k.h + 1.5);
        drawStickers(now); drawPreview(now); drawPops(now);
        drawBag(); drawHint(now); drawDragged(now);
      } finally { S = real; }
    }
    requestAnimationFrame(frame);
  }

  startLevel(0, true);
  requestAnimationFrame(frame);
  if (document.fonts && document.fonts.load) document.fonts.load('20px "Dela Gothic One"').catch(() => {});
  M.init();
})();
</script>
