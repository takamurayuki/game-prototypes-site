<script id="logic">
/* ===== 肉の持ち替え：ルール（純粋関数。tests/logic.test.js が Node で検証する）=====
   体は3点（0=頭 H・1=腹 B・2=尻 T）。物理は 1 フレーム固定ステップで、乱数も時間も使わない（同じ入力列なら同じ結果）。
   - 支点（pin）になった点は絶対に動かない
   - 頭だけがつかめる（GRAB H）。頭は支点からの「届く距離」と「持ち上げられる高さ」の範囲でだけ伸びる
   - 頭を光る吸着点の近くで離すと吸着。ほかの支点はすべて外れ、体は地形に沿ってすべりながら頭へ縮み、
     追いついた尻が地面（上向きの面）に乗っていれば尻が地面をつかむ ＝ 1歩進む
     （縮みきる前に地形に阻まれて止まった場合は「追いついた」にならない＝ blocked。その状態ではクリアしない）
   - 吸着のスナップで腹・尻が伸びきるなら頭のほうへ寄せて丸める。丸めても最大伸長・めり込みを守れなければ吸着しない
   - 腹の輪をタップ（TAP B）すると、腹がそばの地形（床でも壁でも）に押し付けられて支点になる。もう一度で外れる
     （押し付けた先で頭・尻との最大伸長が破れるなら支点にならない）
   - 支点が1つもないと落ちる。下に落ちきったら（穴）ステージの最初からやり直し（deaths+1）
   - 支点が1つもないまま頭を持っている間（吸着直後のつかみ直し）：腹・尻は落ち、頭は腹から MAX 以内、
     持ち上げは腹・尻が乗っている地面から LIFT まで（どちらも浮いていれば、つかんだ高さまで）。頭が体を引きずって運ぶことはない
   - クリア：頭がゴールに付き、尻が縮みきって追いつき、頭のそば（CATCH 以内）で地面をつかむ
   - どの入力・どのフレームのあとも、隣り合う点の距離は MAX 以内
*/
const L = (() => {
  const R = 10;          // 点の半径（当たり判定）
  const MAX = 100;       // 隣り合う点の最大伸長
  const REST = 20;       // 縮んだときの点の間隔
  const LIFT = 60;       // 頭を持ち上げられる高さ（いちばん近い支点より上へ）
  const SNAP = 28;       // 吸着点に吸い付く距離
  const PRESS = 30;      // 腹を地形に押し付けられる距離（すき間）
  const SPEED = 12;      // 頭が指を追う速さ（px/フレーム）
  const CSPEED = 4;      // 縮む速さ（px/フレーム）
  const DROP = 40;       // 追いつく尻が地面を探して垂れ下がれる距離
  const CATCH = 2 * REST + DROP;   // クリアに必要な頭―尻の近さ（縮みきり 2×REST ＋地面を探して垂れた分）
  const G = 0.6, VMAX = 14, KILL = 640;
  const F = 300;         // 基本の床の高さ
  const NAMES = ['H', 'B', 'T'];

  const floor = (x0, x1, top = F) => ({ x: x0, y: top, w: x1 - x0, h: 400 });
  const block = (x0, x1, top, bottom) => ({ x: x0, y: top, w: x1 - x0, h: bottom - top });
  // foot: 吸着点 [x, y]。最後の1つがゴール。start: 尻の x（頭は +40、腹は +20、床の上）
  const STAGES = [
    { id: 1, name: 'まっすぐ', hint: '頭の下の輪を指でつかんで右へ引っぱり、光る点の上で指をはなそう',
      solids: [floor(-300, 700)], foot: [[170, 290], [300, 290]], start: 40 },
    { id: 2, name: 'ながく', hint: '頭をつけたら、尻が追いつくのを待ってから次へ',
      solids: [floor(-300, 800)], foot: [[170, 290], [300, 290], [430, 290]], start: 40 },
    { id: 3, name: 'だんさ', hint: '段の上の光る点まで、頭を持ち上げてのばそう',
      solids: [floor(-300, 260), block(260, 800, 260, 700)], foot: [[140, 290], [230, 290], [330, 250], [450, 250]], start: 40 },
    { id: 4, name: 'あな', hint: '穴の向こうの点に頭をつける。尻が穴の上に残ると落ちる',
      solids: [floor(-300, 260), floor(340, 900)], foot: [[140, 290], [240, 290], [390, 290], [500, 290]], start: 40 },
    { id: 5, name: 'たかいだんさ', hint: '尻からでは届かない。頭を持ったまま、もう1本の指で腹の輪をタップ（壁に腹をはりつける）',
      solids: [floor(-300, 300), block(300, 900, 220, 700)], foot: [[150, 290], [290, 240], [380, 210], [490, 210]], start: 40 },
    { id: 6, name: 'せまいあな', hint: '低い通路。頭から低く入れて、支点を替えながら抜けよう',
      solids: [floor(-300, 900), block(220, 480, 120, 268)], foot: [[130, 290], [230, 290], [330, 290], [430, 290], [540, 290]], start: 40 },
    { id: 7, name: 'くみあわせ', hint: '段を登って、穴をこえる',
      solids: [floor(-300, 250), block(250, 420, 260, 700), floor(500, 1000, 260)],
      foot: [[120, 290], [220, 290], [320, 250], [400, 250], [550, 250], [660, 250]], start: 40 },
    { id: 8, name: 'さいご', hint: '段・穴・せまい通路。ここまでの全部',
      solids: [floor(-300, 250), block(250, 500, 260, 700), floor(580, 1200, 260), block(680, 900, 100, 228)],
      foot: [[120, 290], [220, 290], [320, 250], [480, 250], [625, 250], [720, 250], [820, 250], [950, 250]], start: 40 },
  ];

  const clone = s => JSON.parse(JSON.stringify(s));
  const dist = (a, b) => Math.sqrt((a.x - b.x) * (a.x - b.x) + (a.y - b.y) * (a.y - b.y));
  const solidsOf = s => STAGES[s.st].solids;
  const goalOf = s => STAGES[s.st].foot.length - 1;

  function newGame(st, deaths = 0) {
    const x = STAGES[st].start, y = F - R;
    return {
      st, p: [{ x: x + 40, y, vy: 0 }, { x: x + 20, y, vy: 0 }, { x, y, vy: 0 }],
      pin: [false, false, true], at: -1,          // at: 頭が吸着している吸着点の番号
      drag: null, follower: -1, fphase: 0, dropLeft: 0, still: 0, caught: false,   // caught: 尻が縮みきって追いついた
      deaths, cleared: false, frame: 0, ev: [],
    };
  }

  /* ---- 地形との当たり ---- */
  function pushOut(p, solids) {
    for (let it = 0; it < 3; it++) for (const r of solids) {
      const cx = Math.max(r.x, Math.min(p.x, r.x + r.w)), cy = Math.max(r.y, Math.min(p.y, r.y + r.h));
      const dx = p.x - cx, dy = p.y - cy, d = Math.sqrt(dx * dx + dy * dy);
      if (d === 0) {          // 中心が中（または縁の上）：いちばん浅い面へ出す
        const l = p.x - r.x, rr = r.x + r.w - p.x, t = p.y - r.y, b = r.y + r.h - p.y, m = Math.min(l, rr, t, b);
        if (m === t) p.y = r.y - R; else if (m === l) p.x = r.x - R; else if (m === rr) p.x = r.x + r.w + R; else p.y = r.y + r.h + R;
      } else if (d < R) { p.x = cx + dx / d * R; p.y = cy + dy / d * R; }
    }
  }
  // 上向きの面に乗っている
  const supported = (p, solids) => solids.some(r => p.x >= r.x - 2 && p.x <= r.x + r.w + 2 && Math.abs(p.y + R - r.y) <= 2.5);
  // 地形の表面のうち、すき間 PRESS 以内でいちばん近いところに押し付けた位置（なければ null）
  function pressTo(p, solids) {
    let best = null, bg = Infinity;
    for (const r of solids) {
      const cx = Math.max(r.x, Math.min(p.x, r.x + r.w)), cy = Math.max(r.y, Math.min(p.y, r.y + r.h));
      const dx = p.x - cx, dy = p.y - cy, d = Math.sqrt(dx * dx + dy * dy);
      if (d === 0) continue;
      const gap = d - R;
      if (gap <= PRESS && gap < bg) { bg = gap; best = { x: cx + dx / d * R, y: cy + dy / d * R }; }
    }
    return best;
  }

  /* ---- 頭が届く範囲 ---- */
  // 支点（腹・尻）からの距離と、いちばん近い支点からの高さで頭の位置をしばる
  function clampHead(s, c) {
    for (let it = 0; it < 3; it++) {
      for (const j of [1, 2]) if (s.pin[j]) {
        const A = s.p[j], dx = c.x - A.x, dy = c.y - A.y, d = Math.sqrt(dx * dx + dy * dy), lim = j * MAX;
        if (d > lim) { c.x = A.x + dx / d * lim; c.y = A.y + dy / d * lim; }
      }
      const near = s.pin[1] ? 1 : s.pin[2] ? 2 : -1;
      if (near >= 0) c.y = Math.max(c.y, s.p[near].y - LIFT);
    }
    return c;
  }
  // 地形にめり込んでいる
  const inside = (p, solids) => solids.some(r => {
    const cx = Math.max(r.x, Math.min(p.x, r.x + r.w)), cy = Math.max(r.y, Math.min(p.y, r.y + r.h));
    return Math.sqrt((p.x - cx) * (p.x - cx) + (p.y - cy) * (p.y - cy)) < R - 0.01;
  });
  // 隣り合う点がすべて最大伸長以内
  const linksOK = P => dist(P[0], P[1]) <= MAX + 0.01 && dist(P[1], P[2]) <= MAX + 0.01;
  /* 腹も尻も支点でないとき（吸着直後に頭をつかみ直した等）の、頭を持ち上げられる上限の y。
     腹・尻が地形に乗っていればその点から LIFT まで、どちらも浮いていれば「つかんだ時点の頭の高さ」まで（ぶら下がり）。
     ぶら下がり中は頭が下がるたびに上限も下がる（指で引き上げ直せない） */
  function freeCap(s) {
    const sol = solidsOf(s);
    for (const j of [1, 2]) if (supported(s.p[j], sol)) return s.p[j].y - LIFT;
    return s.drag ? s.drag.cy : s.p[0].y;
  }
  const bodyPinned = s => s.pin[1] || s.pin[2];
  function headCanBe(s, x, y) {
    // 腹・尻が支点でない：頭は腹から MAX 以内、上限より下（腹を引きずって運ぶことはできない）
    if (!bodyPinned(s)) return dist({ x, y }, s.p[1]) <= MAX + 0.5 && y >= freeCap(s) - 0.5;
    for (const j of [1, 2]) if (s.pin[j] && dist({ x, y }, s.p[j]) > j * MAX + 0.5) return false;
    const near = s.pin[1] ? 1 : s.pin[2] ? 2 : -1;
    if (near >= 0 && y < s.p[near].y - LIFT - 0.5) return false;
    return true;
  }
  // 今の支点のまま、頭がその吸着点に届くか（光らせる判定にも使う）
  const reachable = (s, i) => { const f = STAGES[s.st].foot[i]; return headCanBe(s, f[0], f[1]); };
  // 頭を離したとき吸い付く吸着点（なければ -1）
  function snapTarget(s) {
    const h = s.p[0]; let best = -1, bd = SNAP;
    STAGES[s.st].foot.forEach((f, i) => {
      const d = dist(h, { x: f[0], y: f[1] });
      if (d <= bd && reachable(s, i)) { bd = d; best = i; }
    });
    return best;
  }
  /* 頭を吸着点 f へスナップする。腹・尻が伸びきってしまう分は頭のほうへ寄せて丸め（地形に沿って）、
     それでも最大伸長・めり込みを守れなければ吸着させない（false）。成功時は s.p を書き換える */
  function trySnap(s, f) {
    const sol = solidsOf(s), ft = STAGES[s.st].foot[f];
    const P = s.p.map(p => ({ x: p.x, y: p.y, vy: 0 }));
    P[0].x = ft[0]; P[0].y = ft[1];
    for (const j of [1, 2]) if (dist(P[j], P[j - 1]) > MAX) toward(P[j], P[j - 1], MAX, 1e9, sol);
    if (!linksOK(P) || P.some(p => inside(p, sol))) return false;
    s.p = P;
    return true;
  }

  /* ---- 入力 ---- */
  // a: {t:'grab', p:'H'} / {t:'move', x, y} / {t:'release'} / {t:'tap', p:'B'}
  function input(s0, a) {
    const s = clone(s0); s.ev = [];
    if (s.cleared) return s;
    if (a.t === 'grab') {
      if (a.p !== 'H' || s.drag) return s;
      if (s.pin[0]) { s.pin[0] = false; s.at = -1; }
      s.drag = { tx: s.p[0].x, ty: s.p[0].y, cy: s.p[0].y };   // cy: ぶら下がり中の持ち上げ上限
      s.ev.push({ type: 'grab' });
    } else if (a.t === 'move') {
      if (s.drag) { s.drag.tx = a.x; s.drag.ty = a.y; }
    } else if (a.t === 'release') {
      if (!s.drag) return s;
      const f = snapTarget(s);                           // 上限の判定に drag を使うので、外す前に調べる
      s.drag = null;
      if (f >= 0 && trySnap(s, f)) {
        s.pin = [true, false, false]; s.at = f;         // 支点を替える：ほかの支点は外れる
        s.follower = 2; s.fphase = 0; s.dropLeft = DROP; s.caught = false;
        s.ev.push({ type: 'anchor', foot: f });
      } else s.ev.push({ type: 'miss' });
    } else if (a.t === 'tap') {
      if (a.p !== 'B') return s;
      if (s.pin[1]) { s.pin[1] = false; s.ev.push({ type: 'unpinB' }); return s; }
      const q = pressTo(s.p[1], solidsOf(s));
      // 押し付けた先で頭・尻との最大伸長が破れるなら支点にしない
      if (q && dist(q, s.p[0]) <= MAX + 0.01 && dist(q, s.p[2]) <= MAX + 0.01) {
        s.p[1].x = q.x; s.p[1].y = q.y; s.p[1].vy = 0; s.pin[1] = true; s.ev.push({ type: 'pinB' });
      } else s.ev.push({ type: 'tapFail' });
    }
    return s;
  }

  /* ---- 1 フレーム進める ---- */
  function toward(p, q, keep, maxStep, solids) {   // p を q へ（距離 keep まで）すべりながら寄せる。動いた量を返す
    const d = dist(p, q);
    if (d <= keep + 1e-6) return 0;
    const m = Math.min(maxStep, d - keep), x0 = p.x, y0 = p.y;
    p.x += (q.x - p.x) / d * m; p.y += (q.y - p.y) / d * m;
    pushOut(p, solids);
    return Math.sqrt((p.x - x0) * (p.x - x0) + (p.y - y0) * (p.y - y0));
  }
  function step(s0) {
    const s = clone(s0); s.ev = [];
    if (s.cleared) return s;
    s.frame++;
    const P = s.p, sol = solidsOf(s), anyPin = s.pin.some(Boolean);
    if (s.drag && !anyPin) return freeDrag(s);
    const start = P.map(p => ({ x: p.x, y: p.y })), startOK = linksOK(P) && !P.some(p => inside(p, sol));
    // 頭：指を追う（届く範囲・地形の外）
    if (s.drag) {
      const h = P[0], c = fingerStep(s);
      clampHead(s, c); pushOut(c, sol); clampHead(s, c); pushOut(c, sol);
      if (headCanBe(s, c.x, c.y)) { h.x = c.x; h.y = c.y; }
      h.vy = 0;
    }
    if (!anyPin) {
      // 落下（だれも持っていない）：重力＋体は縮もうとする＋最大伸長
      let mv = 0;
      const before = P.map(p => ({ x: p.x, y: p.y }));
      for (let i = 0; i < 3; i++) { P[i].vy = Math.min(VMAX, P[i].vy + G); P[i].y += P[i].vy; }
      for (let it = 0; it < 2; it++) for (const [a, b] of [[0, 1], [1, 2]]) {
        const A = P[a], B = P[b], d = dist(A, B); if (d <= REST || d === 0) continue;
        let cut = (d - REST) * 0.15; if (d - cut > MAX) cut = d - MAX;
        const ux = (B.x - A.x) / d, uy = (B.y - A.y) / d;
        A.x += ux * cut * 0.5; A.y += uy * cut * 0.5; B.x -= ux * cut * 0.5; B.y -= uy * cut * 0.5;
      }
      for (let i = 0; i < 3; i++) { const y0 = P[i].y; pushOut(P[i], sol); if (P[i].y < y0 - 1e-9) P[i].vy = 0; }
      for (let it = 0; it < 3 && !linksOK(P); it++) for (const [a, b] of [[0, 1], [1, 2]]) {   // 押し出しで伸びきった分を戻す
        const A = P[a], B = P[b], d = dist(A, B); if (d <= MAX) continue;
        const k = (d - MAX) / d * 0.5, ex = (B.x - A.x) * k, ey = (B.y - A.y) * k;
        A.x += ex; A.y += ey; B.x -= ex; B.y -= ey; pushOut(A, sol); pushOut(B, sol);
      }
      // 守り：それでも残るなら、このフレームの落下を取り消す（引っかかって止まる → 着地の判定へ）
      if (startOK && (!linksOK(P) || P.some(p => inside(p, sol)))) P.forEach((p, i) => { p.x = start[i].x; p.y = start[i].y; p.vy = 0; });
      for (let i = 0; i < 3; i++) mv += dist(P[i], before[i]);
      if (P.some(p => p.y > KILL)) {
        const n = newGame(s.st, s.deaths + 1); n.ev = [{ type: 'fall' }]; n.frame = s.frame; return n;
      }
      s.still = mv < 0.1 ? s.still + 1 : 0;
      if (s.still >= 8) {     // 着地：地面に乗っている点が地面をつかむ（尻 → 頭 → 腹の順）
        for (const i of [2, 0, 1]) if (supported(P[i], sol)) { s.pin[i] = true; P[i].vy = 0; s.ev.push({ type: 'land', p: NAMES[i] }); break; }
        s.still = 0;
      }
      return s;
    }
    const moved = [0, 0, 0];
    if (s.drag) {

      if (!s.pin[1]) {

      }

      // 守り：伸びきり・めり込みを解消できない動きは、このフレームごと取り消す（頭はそこで止まる）

        else if (s.fphase === 0) {

    const h = s.p[0], dx = s.drag.tx - h.x, dy = s.drag.ty - h.y, d = Math.sqrt(dx * dx + dy * dy);
    const c = { x: h.x, y: h.y };

     腹・尻は重力で落ち、頭は腹から MAX 以内・持ち上げ上限より下にしか動けない。

    const P = s.p, sol = solidsOf(s);
    const start = P.map(p => ({ x: p.x, y: p.y })), startOK = linksOK(P) && !P.some(p => inside(p, sol));
    for (const i of [1, 2]) { P[i].vy = Math.min(VMAX, P[i].vy + G); P[i].y += P[i].vy; }
    for (let it = 0; it < 2; it++) {       // 腹―尻：縮もうとする＋最大伸長（2点で分け合う）
      const A = P[1], B = P[2], d = dist(A, B); if (d <= REST || d === 0) continue;

      c.x = h.x; c.y = h.y;

        if (dist(P[2], P[1]) > MAX) toward(P[2], P[1], MAX, 1e9, sol);

    if (startOK && (!linksOK(P) || P.some(p => inside(p, sol)))) P.forEach((p, i) => { p.x = start[i].x; p.y = start[i].y; p.vy = 0; });

    }

  }

     ['G','H'] つかむ / ['M',x,y,frames] 指を (x,y) へ frames フレームかけて動かす（各フレーム1ステップ）

          s = add(step(s));

    }
    return { s, ev };

    newGame, input, step, play, reachable, snapTarget, supported, pressTo, headCanBe, freeCap, inside, dist };
})();
if (typeof module !== 'undefined') module.exports = L;
</script>

<script>

    $('hint').textContent = L.STAGES[i].hint; drags.clear();

      else if (e.type === 'pinB') { pop(560, 0.06, 0.1); squish[1] = 1; }

      const glow = can ? (0.55 + 0.45 * Math.sin(t * 5 + i)) : 0;

        const rg = cx.createRadialGradient(f[0], f[1], 2, f[0], f[1], i === snap ? 34 : 24);

        cx.fillStyle = '#9fd38f'; cx.beginPath(); cx.moveTo(f[0] + 9, f[1] - 26); cx.lineTo(f[0] + 26, f[1] - 20); cx.lineTo(f[0] + 9, f[1] - 14); cx.fill();

  function drawBody(t) {
    const pts = bodyPath();
    cx.fillStyle = COL.bodyDark; for (const q of pts) { cx.beginPath(); cx.arc(q.x, q.y + 1.5, q.r + 1.5, 0, 7); cx.fill(); }
    cx.fillStyle = COL.body; for (const q of pts) { cx.beginPath(); cx.arc(q.x, q.y, q.r, 0, 7); cx.fill(); }
    // 背中のつや
    cx.fillStyle = 'rgba(255,240,235,0.35)';
    for (let k = 3; k < pts.length - 3; k += 3) { const q = pts[k]; cx.beginPath(); cx.arc(q.x - q.r * 0.25, q.y - q.r * 0.45, q.r * 0.28, 0, 7); cx.fill(); }
    // 支点マーク
    s.pin.forEach((on, i) => {
      if (!on) return; const p = s.p[i];
      cx.fillStyle = COL.pin; cx.beginPath(); cx.arc(p.x, p.y, 5.5, 0, 7); cx.fill();
    });
    // 目（頭だけ）
    const h = s.p[0], b = s.p[1], dx = h.x - b.x, dy = h.y - b.y, d = Math.hypot(dx, dy) || 1, ux = dx / d, uy = dy / d;
    const blink = (Math.sin(t * 1.3) > 0.985) ? 0.15 : 1;
    for (const side of [-1, 1]) {
      const ex = h.x + ux * 4 + -uy * side * 5, ey = h.y + uy * 4 + ux * side * 5 - 3;
      cx.fillStyle = '#fff'; cx.beginPath(); cx.ellipse(ex, ey, 3.6, 3.6 * blink, 0, 0, 7); cx.fill();
      cx.fillStyle = '#2b2226'; cx.beginPath(); cx.ellipse(ex + ux * 1.2, ey + uy * 1.2, 1.9, 1.9 * blink, 0, 0, 7); cx.fill();
    }
  }
  function drawRings() {
    const labels = ['頭', '腹', '尻'];
    for (const i of [2, 1, 0]) {
      const p = s.p[i], r = ringPos(i), active = i === 0 || i === 1;
      cx.globalAlpha = active ? 0.9 : 0.35;
      cx.strokeStyle = COL.ring; cx.lineWidth = 1.2; cx.setLineDash([3, 3]);
      cx.beginPath(); cx.moveTo(p.x, p.y + 6); cx.lineTo(r.x, r.y - RING_R); cx.stroke(); cx.setLineDash([]);
      cx.lineWidth = i === 0 && s.drag ? 4 : 2.5;
      cx.strokeStyle = s.pin[i] ? COL.pin : COL.ring;
      cx.beginPath(); cx.arc(r.x, r.y, i === 0 ? RING_R : i === 1 ? RING_R - 3 : RING_R - 7, 0, 7); cx.stroke();
      cx.fillStyle = s.pin[i] ? COL.pin : COL.ring; cx.font = '11px sans-serif'; cx.textAlign = 'center'; cx.textBaseline = 'middle';
      cx.fillText(labels[i], r.x, r.y);
      cx.globalAlpha = 1;
    }
  }

  // 確認用（自動プレイのテストから状態と座標変換を読む）
  window.MOCHI = { state: () => s, load, toScreen: (x, y) => ({ x: (x - camX) * SC, y: (y - camY) * SC }), ringDY: RING_DY, ringDX: RING_DX };

  load(0);
  requestAnimationFrame(frame);
})();
</script>
