<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.5 system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body><title>コマ割りダンジョン</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@import url('https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap');
/* 単一テーマ：原稿用紙の白に墨。色は水の青と火の朱、言葉の3色（ここ！＝黄土／しーっ＝緑青／わっ！＝朱）だけ */
:root{
  color-scheme: light;
  --paper:#fcfcfa; --paper2:#f1f1ee; --guide:#e3e3df;
  --ink:#151515; --ink2:#4a4a48; --ink3:#8d8d89; --floor-line:#dcdcd8;
  --tone:#151515;
  --water:#2f78cf; --water-lt:#d5e6f8; --water-ink:#1d4f8c;
  --fire:#e5432a; --fire-lt:#fde1d9; --fire-ink:#9b2412;
  --koko:#d99a12; --koko-lt:#fbecc4; --koko-ink:#7a5300;
  --shh:#23876b; --shh-lt:#d6efe6; --shh-ink:#125440;
  --white:#ffffff;
  --sfx:'Dela Gothic One','Hiragino Kaku Gothic StdN','Hiragino Sans','Noto Sans JP',sans-serif;
  --sans:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:3px solid var(--water);outline-offset:2px}

.wrap{height:100%;max-width:560px;margin:0 auto;position:relative;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{position:relative;height:100%}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;
  padding:max(8px,env(safe-area-inset-top,0px)) 0 max(10px,env(safe-area-inset-bottom,0px))}
.screen[hidden]{display:none}
#game{touch-action:none}

/* ヘッダ：原稿の欄外 */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;height:40px;flex:none}
.logo{font-family:var(--sfx);font-size:17px;letter-spacing:.02em;line-height:1}
.logo small{display:block;font-family:var(--sans);font-weight:700;font-size:10px;color:var(--ink3);letter-spacing:.2em;margin-top:3px}
.pno{font-family:var(--sfx);font-size:15px;display:flex;align-items:baseline;gap:6px}
.pno b{font-size:24px;font-weight:400}
.pno span{color:var(--ink3);font-size:12px}
.tocbtn{height:34px;padding:0 12px;border:2px solid var(--ink);font-weight:900;font-size:13px;background:var(--white)}

/* ナレーション枠（一言） */
.cap{flex:none;align-self:flex-start;margin:4px 0 8px;background:var(--white);border:2px solid var(--ink);
  padding:5px 10px 6px;font-weight:900;font-size:14px;letter-spacing:.06em;box-shadow:3px 3px 0 var(--ink);
  transition:opacity .3s}
.cap:empty{opacity:0}

.stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
#cv{display:block;touch-action:none}

.bottom{flex:none;display:flex;gap:8px;align-items:stretch;margin-top:10px;height:58px}
.sub{flex:none;width:58px;border:2px solid var(--ink);background:var(--white);font-weight:900;font-size:12px;line-height:1.15;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0 2px}
.sub:active{background:var(--paper2)}
.sub:disabled{color:var(--ink3);border-color:var(--ink3);cursor:default}
.sub:disabled .ic{opacity:.4}
/* 1手戻す：左回りの矢印／最初から：二重の左向き */
.ic{display:block;position:relative;width:18px;height:12px}
.ic.undo::before{content:'';position:absolute;left:4px;top:1px;width:12px;height:10px;border:2.5px solid currentColor;border-left:0;border-radius:0 7px 7px 0;box-sizing:border-box}
.ic.undo::after{content:'';position:absolute;left:0;top:-2px;border-right:7px solid currentColor;border-top:5px solid transparent;border-bottom:5px solid transparent}
.ic.rst::before,.ic.rst::after{content:'';position:absolute;top:1px;border-right:9px solid currentColor;border-top:5px solid transparent;border-bottom:5px solid transparent}
.ic.rst::before{left:1px}.ic.rst::after{left:8px}
.go{flex:1;background:var(--ink);color:var(--white);font-family:var(--sfx);font-size:24px;letter-spacing:.1em;
  display:flex;align-items:center;justify-content:center;gap:10px;position:relative;overflow:hidden}
.go:active{transform:translateY(1px)}
.go:disabled{opacity:.45}
.go i{display:block;width:0;height:0;border-left:13px solid var(--white);border-top:9px solid transparent;border-bottom:9px solid transparent}

/* クリアの札 */
.card{position:absolute;left:0;right:0;bottom:84px;display:flex;justify-content:center;pointer-events:none}
.card[hidden]{display:none}
.card .in{pointer-events:auto;background:var(--white);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);
  padding:14px 16px;display:flex;align-items:center;gap:14px;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.card .t{font-family:var(--sfx);font-size:22px;line-height:1.1}
.card .t small{display:block;font-family:var(--sans);font-weight:700;font-size:12px;color:var(--ink2);margin-top:4px}
.card button{background:var(--ink);color:var(--white);font-weight:900;font-size:15px;padding:12px 16px;white-space:nowrap}
@keyframes pop{from{transform:scale(.6) rotate(-4deg);opacity:0}to{transform:none;opacity:1}}

/* 目次・終了画面（スクロールは中身だけ） */
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding-bottom:12px}
.h1{font-family:var(--sfx);font-size:30px;line-height:1.15;margin:10px 0 2px}
.lead{font-size:13px;color:var(--ink2);font-weight:700;margin-bottom:14px}
.sec{font-weight:900;font-size:14px;border-bottom:2px solid var(--ink);padding-bottom:4px;margin:18px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
.sec span{font-size:11px;color:var(--ink3);font-weight:700}
.pages{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.pg{aspect-ratio:3/4;border:2.5px solid var(--ink);background:var(--white);position:relative;font-family:var(--sfx);font-size:20px;
  display:flex;align-items:center;justify-content:center}
.pg:nth-child(3n+2){transform:rotate(-1.2deg)} .pg:nth-child(4n+3){transform:rotate(1deg)}
.pg.done::after{content:'済';position:absolute;right:-3px;top:-8px;width:26px;height:26px;border-radius:50%;
  border:2px solid var(--fire);color:var(--fire);background:var(--white);font-size:12px;display:flex;align-items:center;justify-content:center;transform:rotate(12deg)}
.pg.next{box-shadow:4px 4px 0 var(--ink)}
.pg.lock,.pg.paid{color:var(--ink3);cursor:default;
  background-color:var(--paper2);background-image:radial-gradient(var(--ink3) 1px,transparent 1.3px);background-size:6px 6px}
.pg .lk{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:14px;height:11px;background:var(--ink);border-radius:2px}
.pg .lk::before{content:'';position:absolute;left:2.5px;top:-7px;width:9px;height:9px;border:2px solid var(--ink);border-bottom:0;border-radius:6px 6px 0 0;box-sizing:border-box}
.pg.paid{font-size:15px}
.chap2{border:2.5px dashed var(--ink3);padding:12px;margin-top:4px}
.chap2 .ttl{font-family:var(--sfx);font-size:18px;margin-bottom:2px}
.chap2 .ttl small{font-family:var(--sans);font-size:11px;font-weight:700;color:var(--ink3);margin-left:6px}
.chap2 .pages{margin-top:10px}
.chap2 p{font-size:12px;color:var(--ink2);font-weight:700}
.chh{font-size:16px}
.sec .cht{font-family:var(--sfx);font-weight:400;font-size:18px;color:var(--ink)}
.sec .cht small{font-family:var(--sans);font-weight:700;font-size:12px;color:var(--ink2);margin-left:8px}
.chlead{font-size:12px;color:var(--ink2);font-weight:700;margin:-4px 0 10px}
.big{display:block;width:100%;height:54px;background:var(--ink);color:var(--white);font-family:var(--sfx);font-size:20px;letter-spacing:.08em;margin-top:16px}
.ghost{display:block;width:100%;height:46px;border:2px solid var(--ink);background:var(--white);font-weight:900;font-size:15px;margin-top:8px}

.score{display:flex;align-items:baseline;gap:8px;font-family:var(--sfx);margin:6px 0 2px}
.score b{font-size:56px;font-weight:400;line-height:1}
.score span{font-size:20px;color:var(--ink2)}
.chs{list-style:none;border:2.5px solid var(--ink);background:var(--white)}
.chs li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1.5px solid var(--ink)}
.chs li:first-child{border-top:0}
.chs .n{font-family:var(--sfx);font-size:13px;width:44px;flex:none}
.chs .nm{flex:1;font-weight:900;font-size:14px}
.chs .nm small{display:block;font-weight:700;font-size:11px;color:var(--ink3)}
.chs .st{flex:none;font-size:11px;font-weight:900;padding:3px 6px;border:1.5px solid var(--ink)}
.chs li.lockd{background-image:radial-gradient(#d4d4d0 1px,transparent 1.3px);background-size:6px 6px;color:var(--ink2)}
.chs li.lockd .st{background:var(--ink);color:var(--white)}
.q{margin-top:20px;font-weight:900;font-size:15px;line-height:1.5}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.opt{height:50px;border:2px solid var(--ink);background:var(--white);font-weight:900;font-size:16px}
.opt[aria-pressed="true"]{background:var(--ink);color:var(--white)}
.thanks{font-size:12px;font-weight:700;color:var(--ink2);margin-top:8px;min-height:1em}

@media (prefers-reduced-motion: reduce){
  .card .in{animation:none}
  .cap{transition:none}
}
</style>

<div class="wrap"><div class="inner">
  <!-- ゲーム -->
  <section id="game" class="screen" hidden>
    <div class="top">
      <div class="logo">コマ割りダンジョン<small id="chname">序章</small></div>
      <div class="pno"><span>P.</span><b id="pno">1</b><span id="pmax">/ 10</span></div>
      <button class="tocbtn" id="toToc" type="button">目次</button>
    </div>
    <div class="cap" id="cap"></div>
    <div class="stage" id="stage"><canvas id="cv" aria-label="漫画のページ。コマの境界線をドラッグして動かす。吹き出しは相手のいるコマへドラッグして置く"></canvas></div>
    <div class="card" id="card" hidden><div class="in"><div class="t" id="cardT">脱出！<small id="cardS"></small></div><button id="next" type="button">次のページ</button></div></div>
    <div class="bottom">
      <button class="sub" id="quit" type="button">やめる</button>
      <button class="sub" id="undo" type="button" aria-label="1手戻す"><b class="ic undo"></b>1手戻す</button>
      <button class="sub" id="reset" type="button" aria-label="最初の配置に戻す"><b class="ic rst"></b>最初から</button>
      <button class="go" id="go" type="button">進む<i></i></button>
    </div>
  </section>

  <!-- 目次 -->
  <section id="toc" class="screen" hidden>
    <div class="top">
      <div class="logo">コマ割りダンジョン<small>目次</small></div>
    </div>
    <div class="scroll">
      <div class="sec chh"><span class="cht">序章<small>はじまりのページ</small></span><span id="tocN1"></span></div>
      <div class="pages" id="tocPages1"></div>
      <div class="sec chh"><span class="cht">第2章<small>ふたりと見張り</small></span><span id="tocN2"></span></div>
      <p class="chlead">主人公がふたりに。見張りの目と、相手に届ける一言。</p>
      <div class="pages" id="tocPages2"></div>
      <div class="sec">本編 <span>完全版</span></div>
      <div class="chap2">
        <div class="ttl">第3章：風と歯車<small>12ページ</small></div>
        <p>風がコマを押し、歯車がとなりのコマを回す。</p>
        <div class="pages" id="tocPaid"></div>
      </div>
      <button class="big" id="tocGo" type="button">つづきから</button>
      <button class="ghost" id="tocEnd" type="button">おわる</button>
    </div>
  </section>

  <!-- 終了 -->
  <section id="end" class="screen" hidden>
    <div class="top">
      <div class="logo">コマ割りダンジョン<small id="endSub">序章</small></div>
    </div>
    <div class="scroll">
      <div class="h1" id="endTitle">序章 おわり</div>
      <div class="score"><b id="endN">0</b><span id="endMax">/ 20 ページ脱出</span></div>
      <div class="sec">本編 <span id="endSec">全5章・57ページ</span></div>
      <ul class="chs" id="chs"></ul>
      <div class="q">有料の完全版があったら、いくらなら買いますか？</div>
      <div class="opts" id="opts"></div>
      <div class="thanks" id="thanks"></div>
      <button class="big" id="again" type="button">もう一度遊ぶ</button>
      <button class="ghost" id="endToc" type="button">目次へ</button>
    </div>
  </section>
</div></div>

<script id="logic">
const L = (() => {
  'use strict';
  /* ---- ルール ----
   * ページ = W×H のマス。境界線（縦・横の直線）でコマ A〜D に分かれる。
   * 各コマは「自分の場面（ページ大のマス目）」を窓として見せる。コマにあるマス＝その窓から見えるマスだけ。
   *   境界を動かす → あるマスがどのコマの場面を見せるかが変わる（広げると隠れていたマスが現れ、縮めると消える）。
   * マス: '#' 壁, '.' 床, 'S' 主人公, 'E' 出口, 'F' 火, 'W' 水
   * 移動: 上下左右。床・出口・消えた火のマスだけ通れる。境界をまたぐ移動も同じ（両側が通れる位置＝扉）。
   * 水: 見えている水マスが境界に接すると、隣のコマに流れ込み、そのコマの中で（壁と水を除く）つながったマスに広がり、火を消す。
   *     流れ込んだ水はさらに隣へは流れない。水マス自体は通れない。
   * 火: 見えている限り燃えていて通れない（隠せば無い）。
   * 制約: 各コマは縦横 MIN マス以上。主人公のマスは主人公のコマから外れない。
   *
   * ---- 第2章で増えるもの ----
   * 'T' 2人目の主人公：S と T の両方が出口（どれでも・同じでも可）に着けばクリア。T も自分のコマから外れない。
   * '>' '<' 'v' '^' 見張り：そのマスは通れない。向いている方向へ、見張りのコマの端（見えている範囲の端）まで視線が届く（壁も越える）。
   *     視線のマスを歩くと見つかって失敗。視線は自分のコマの中だけ。見張りが隠れれば（コマの外）視線も無い。
   * 'O' 穴：通れない。
   * 言葉（def.words）：主人公（by:0）かヒロイン（by:1）が持つ一言。相手のいるコマのマスに置く（put[k] = [x, y]）。
   *     置ける所は言葉ごとに決まっている：ここ！＝穴・水 → 足場（通れる）／しーっ＝見張り → 眠る（視線なし）／わっ！＝見張り → 反対を向く。
   *     効くのは「声が届いている」間だけ：話し手のコマと相手のコマが境界を接している（辺が1マス以上重なる）こと。
   *     置いた物は相手のコマの絵に貼られる＝そのマスがコマの外に出たら（窓から見えなくなったら）効かない。
   *     状態は境界の位置 b と置き場所 put だけで決まる（置いた順番には依らない）。 */
  const MIN = 2;
  const GUARD = { '>': [1, 0], '<': [-1, 0], 'v': [0, 1], '^': [0, -1] };
  const WORDS = {
    koko: { text: 'ここ！', on: t => t === 'O' || t === 'W' },
    shh: { text: 'しーっ', on: t => !!GUARD[t] },
    wa: { text: 'わっ！', on: t => !!GUARD[t] },
  };

  function panelsOf(node, out = []) {
    if (typeof node === 'string') { out.push(node); return out; }
    panelsOf(node[2], out); panelsOf(node[3], out); return out;
  }
  function boundariesOf(node, out = []) {
    if (typeof node === 'string') return out;
    out.push({ id: node[1], axis: node[0] }); boundariesOf(node[2], out); boundariesOf(node[3], out); return out;
  }

  function parse(def) {
    const W = def.w, H = def.h, ids = panelsOf(def.layout).sort();
    const layers = {}; ids.forEach(id => (layers[id] = []));
    if (def.rows.length !== H) throw new Error(def.name + ': rows ' + def.rows.length + ' != ' + H);
    def.rows.forEach((r, y) => {
      const parts = r.trim().split(/\s+/);
      if (parts.length !== ids.length) throw new Error(def.name + ': row ' + y + ' needs ' + ids.length + ' parts');
      ids.forEach((id, i) => { if (parts[i].length !== W) throw new Error(def.name + ': row ' + y + ' ' + id + ' width'); layers[id].push(parts[i]); });
    });
    const heroes = [], exits = [];
    ids.forEach(id => layers[id].forEach((row, y) => [...row].forEach((ch, x) => {
      if (ch === 'S' || ch === 'T') {
        const kind = ch === 'S' ? 0 : 1;
        if (heroes.some(h => h.kind === kind)) throw new Error(def.name + ': two ' + ch);
        heroes.push({ panel: id, x, y, kind });
      }
      if (ch === 'E') exits.push({ panel: id, x, y });
    })));
    heroes.sort((p, q) => p.kind - q.kind);
    if (!heroes.length || heroes[0].kind !== 0) throw new Error(def.name + ': no S');
    const words = (def.words || []).map(q => {
      if (!WORDS[q.w] || heroes.length < 2 || (q.by !== 0 && q.by !== 1)) throw new Error(def.name + ': bad word');
      return { by: q.by, w: q.w, text: WORDS[q.w].text, from: heroes[q.by].panel, to: heroes[1 - q.by].panel };
    });
    if (new Set(words.map(q => q.by)).size !== words.length) throw new Error(def.name + ': one word per hero');
    const bounds = boundariesOf(def.layout).map(b => Object.assign(b, { fixed: (def.fixed || []).includes(b.id) }));
    const lv = { name: def.name, hint: def.hint || '', ch: def.ch || 1, W, H, layout: def.layout, ids, layers,
      hero: heroes[0], heroes, exits, words, bounds, init: Object.assign({}, def.b) };
    lv.targets = words.map((q, k) => targets(lv, k));
    return lv;
  }

  /* 言葉 k を置ける（効く絵がある）マス：相手のコマの場面の中で、言葉に合う所 */
  function targets(lv, k) {
    const q = lv.words[k], out = [];
    lv.layers[q.to].forEach((row, y) => [...row].forEach((t, x) => { if (WORDS[q.w].on(t)) out.push([x, y]); }));
    return out;
  }
  /* 2つのコマが境界を接しているか（辺が1マス以上重なる）。同じコマなら届く */
  function touching(r, s) {
    if (r === s) return true;
    const oy = Math.min(r.y1, s.y1) - Math.max(r.y0, s.y0), ox = Math.min(r.x1, s.x1) - Math.max(r.x0, s.x0);
    return ((r.x1 === s.x0 || s.x1 === r.x0) && oy > 0) || ((r.y1 === s.y0 || s.y1 === r.y0) && ox > 0);
  }
  const inRect = (r, x, y) => x >= r.x0 && x < r.x1 && y >= r.y0 && y < r.y1;
  const samePut = (p, q) => (!p && !q) || (!!p && !!q && p[0] === q[0] && p[1] === q[1]);
  /* 今の配置で、言葉 k の声が相手に届くか／(x, y) に置いて効くか */
  function reaches(lv, b, k) { const { rects } = geometry(lv, b), q = lv.words[k]; return touching(rects[q.from], rects[q.to]); }
  function canPut(lv, b, k, x, y) {
    const { rects } = geometry(lv, b), q = lv.words[k];
    return touching(rects[q.from], rects[q.to]) && inRect(rects[q.to], x, y) && WORDS[q.w].on(lv.layers[q.to][y][x]);
  }

  /* コマの矩形と境界線の線分 */
  function geometry(lv, b) {
    const rects = {}, segs = {};
    (function rec(node, x0, y0, x1, y1) {
      if (typeof node === 'string') { rects[node] = { x0, y0, x1, y1 }; return; }
      const [axis, id, a, c] = node, p = b[id];
      if (axis === 'h') { segs[id] = { id, axis, pos: p, from: x0, to: x1, lo: y0, hi: y1 }; rec(a, x0, y0, x1, p); rec(c, x0, p, x1, y1); }
      else { segs[id] = { id, axis, pos: p, from: y0, to: y1, lo: x0, hi: x1 }; rec(a, x0, y0, p, y1); rec(c, p, y0, x1, y1); }
    })(lv.layout, 0, 0, lv.W, lv.H);
    return { rects, segs };
  }

  function valid(lv, b) {
    const { rects } = geometry(lv, b);
    for (const id of lv.ids) {
      const r = rects[id];
      if (r.x1 - r.x0 < MIN || r.y1 - r.y0 < MIN) return false;
    }
    for (const h of lv.heroes) {
      const r = rects[h.panel];
      if (!(h.x >= r.x0 && h.x < r.x1 && h.y >= r.y0 && h.y < r.y1)) return false;
    }
    return true;
  }

  /* 他の境界を固定したときに、この境界が取れる範囲（連続） */
  function range(lv, b, id) {
    const bd = lv.bounds.find(q => q.id === id), max = bd.axis === 'h' ? lv.H : lv.W;
    const cur = b[id]; let lo = cur, hi = cur;
    const ok = v => valid(lv, Object.assign({}, b, { [id]: v }));
    while (lo - 1 >= 1 && ok(lo - 1)) lo--;
    while (hi + 1 <= max - 1 && ok(hi + 1)) hi++;
    return [lo, hi];
  }

  const D4 = [[1, 0], [-1, 0], [0, 1], [0, -1]];

  /* 現在の配置で見えている世界を組み立てる */
  function compose(lv, b, put = b.put, relax = false) {
    const { W, H } = lv, { rects, segs } = geometry(lv, b);
    const owner = [], base = [];
    for (let y = 0; y < H; y++) { owner.push([]); base.push([]); }
    for (const id of lv.ids) {
      const r = rects[id];
      for (let y = r.y0; y < r.y1; y++) for (let x = r.x0; x < r.x1; x++) { owner[y][x] = id; base[y][x] = lv.layers[id][y][x]; }
    }
    // 言葉：声が届いていて、置いたマスが相手のコマの窓の中なら効く
    const sleep = new Set(), flip = new Set();
    const words = lv.words.map((q, k) => {
      const p = put && put[k];
      const reach = touching(rects[q.from], rects[q.to]);
      if (!p) return { k, put: null, reach, inWin: false, on: false };
      const [x, y] = p, inWin = inRect(rects[q.to], x, y), on = reach && inWin && WORDS[q.w].on(lv.layers[q.to][y][x]);
      if (on) { if (q.w === 'koko') base[y][x] = 'P'; else if (q.w === 'shh') sleep.add(y * W + x); else flip.add(y * W + x); }
      return { k, put: p, reach, inWin, on };
    });
    // relax（ソルバーの枝刈り用）：届いている言葉が、置ける所すべてに同時に効いたとみなす（見張りは眠る＝一番ゆるい）
    if (relax) lv.words.forEach((q, k) => {
      if (!touching(rects[q.from], rects[q.to])) return;
      for (const [x, y] of lv.targets[k]) if (inRect(rects[q.to], x, y)) { if (q.w === 'koko') base[y][x] = 'P'; else sleep.add(y * W + x); }
    });
    const wet = base.map(row => row.map(() => false)), contacts = [];
    const inb = (x, y) => x >= 0 && y >= 0 && x < W && y < H;
    const dry = t => t === '#' || t === 'W' || t === 'O' || GUARD[t];
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      if (base[y][x] !== 'W') continue;
      for (const [dx, dy] of D4) {
        const nx = x + dx, ny = y + dy;
        if (!inb(nx, ny) || owner[ny][nx] === owner[y][x]) continue;
        if (dry(base[ny][nx])) continue;
        contacts.push({ x, y, nx, ny });
        const q = owner[ny][nx], st = [[nx, ny]];
        if (wet[ny][nx]) continue;
        wet[ny][nx] = true;
        while (st.length) {
          const [cx, cy] = st.pop();
          for (const [ex, ey] of D4) {
            const mx = cx + ex, my = cy + ey;
            if (!inb(mx, my) || owner[my][mx] !== q || wet[my][mx]) continue;
            if (dry(base[my][mx])) continue;
            wet[my][mx] = true; st.push([mx, my]);
          }
        }
      }
    }
    // 見張りの視線：向いている方向へ、自分のコマの端まで
    const sight = base.map(row => row.map(() => false)), guards = [];
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      let d = GUARD[base[y][x]]; if (!d) continue;
      const asleep = sleep.has(y * W + x), turned = flip.has(y * W + x);
      if (turned) d = [-d[0], -d[1]];
      const r = rects[owner[y][x]]; let cx = x + d[0], cy = y + d[1], len = 0;
      while (!asleep && cx >= r.x0 && cx < r.x1 && cy >= r.y0 && cy < r.y1) { sight[cy][cx] = true; len++; cx += d[0]; cy += d[1]; }
      guards.push({ x, y, dx: d[0], dy: d[1], len, panel: owner[y][x], asleep, turned });
    }
    const pass = base.map((row, y) => row.map((t, x) => t === '.' || t === 'S' || t === 'T' || t === 'E' || t === 'P' || (t === 'F' && wet[y][x])));
    const heroes = lv.heroes.map(h => ({ x: h.x, y: h.y, kind: h.kind }));
    return { W, H, rects, segs, owner, base, wet, pass, contacts, words, sight, guards, heroes, hero: heroes[0] };
  }

  /* 主人公 hi から歩ける範囲。safe なら視線のマスを通らない（立っている所が視線の中なら一歩も動けない） */
  function reach(world, hi = 0, safe = true) {
    const { W, H, pass, sight } = world, hero = world.heroes[hi];
    const dist = pass.map(r => r.map(() => -1)), prev = pass.map(r => r.map(() => null));
    dist[hero.y][hero.x] = 0; const q = [[hero.x, hero.y]];
    const spotted = sight[hero.y][hero.x];
    if (safe && spotted) return { dist, prev, exit: null, count: 1, spotted };
    for (let i = 0; i < q.length; i++) {
      const [x, y] = q[i];
      for (const [dx, dy] of D4) {
        const nx = x + dx, ny = y + dy;
        if (nx < 0 || ny < 0 || nx >= W || ny >= H || dist[ny][nx] >= 0 || !pass[ny][nx] || (safe && sight[ny][nx])) continue;
        dist[ny][nx] = dist[y][x] + 1; prev[ny][nx] = [x, y]; q.push([nx, ny]);
      }
    }
    let exit = null;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++)
      if (world.base[y][x] === 'E' && dist[y][x] >= 0 && (!exit || dist[y][x] < dist[exit[1]][exit[0]])) exit = [x, y];
    return { dist, prev, exit, count: q.length, spotted };
  }

  function pathTo(r, tx, ty) {
    const out = []; let c = [tx, ty];
    while (c) { out.unshift(c); c = r.prev[c[1]][c[0]]; }
    return out;
  }

  /* 1人ぶんの「進む」：見つからずに出口へ → その道。見つかる道しか無い → 視線に入った所で止まる。どちらも無い → 出口に一番近い所まで */
  function planHero(w, hi) {
    const h = w.heroes[hi];
    if (w.sight[h.y][h.x]) return { win: false, caught: true, path: [[h.x, h.y]] };
    const r = reach(w, hi, true);
    if (r.exit) return { win: true, caught: false, path: pathTo(r, r.exit[0], r.exit[1]) };
    const u = reach(w, hi, false);
    if (u.exit) {
      const p = pathTo(u, u.exit[0], u.exit[1]), k = p.findIndex(([x, y]) => w.sight[y][x]);
      return { win: false, caught: true, path: p.slice(0, k + 1) };
    }
    const targets = w.base.flatMap((row, y) => row.map((t, x) => (t === 'E' ? [x, y] : null))).filter(Boolean);
    const goals = targets.length ? targets : [[h.x, h.y]];
    let best = [h.x, h.y], bd = Infinity, bl = 0;
    for (let y = 0; y < w.H; y++) for (let x = 0; x < w.W; x++) {
      if (r.dist[y][x] < 0) continue;
      const d = Math.min(...goals.map(([gx, gy]) => Math.abs(gx - x) + Math.abs(gy - y)));
      if (d < bd || (d === bd && r.dist[y][x] < bl)) { bd = d; bl = r.dist[y][x]; best = [x, y]; }
    }
    return { win: false, caught: false, path: pathTo(r, best[0], best[1]) };
  }

  /* 「進む」：全員ぶん。path は1人目（序章との互換） */
  function plan(lv, b) {
    const w = compose(lv, b), res = w.heroes.map((_, i) => planHero(w, i));
    return { win: res.every(r => r.win), path: res[0].path, paths: res.map(r => r.path), res, world: w };
  }

  function isWin(lv, b) {
    const w = compose(lv, b);
    return w.heroes.every((_, i) => !!reach(w, i, true).exit);
  }

  /* ソルバー：動かせる境界の位置を総当たり × 言葉の置き場所（その配置で効くマス＋置かない）を総当たり
   * total = 境界の配置の数、combos = 境界の配置 × 置き方 の数。言葉のある問題の解は put を持つ */
  function solve(lv) {
    const free = lv.bounds.filter(q => !q.fixed), wins = []; let total = 0, combos = 0;
    const max = q => (q.axis === 'h' ? lv.H : lv.W) - 1;
    (function rec(i, b) {
      if (i === free.length) {
        if (!valid(lv, b)) return; total++;
        if (!lv.words.length) { combos++; if (isWin(lv, b)) wins.push(Object.assign({}, b)); return; }
        // 枝刈り：どの置き方でも届かない（一番ゆるく見ても出口に着けない）配置は、置き方を数えるだけにする
        const { rects } = geometry(lv, b), wr = compose(lv, b, null, true), hopeless = !wr.heroes.every((_, i) => !!reach(wr, i, true).exit);
        const opts = lv.words.map((q, k) => [null].concat(touching(rects[q.from], rects[q.to]) ? lv.targets[k].filter(([x, y]) => inRect(rects[q.to], x, y)) : []));
        (function each(k, put) {
          if (k === opts.length) { combos++; if (hopeless) return; const s = Object.assign({}, b, { put }); if (isWin(lv, s)) wins.push(s); return; }
          for (const o of opts[k]) each(k + 1, put.concat([o]));
        })(0, []);
        return;
      }
      const q = free[i];
      for (let v = 1; v <= max(q); v++) rec(i + 1, Object.assign({}, b, { [q.id]: v }));
    })(0, Object.assign({}, lv.init));
    return { total, combos, wins };
  }

  /* ヒント：今の配置に一番近い解を選び、そこへ向けて今すぐ動かせる境界を1本返す。
   * 境界がそろっていて言葉の置き場所だけ違うなら { word: k, to: [x, y] | null } を返す */
  function hint(lv, b, wins) {
    const free = lv.bounds.filter(q => !q.fixed);
    const putOf = (s, k) => (s.put && s.put[k]) || null;
    let best = null, bs = Infinity;
    for (const w of wins) {
      let n = 0, d = 0;
      for (const q of free) if (w[q.id] !== b[q.id]) { n++; d += Math.abs(w[q.id] - b[q.id]); }
      lv.words.forEach((_, k) => { if (!samePut(putOf(w, k), putOf(b, k))) n++; });
      if (n * 100 + d < bs) { bs = n * 100 + d; best = w; }
    }
    if (!best || bs === 0) return null;
    if (free.every(q => best[q.id] === b[q.id])) {
      const k = lv.words.findIndex((_, k) => !samePut(putOf(best, k), putOf(b, k)));
      return { word: k, to: putOf(best, k) };
    }
    let fallback = null;
    for (const q of free) {
      if (best[q.id] === b[q.id]) continue;
      const dir = Math.sign(best[q.id] - b[q.id]), [lo, hi] = range(lv, b, q.id);
      const h = { id: q.id, dir, to: best[q.id] };
      if ((dir > 0 && hi > b[q.id]) || (dir < 0 && lo < b[q.id])) return h;
      fallback = fallback || h;
    }
    return fallback;
  }

        }
      } else if (!r.win) ats.push({ at: p, caught: false });
    });
    fail = { t0: performance.now(), ats, catchers };
    if (catchers.length && navigator.vibrate) try { navigator.vibrate([30, 40, 30]); } catch (e) {}
    setTimeout(() => {
      fail = null;
      const back = plan.paths.map(p => p.slice().reverse()), n = Math.max(...back.map(p => p.length)) - 1;
      if (n >= 1) walk = { paths: back, n, t0: performance.now(), win: false, back: true };
      else { heroPos = lv.heroes.map(() => null); busy = false; $('#go').disabled = false; syncButtons(); }
    }, reduced ? 600 : 1100);
  }
  function drawFail(now) {
    const a = Math.min(1, (now - fail.t0) / 200);
    ctx.globalAlpha = a;
    for (const f of fail.ats) {
      const p = f.at, x = X(p[0] + .5) + cell * .32, y = Y(p[1]) - cell * .05;
      if (f.caught) {
        // ギザギザの叫び吹き出し「！？」
        ctx.fillStyle = COL.white; ctx.strokeStyle = COL.ink; ctx.lineWidth = 2;
        ctx.beginPath();
        for (let k = 0; k < 16; k++) { const ang = k / 16 * Math.PI * 2, rr = cell * (k % 2 ? .26 : .4); ctx.lineTo(x + Math.cos(ang) * rr * 1.25, y + Math.sin(ang) * rr); }
        ctx.closePath(); ctx.fill(); ctx.stroke();
        sfx('！？', x, y + 1, COL.fire, cell * .34, 0);
        continue;
      }
      ctx.fillStyle = COL.white; ctx.strokeStyle = COL.ink; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(x, y, cell * .36, cell * .24, 0, 0, 7); ctx.fill(); ctx.stroke();
      ctx.fillStyle = COL.ink; for (let k = -1; k <= 1; k++) { ctx.beginPath(); ctx.arc(x + k * cell * .11, y, 2.4, 0, 7); ctx.fill(); }
      ctx.fillStyle = COL.white; ctx.beginPath(); const sx = X(p[0] + .5) - cell * .3, sy = Y(p[1] + .3);
      ctx.moveTo(sx, sy - 7); ctx.quadraticCurveTo(sx + 5, sy + 2, sx, sy + 4); ctx.quadraticCurveTo(sx - 5, sy + 2, sx, sy - 7); ctx.fill(); ctx.stroke();
    }
    if (fail.catchers.length) sfx('見つかった！', cw / 2, Y(.6), COL.ink, cell * .5, -.06);
    ctx.globalAlpha = 1;
  }

  /* ---- クリア ---- */
  function onWin() {
    win = { t0: performance.now() };
    const wasCleared = cleared.has(li);
    stopPageTimer();
    cleared.add(li); prog.cleared = [...cleared]; saveProg();
    const n = cleared.size, page = li + 1, c = CH[chOf(li)], last = li === c.from + c.n - 1;
    M.apply(m => {
      m.pagesCleared = Math.max(m.pagesCleared || 0, n);
      m.bestScore = Math.max(m.bestScore || 0, page);
      m.ch2Cleared = Math.max(m.ch2Cleared || 0, ch2Count());
      if (li === 0 && firstSession && Date.now() - openedAt <= 60000) m.firstRunCleared = true;
      if (li === N - 1 && runActive) m.runsCompleted++;
    });
    if (li === N - 1) runActive = false;
    syncButtons();
    setTimeout(() => {
      const rel = li - c.from + 1;
      if (last) {
        $('#cardT').firstChild.textContent = c.title + '、突破！';
        $('#cardS').textContent = `全${c.n}ページ脱出`;
        $('#next').textContent = li === N - 1 ? 'おわりへ' : CH[chOf(li) + 1].title + 'へ';
      } else {
        $('#cardT').firstChild.textContent = '脱出！';
        $('#cardS').textContent = wasCleared ? `P.${rel} ふたたび` : `P.${rel} / ${c.n}`;
        $('#next').textContent = '次のページ';
      }
      $('#card').hidden = false;
      $('#next').focus({ preventScroll: true });
    }, reduced ? 200 : 900);
  }
  function drawWin(now) {
    const a = Math.min(1, (now - win.t0) / 300);
    const ps = lv.heroes.map((h, i) => heroPos[i] || [h.x, h.y]);
    const mx = ps.reduce((s, p) => s + p[0], 0) / ps.length, my = ps.reduce((s, p) => s + p[1], 0) / ps.length;
    const cx = X(mx + .5), cy = Y(my + .5);
    ctx.fillStyle = 'rgba(252,252,250,' + (.55 * a) + ')'; ctx.fillRect(0, 0, cw, chh);
    focusLines(cx, cy, cell * 1.1, Math.max(cw, chh) * 1.2, reduced ? 0 : now / 1000, 70, a);
    ps.forEach((p, i) => hero(X(p[0] + .5), Y(p[1] + .5), cell * 1.25, 0, false, lv.heroes[i].kind, heroDir[i] || 1));
    const s = cell * (1.1 + (1 - a) * .6);
    sfx('ドンッ', cw / 2, cy > chh / 2 ? cy - cell * 2 : cy + cell * 2, COL.ink, s, -.08);
  }

  /* ---- 境界のドラッグ：指に追従し、離すとマスに吸着 ---- */
  function local(e) { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
  function hit(p) {
    let best = null, bd = Math.max(20, cell * .45);
    for (const q of lv.bounds) {
      if (q.fixed) continue;
      const s = world.segs[q.id];
      const [perp, along, a0, a1] = s.axis === 'v' ? [Math.abs(p[0] - X(s.pos)), p[1], Y(s.from), Y(s.to)] : [Math.abs(p[1] - Y(s.pos)), p[0], X(s.from), X(s.to)];
      if (along < a0 - 6 || along > a1 + 6) continue;
      const [hx, hy] = handleSpot(s), dh = Math.hypot(p[0] - hx, p[1] - hy);
      const d = Math.min(perp, dh * .8);
      if (d < bd) { bd = d; best = q; }
    }
    return best;
  }
  // つまみ（黒い丸角）の上なら、吹き出しより境界を優先
  function hitPill(p) {
    for (const q of lv.bounds) { if (q.fixed) continue; const [hx, hy] = handleSpot(world.segs[q.id]); if (Math.hypot(p[0] - hx, p[1] - hy) < Math.max(16, cell * .42)) return q; }
    return null;
  }
  const toCells = (axis, p) => ((axis === 'v' ? p[0] : p[1]) - PAD) / cell;
  /* ---- 言葉のドラッグ：話し手の吹き出し（または置いた物）をつまみ、相手のコマの置ける所で離す ---- */
  function hitWord(p) {
    for (let k = lv.words.length - 1; k >= 0; k--) {
      const at = putOf(k);
      if (!at || !world.words[k].inWin) {
        const g = speakerBubble(k), rx = at ? g.rx * .55 : g.rx, ry = at ? g.ry * .55 : g.ry, cy = at ? g.cy + g.ry * .45 : g.cy;
        if (((p[0] - g.cx) / (rx + 10)) ** 2 + ((p[1] - cy) / (ry + 10)) ** 2 <= 1) return k;
      } else if (p[0] >= X(at[0]) - 4 && p[0] <= X(at[0] + 1) + 4 && p[1] >= Y(at[1]) - cell * .7 && p[1] <= Y(at[1] + 1) + 4) return k;
    }
    return -1;
  }
  // 指の少し上にしっぽの先（＝置く所）。マウスは指先そのもの
  function wordGeom(d, p) {
    const [rx, ry] = bubbleSize(), off = d.mouse ? 0 : cell * .55;
    const tip = [p[0], p[1] - off];
    let cx = tip[0] + rx * .35, cy = tip[1] - cell * .3 - ry;
    if (cy - ry < 2) { cx = tip[0] + (tip[0] + cell * .4 + rx * 2 < cw ? 1 : -1) * (cell * .4 + rx); cy = Math.max(ry + 2, tip[1] - ry * .3); }
    d.cx = cx; d.cy = cy; d.tip = tip;
    // 置ける所：しっぽの先のマス。少し外れても一番近い置ける所に吸い付く
    const q = lv.words[d.k], fx = (tip[0] - PAD) / cell, fy = (tip[1] - PAD) / cell;
    let best = null, bd = .9;
    for (const [x, y] of lv.targets[d.k]) {
      if (!L.canPut(lv, b, d.k, x, y)) continue;
      const dd = Math.hypot(fx - (x + .5), fy - (y + .5));
      if (dd < bd) { bd = dd; best = [x, y]; }
    }
    d.at = best;
    const tx = Math.floor(fx), ty = Math.floor(fy);
    d.over = tx >= 0 && ty >= 0 && tx < lv.W && ty < lv.H && world.owner[ty][tx] === q.to;
  }
  function startWordDrag(k, p, e) {
    const prev = Object.assign({}, b), from = putOf(k);
    if (from) { // 持ち上げた言葉は、運んでいる間は効かない
      const put = lv.words.map((_, j) => putOf(j)); put[k] = null; b = Object.assign({}, b, { put }); recompute(true);
    }
    wdrag = { k, pid: e.pointerId, prev, from, mouse: e.pointerType === 'mouse' };
    wordGeom(wdrag, p);
    morph = null; touched = true; hintAt = performance.now() + 30000;
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  }
  function endWordDrag() {
    const d = wdrag; wdrag = null;
    const put = lv.words.map((_, j) => putOf(j)); put[d.k] = d.at;
    b = Object.assign({}, b, { put });
    if (d.at) { morph = { k: d.k, t0: performance.now(), at: d.at, cx: d.cx, cy: d.cy }; addPop('ポンッ', d.at[0] + .5, d.at[1] - .2, WSTY[lv.words[d.k].w].ink, 18); if (navigator.vibrate) try { navigator.vibrate(12); } catch (err) {} }
    else if (d.over && !L.reaches(lv, b, d.k)) addPop('とどかない…', (d.tip[0] - PAD) / cell, (d.tip[1] - PAD) / cell - .3, COL.ink2, 16);
    if (!L.samePut(d.at, d.from)) { pushHist(d.prev); M.apply(m => { m.totalDrags = (m.totalDrags || 0) + 1; }, true); }
    recompute(true); syncButtons();
  }

  cv.addEventListener('pointerdown', e => {
    if (busy || win || drag || wdrag) return;
    const p = local(e), onPill = hitPill(p), wk = onPill ? -1 : hitWord(p);
    if (wk >= 0) { e.preventDefault(); startWordDrag(wk, p, e); return; }
    const q = onPill || hit(p);
    if (q) {
      e.preventDefault();
      const [lo, hi] = L.range(lv, b, q.id);
      drag = { id: q.id, axis: q.axis, start: b[q.id], pos: b[q.id], grab: toCells(q.axis, p) - b[q.id], lo, hi, pid: e.pointerId, prev: Object.assign({}, b) };
      slide = null; touched = true;
      try { cv.setPointerCapture(e.pointerId); } catch (err) {}
      return;
    }
    // 主人公をタップしても進む
    for (const h of lv.heroes) if (Math.hypot(p[0] - X(h.x + .5), p[1] - Y(h.y + .5)) < cell * .6) { go(); return; }
  });
  cv.addEventListener('pointermove', e => {
    const p = local(e);
    if (wdrag) { if (e.pointerId !== wdrag.pid) return; e.preventDefault(); wordGeom(wdrag, p); cv.style.cursor = 'grabbing'; return; }
    if (!drag) {
      if (busy || win) { cv.style.cursor = 'default'; return; }
      if (!hitPill(p) && hitWord(p) >= 0) { cv.style.cursor = 'grab'; return; }
      const q = hit(p); cv.style.cursor = q ? (q.axis === 'v' ? 'ew-resize' : 'ns-resize') : 'default'; return;
    }
    if (e.pointerId !== drag.pid) return;
    e.preventDefault();
    // 端では少しだけゴムのように伸びる
    const raw = toCells(drag.axis, p) - drag.grab;
    const over = raw < drag.lo ? raw - drag.lo : raw > drag.hi ? raw - drag.hi : 0;
    drag.pos = Math.max(drag.lo, Math.min(drag.hi, raw)) + Math.sign(over) * Math.min(.25, Math.abs(over) * .25);
    const v = Math.max(drag.lo, Math.min(drag.hi, Math.round(drag.pos)));
    if (v !== b[drag.id]) {
      b[drag.id] = v; recompute(false);
      if (navigator.vibrate) try { navigator.vibrate(4); } catch (err) {}
    }
  });
  const endDrag = e => {
    if (wdrag) { if (e && e.pointerId != null && e.pointerId !== wdrag.pid) return; endWordDrag(); return; }
    if (!drag || (e && e.pointerId != null && e.pointerId !== drag.pid)) return;
    const d = drag; drag = null;
    slide = { id: d.id, from: d.pos, t0: performance.now() };
    if (b[d.id] !== d.start) {
      pushHist(d.prev);
      M.apply(m => { m.totalDrags = (m.totalDrags || 0) + 1; }, true);
    }
    syncButtons();
  };
  cv.addEventListener('pointerup', endDrag);
  cv.addEventListener('pointercancel', endDrag);
  cv.addEventListener('lostpointercapture', endDrag);

  /* ---- ボタン ---- */
  $('#go').addEventListener('click', go);
  $('#undo').addEventListener('click', () => {
    if (busy || drag || wdrag || !hist.length) return;
    const prev = hist.pop(), moved = lv.bounds.find(q => prev[q.id] !== b[q.id]);
    if (moved) slide = { id: moved.id, from: b[moved.id], t0: performance.now() };
    b = prev; recompute(true); syncButtons();
  });
  $('#reset').addEventListener('click', () => {
    if (busy || drag || wdrag) return;
    if (lv.bounds.every(q => b[q.id] === lv.init[q.id]) && !anyPut()) return;
    pushHist(Object.assign({}, b));
    b = Object.assign({}, lv.init); recompute(true); syncButtons();
  });
  $('#next').addEventListener('click', () => { if (li === N - 1) { showEnd(true); return; } startPage(li + 1, false); });
  $('#quit').addEventListener('click', () => { stopPageTimer(); showEnd(false); });
  $('#toToc').addEventListener('click', () => { stopPageTimer(); showToc(); });

  /* ---- 目次 ---- */
  function pageButton(i) {
    const c = CH[chOf(i)], el = document.createElement('button'); el.type = 'button'; el.className = 'pg';
    el.textContent = i - c.from + 1;
    if (cleared.has(i)) el.classList.add('done');
    if (!unlocked(i)) { el.classList.add('lock'); el.disabled = true; el.setAttribute('aria-label', `${c.title} ${i - c.from + 1}ページ 未解放`); const k = document.createElement('i'); k.className = 'lk'; el.appendChild(k); }
    else { el.setAttribute('aria-label', `${c.title} ${i - c.from + 1}ページ`); el.addEventListener('click', () => startPage(i, i === 0 || (i === c.from && !runActive))); }
    if (i === nextPage() && !cleared.has(i)) el.classList.add('next');
    return el;
  }
  function showToc() {
    CH.forEach((c, k) => {
      const box = $('#tocPages' + (k + 1)); box.innerHTML = '';
      for (let i = c.from; i < c.from + c.n; i++) box.appendChild(pageButton(i));
      $('#tocN' + (k + 1)).textContent = `${[...cleared].filter(i => i >= c.from && i < c.from + c.n).length} / ${c.n}`;
    });
    const paid = $('#tocPaid'); paid.innerHTML = '';
    for (let i = 1; i <= 5; i++) {
      const el = document.createElement('div'); el.className = 'pg paid'; el.textContent = i === 5 ? '…' : i;
      if (i < 5) { const k = document.createElement('i'); k.className = 'lk'; el.appendChild(k); }
      paid.appendChild(el);
    }
    $('#tocGo').textContent = cleared.size ? (cleared.size >= N ? 'はじめから' : 'つづきから') : 'はじめる';
    show('toc');
  }
  $('#tocGo').addEventListener('click', () => { const i = cleared.size >= N ? 0 : nextPage(); startPage(i, i === 0); });
  $('#tocEnd').addEventListener('click', () => showEnd(false));

  /* ---- 終了画面 ---- */
  const CHAPS = [
    ['序章', 'はじまりのページ', 10, true], ['第2章', 'ふたりと見張り', 10, true], ['第3章', '風と歯車', 12], ['第4章', '鏡と影', 12], ['第5章', '最後の見開き', 13],
  ];
  const PRICES = ['買わない', '480円', '980円', '1,480円'];
  function showEnd(done) {
    runActive = runActive && !done;
    const c1 = [...cleared].filter(i => i < CH[1].from).length, c2 = ch2Count();
    $('#endTitle').textContent = c2 >= CH[1].n ? '第2章 おわり' : c1 >= CH[0].n && !c2 ? '序章 おわり' : 'ここまで';
    $('#endSub').textContent = c2 ? '第2章' : '序章';
    $('#endN').textContent = cleared.size; $('#endMax').textContent = `/ ${N} ページ脱出`;
    const ul = $('#chs'); ul.innerHTML = '';
    CHAPS.forEach(([n, nm, p, free]) => {
      const li_ = document.createElement('li'); if (!free) li_.className = 'lockd';
      li_.innerHTML = `<span class="n"></span><span class="nm"><small></small></span><span class="st"></span>`;
      li_.querySelector('.n').textContent = n;
      li_.querySelector('.nm').prepend(nm);
      li_.querySelector('small').textContent = `${p}ページ`;
      li_.querySelector('.st').textContent = free ? '無料' : '完全版';
      ul.appendChild(li_);
    });
    $('#endSec').textContent = `全${CHAPS.length}章・${CHAPS.reduce((s, x) => s + x[2], 0)}ページ`;
    renderOpts();
    show('end');
    M.flush();
  }
  function renderOpts() {
    const box = $('#opts'), cur = M.get().priceAnswer; box.innerHTML = '';
    PRICES.forEach(v => {
      const el = document.createElement('button'); el.type = 'button'; el.className = 'opt'; el.textContent = v;
      el.setAttribute('aria-pressed', String(cur === v));
      el.addEventListener('click', () => { M.apply(m => { m.priceAnswer = v; }); renderOpts(); $('#thanks').textContent = 'ありがとう！ 参考にします'; });
      box.appendChild(el);
    });
  }
  $('#again').addEventListener('click', () => startPage(0, true));
  $('#endToc').addEventListener('click', showToc);

  /* ---- はじまり：初めてなら説明なしで1ページ目、2回目以降は目次 ---- */
  if (prog.cleared.length) showToc(); else startPage(0, true);
  M.init();

  // テスト用の窓口：?test=1 のときだけ（ふつうに開いたページからは使えない）
  if (TEST) window.__koma = {
    get b() { return Object.assign({}, b); }, setB(nb) { const prev = Object.assign({}, b); b = Object.assign({}, b, nb); pushHist(prev); recompute(false); syncButtons(); },
    go, startPage, li: () => li, metrics: () => M.get(), hint: () => hint, hintOn: () => hintOn, forceHint() { hintAt = 0; },
    histLen: () => hist.length, dragging: () => (drag ? Object.assign({}, drag) : null), busy: () => busy, won: () => !!win,
    handle(id) { const s = world.segs[id], [x, y] = handleSpot(s), r = cv.getBoundingClientRect(); return [r.left + x, r.top + y, cell]; },
    // 言葉：つまむ所（吹き出しの中心か、置いた物のマス）と、マスの中心（画面座標）
    word(k) { const r = cv.getBoundingClientRect(), at = putOf(k); if (at && world.words[k].inWin) return [r.left + X(at[0] + .5), r.top + Y(at[1] + .5)]; const g = speakerBubble(k); return [r.left + g.cx, r.top + (at ? g.cy + g.ry * .45 : g.cy)]; },
    cell(x, y) { const r = cv.getBoundingClientRect(); return [r.left + X(x + .5), r.top + Y(y + .5), cell]; },
    words: () => world.words.map(o => Object.assign({}, o)), wdrag: () => (wdrag ? Object.assign({}, wdrag) : null), sols: () => sols(),
  };
})();
</script>
</body></html>
