<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.5 system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body><title>帰り道の行商人</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&display=swap');
:root{
  color-scheme: dark;
  --bg:#211a2c;
  --sky1:#251d38; --sky2:#4a2b48; --sky3:#8e4646; --sky4:#d98549;
  --hill1:#3a2741; --hill2:#2a1d33; --hill3:#1c1525; --road:#6b4c3a; --sun:#f3b45c;
  --ink:#f2e4cc; --ink2:#cdb697; --ink3:#9b876f;
  --panel:#1a1320ee; --panel-solid:#1d1624; --line:#f2e4cc26;
  --wood1:#86593a; --wood2:#5f3f27; --wood3:#3a2617; --slot:#2b1c13; --slot-hi:#3a281b; --slot-line:#6e4c33;
  --plaque:#dcc6a2; --plaque2:#c3a77d; --plaque-ink:#2b1c12;
  --gold:#f0b54a; --gold-dk:#a8721f; --good:#a6d67f; --bad:#ea7a63;
  --k-fresh:#4c7a39; --k-cold:#2e5d8c; --k-heat:#c4402a; --k-spice:#a8741c; --k-goods:#56463a;
  --k-brew:#7a2e4b; --k-beast:#a2622b; --k-fine:#b0302f; --k-spoil:#6d685f;
  --awning1:#7c2f2a; --awning2:#d9c3a0;
  --cell:76px;
  --serif:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif;
  --sans:'Hiragino Kaku Gothic ProN','Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);background-image:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 42%,var(--sky3) 78%,var(--sky4) 100%);color:var(--ink);font-family:var(--sans);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#app{height:100%;display:flex;flex-direction:column;gap:6px;max-width:520px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:max(8px,env(safe-area-inset-top,0px));padding-bottom:max(10px,env(safe-area-inset-bottom,0px));touch-action:none}

/* header */
.hd{display:flex;align-items:center;gap:10px;height:42px;flex:none}
.place{flex:1;min-width:0}
.place .vn{font-family:var(--serif);font-weight:800;font-size:20px;letter-spacing:.06em}
.place .sub{font-size:11px;color:var(--ink2);margin-left:8px}
.stage{display:flex;gap:4px;margin-top:2px}
.stage i{display:block;width:18px;height:3px;background:var(--line);border-radius:2px}
.stage i.on{background:var(--gold)}
.goldbox{display:flex;align-items:center;gap:6px;font-family:var(--serif);font-weight:800;font-size:20px;color:var(--gold);position:relative}
.coin{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffd98a,var(--gold) 55%,var(--gold-dk));position:relative}
.coin:after{content:"";position:absolute;left:5.5px;top:5.5px;width:5px;height:5px;background:var(--gold-dk);border-radius:1px}
.goldbox small{font-size:12px;color:var(--ink2);font-weight:600}
.bookbtn{height:34px;padding:0 10px;border:1px solid var(--line);border-radius:4px;font-family:var(--serif);font-size:13px;position:relative;background:#00000030}
.bookbtn .dot{position:absolute;top:-4px;right:-4px;width:9px;height:9px;border-radius:50%;background:var(--bad);display:none}
.bookbtn.new .dot{display:block}

/* notice */
.notice{flex:none;min-height:46px;font-size:12.5px;line-height:1.55;color:var(--ink);display:flex;flex-direction:column;justify-content:center;gap:3px}
.notice .row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.notice .lbl{font-family:var(--serif);font-weight:800;color:var(--gold);font-size:12px;border:1px solid var(--gold-dk);padding:0 5px;border-radius:2px;flex:none}
.notice .muted{color:var(--ink2)}
.notice .ok{color:var(--good)} .notice .ng{color:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:2px;font-size:12px;color:var(--ink2);white-space:nowrap}
.chip b{color:var(--ink);font-weight:700}
.chip.hi b{color:var(--good)} .chip.lo b{color:var(--bad)}

/* top area (market / road) */
.top{flex:1 1 auto;min-height:118px;display:flex;flex-direction:column;justify-content:flex-end;position:relative}
.scenery{position:absolute;left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));top:0;bottom:30px;pointer-events:none;overflow:hidden}
.scenery svg{width:100%;height:100%;display:block}
.stall{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:16px 8px 8px}
.stall:before{content:"";position:absolute;left:-1px;right:-1px;top:-1px;height:9px;border-radius:4px 4px 0 0;
  background:repeating-linear-gradient(90deg,var(--awning1) 0 18px,var(--awning2) 18px 36px)}
.stall .title{position:absolute;top:-10px;left:10px;background:var(--panel-solid);padding:1px 8px;font-family:var(--serif);font-weight:800;font-size:12px;color:var(--ink2);border:1px solid var(--line);border-radius:2px}
.wares{display:flex;gap:5px;justify-content:space-between}
.ware{flex:1;max-width:64px;display:flex;flex-direction:column;align-items:center;gap:2px;touch-action:none;cursor:grab}
.ware .tile{width:100%;aspect-ratio:1/1.08}
.ware .pr{font-size:12px;color:var(--gold);font-weight:700;font-family:var(--serif)}
.ware .q{font-size:10px;color:var(--ink3)}
.ware.out{opacity:.3;pointer-events:none}
.ware.poor .pr{color:var(--bad)}
.stall.drop-on{outline:2px dashed var(--gold);outline-offset:3px}
.stall .sellhint{display:none;position:absolute;inset:0;align-items:center;justify-content:center;background:#140e18e6;border-radius:4px;font-family:var(--serif);font-weight:800;font-size:16px;color:var(--gold);flex-direction:column;gap:4px}
.stall .sellhint small{font-family:var(--sans);font-weight:400;font-size:12px;color:var(--ink2)}
body.dragging-cart .stall.sellable .sellhint{display:flex}
.stall.empty .wares{min-height:84px;align-items:center;justify-content:center;color:var(--ink2);font-size:13px;font-family:var(--serif)}

/* road */
.road{position:relative;height:100%;min-height:118px;border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.road svg{position:absolute;inset:0;width:100%;height:100%}
.road .vill{position:absolute;bottom:10px;transform:translateX(-50%);font-family:var(--serif);font-size:11px;color:var(--ink);text-shadow:0 1px 2px #000;text-align:center;white-space:nowrap}
.road .vill i{display:block;width:16px;height:14px;margin:0 auto 2px;background:var(--hill3);clip-path:polygon(50% 0,100% 45%,100% 100%,0 100%,0 45%)}
.road .vill.lit i{background:var(--gold)}
.road .wagon{position:absolute;bottom:34px;left:8%;transform:translateX(-50%);transition:left .9s ease-in-out;width:34px;height:24px}
.road .wagon .box{position:absolute;left:4px;right:0;top:2px;height:13px;background:var(--wood1);border:1.5px solid var(--wood3);border-radius:2px}
.road .wagon .wh{position:absolute;bottom:0;width:11px;height:11px;border-radius:50%;border:2px solid var(--wood3);background:var(--wood2)}
.road .wagon .man{position:absolute;left:-7px;top:-2px;width:7px;height:20px;background:var(--hill3);border-radius:4px 4px 1px 1px}
.road .wagon.rolling .wh{animation:spin .5s linear infinite}
.road .seg{position:absolute;top:8px;right:10px;font-family:var(--serif);font-size:12px;color:var(--ink);background:#00000050;padding:2px 8px;border-radius:2px}
@keyframes spin{to{transform:rotate(360deg)}}

/* info bar */
.info{flex:none;min-height:32px;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);line-height:1.4}
.info b{color:var(--ink)}
.info .undo{margin-left:auto;font-size:12px;color:var(--gold);border:1px solid var(--gold-dk);border-radius:3px;padding:3px 8px;flex:none}
.info.warn{color:var(--bad)}

/* cart */
.cartwrap{flex:none;align-self:center;position:relative;padding-bottom:12px}
.cart{display:grid;grid-template-columns:repeat(4,var(--cell));grid-template-rows:repeat(3,var(--cell));gap:5px;padding:9px;
  background:linear-gradient(180deg,var(--wood1),var(--wood2));border:3px solid var(--wood3);border-radius:5px;
  box-shadow:0 6px 0 var(--wood3),0 10px 18px #00000070;position:relative}
.cart:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,#00000000 0 14px,#0000001a 14px 15px);pointer-events:none;border-radius:3px}
.wheel{position:absolute;bottom:-4px;width:30px;height:30px;border-radius:50%;border:4px solid var(--wood3);background:
  conic-gradient(from 0deg,var(--wood2) 0 10%,var(--wood3) 10% 13%,var(--wood2) 13% 35%,var(--wood3) 35% 38%,var(--wood2) 38% 60%,var(--wood3) 60% 63%,var(--wood2) 63% 85%,var(--wood3) 85% 88%,var(--wood2) 88%);z-index:-1}
.wheel.l{left:18px} .wheel.r{right:18px}
.cell{position:relative;background:var(--slot);border-radius:3px;box-shadow:inset 0 2px 4px #00000080;border:1px solid var(--slot-line)}
.cell.hover{background:var(--slot-hi);outline:2px solid var(--gold);outline-offset:-1px}
.cell.bad{outline:2px solid var(--bad)}
.cell .tile{position:absolute;inset:3px;touch-action:none;cursor:grab}
.cell.src .tile{box-shadow:0 0 0 3px var(--gold),0 0 18px var(--gold)}
.cell.tgt .tile{animation:shake .4s}
.cell.lifted .tile{opacity:.25}

/* tile = wooden plaque + seal */
.tile{background:linear-gradient(160deg,var(--plaque),var(--plaque2));border-radius:5px;box-shadow:0 2px 0 #00000060,inset 0 0 0 1px #ffffff40;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;color:var(--plaque-ink)}
.seal{width:56%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:var(--kc);color:var(--plaque);
  font-family:var(--serif);font-weight:800;font-size:calc(var(--sz,76px)*.3);line-height:1;box-shadow:inset 0 0 0 2px var(--kc),inset 0 0 0 3.5px var(--plaque)}
.tile .nm{font-size:calc(var(--sz,76px)*.13);font-weight:700;letter-spacing:-.02em;white-space:nowrap;line-height:1}
.k-fresh{--kc:var(--k-fresh)} .k-fresh .seal{border-radius:50%}
.k-cold{--kc:var(--k-cold)} .k-cold .seal{border-radius:22%}
.k-heat{--kc:var(--k-heat)} .k-heat .seal{clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%)}
.k-spice{--kc:var(--k-spice)} .k-spice .seal{clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%)}
.k-goods{--kc:var(--k-goods)} .k-goods .seal{border-radius:2px}
.k-brew{--kc:var(--k-brew)} .k-brew .seal{border-radius:45% 45% 20% 20%}
.k-beast{--kc:var(--k-beast)} .k-beast .seal{border-radius:50%;box-shadow:inset 0 0 0 2px var(--kc),inset 0 0 0 3.5px var(--plaque),0 0 0 2px var(--kc)}
.k-fine{--kc:var(--k-fine)} .k-fine .seal{border-radius:3px;box-shadow:inset 0 0 0 2px var(--kc),inset 0 0 0 3.5px var(--gold)}
.k-fine{background:linear-gradient(160deg,#ead7a8,#d2b06c)}
.k-spoil{--kc:var(--k-spoil)} .k-spoil .seal{border-radius:30% 10% 35% 12%;opacity:.85}
.k-spoil{background:linear-gradient(160deg,#a99c88,#8b7e6b)}
.pips{position:absolute;top:3px;right:4px;display:flex;gap:2px}
.pips i{width:5px;height:5px;border-radius:50%;background:var(--k-fresh)}
.pips i.off{background:#00000030}
.pips.ice i{background:var(--k-cold);border-radius:1px}
.pips.age i{background:var(--k-brew);border-radius:1px}
.pips.ice i.off,.pips.age i.off{background:#00000030}
.ptag{position:absolute;left:3px;top:2px;font-size:calc(var(--sz,76px)*.13);font-weight:800;font-family:var(--serif);color:var(--plaque-ink)}
.ptag.hi{color:#2f6b1f} .ptag.lo{color:#9b2c1c}
.tile.morph{animation:morph .55s ease-out}
.tile.tick{animation:tick .35s}
@keyframes morph{0%{transform:scale(.4) rotate(-12deg);filter:brightness(2)}60%{transform:scale(1.12)}100%{transform:none}}
@keyframes tick{50%{transform:scale(.92)}}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}

/* floating label */
.float{position:fixed;z-index:30;pointer-events:none;font-family:var(--serif);font-weight:800;font-size:15px;color:var(--gold);text-shadow:0 1px 0 #000,0 0 8px #000;white-space:nowrap;transform:translate(-50%,-50%);animation:floatup 1.1s ease-out forwards}
.float.neg{color:var(--bad)} .float.keep{color:#9cc8f0;font-size:12px}
.float .newstamp{display:inline-block;margin-left:5px;font-size:11px;color:var(--plaque);background:var(--k-fine);padding:1px 4px;border-radius:2px;transform:rotate(-6deg)}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,-30%)}15%{opacity:1;transform:translate(-50%,-60%)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-130%)}}

/* preview chips */
.pv{position:absolute;left:50%;top:-8px;transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:2px;background:var(--panel-solid);border:1px solid var(--gold-dk);border-radius:10px;padding:2px 5px 2px 4px;font-size:10px;color:var(--ink);white-space:nowrap;pointer-events:none;box-shadow:0 2px 6px #000}
.pv .ar{color:var(--gold);font-weight:800}
.pv.neg{border-color:var(--bad)} .pv.neg .ar{color:var(--bad)}
.pv.keep{border-color:#7fb1e0} .pv.keep .ar{color:#9cc8f0}
.mini{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;background:var(--kc);color:var(--plaque);font-family:var(--serif);font-weight:800;font-size:11px;line-height:1;border-radius:3px;flex:none}
.mini.q{--kc:#4a3d46;color:var(--ink3)}
.mini.lg{width:26px;height:26px;font-size:16px}

/* ghost */
#ghost{position:fixed;z-index:40;pointer-events:none;display:none;width:var(--cell);height:var(--cell)}
#ghost .tile{position:absolute;inset:0;transform:scale(1.08) rotate(-3deg);box-shadow:0 12px 20px #000a}
#ghost .self{position:absolute;left:100%;top:6px;margin-left:6px;display:flex;flex-direction:column;gap:3px}
#ghost .self .pv{position:static;transform:none}

/* footer */
.ft{flex:none;display:flex;gap:10px;align-items:stretch;height:56px}
.trash{width:86px;flex:none;border:1.5px dashed var(--ink3);border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--serif);font-weight:800;font-size:13px;color:var(--ink2);gap:2px}
.trash small{font-family:var(--sans);font-weight:400;font-size:10px;color:var(--ink3)}
.trash.drop-on{border-color:var(--bad);color:var(--bad);background:#ea7a6320}
.go{flex:1;border-radius:4px;background:linear-gradient(180deg,#e8a64a,#b8742a);color:#2a170a;font-family:var(--serif);font-weight:800;font-size:18px;letter-spacing:.08em;box-shadow:0 3px 0 #6b3f14;display:flex;align-items:center;justify-content:center;gap:8px}
.go small{font-size:12px;font-weight:600;letter-spacing:0}
.go:active{transform:translateY(2px);box-shadow:0 1px 0 #6b3f14}
.go[disabled]{opacity:.45;cursor:default}
.go.alt{background:#00000040;color:var(--ink);box-shadow:none;border:1px solid var(--line)}

/* overlays */
#ov{position:fixed;inset:0;z-index:50;display:none;background:#140e1af7;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch}
#ov.show{display:block}
.ovin{max-width:460px;margin:0 auto;padding:24px max(18px,env(safe-area-inset-right,0px)) 40px max(18px,env(safe-area-inset-left,0px))}
.ttl{font-family:var(--serif);font-weight:800}
.close{position:sticky;top:0;float:right;height:34px;padding:0 12px;border:1px solid var(--line);border-radius:4px;background:var(--panel-solid);font-size:13px}
.title-screen{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding:0 24px max(40px,env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,transparent 30%,#120c18 85%)}
.title-screen h1{font-family:var(--serif);font-weight:800;font-size:40px;line-height:1.15;letter-spacing:.08em;writing-mode:vertical-rl;position:absolute;top:56px;right:36px;text-shadow:0 2px 12px #000}
.title-screen p{font-family:var(--serif);font-size:15px;line-height:1.9;color:var(--ink2);margin-bottom:28px}
.bigbtn{display:block;width:100%;height:56px;border-radius:4px;background:linear-gradient(180deg,#e8a64a,#b8742a);color:#2a170a;font-family:var(--serif);font-weight:800;font-size:19px;letter-spacing:.1em;box-shadow:0 3px 0 #6b3f14}
#ov.titlebg{background:linear-gradient(180deg,var(--sky1),var(--sky2) 40%,var(--sky3) 70%,var(--sky4));overflow:hidden}
.title-art{position:absolute;inset:0;pointer-events:none}

.book h2{font-size:22px;margin:4px 0 4px}
.book .cnt{color:var(--ink2);font-size:13px;margin-bottom:16px}
.entry{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.entry .eq{display:flex;align-items:center;gap:4px;flex:none;width:118px;color:var(--ink3);font-size:12px}
.entry .tx{font-size:13px;line-height:1.45;color:var(--ink)}
.entry.unk .tx{color:var(--ink3)}
.entry .new{font-size:10px;color:var(--plaque);background:var(--k-fine);padding:0 4px;border-radius:2px;margin-left:4px}

.end h2{font-size:15px;color:var(--ink2);font-weight:600;font-family:var(--serif)}
.end .big{font-family:var(--serif);font-weight:800;font-size:46px;color:var(--gold);line-height:1.1;margin:4px 0}
.end .big small{font-size:16px;color:var(--ink2)}
.ranks{display:flex;gap:4px;margin:14px 0 6px}
.ranks div{flex:1;text-align:center;font-family:var(--serif);font-size:12px;padding:8px 0;border:1px solid var(--line);color:var(--ink3);border-radius:3px}
.ranks div.on{background:var(--k-fine);color:var(--plaque);border-color:var(--k-fine);font-weight:800;transform:rotate(-3deg) scale(1.08)}
.end .stat{font-size:13px;color:var(--ink2);margin:8px 0 18px;line-height:1.7}
.end .stat b{color:var(--ink)}
.locks{display:flex;gap:8px;margin:10px 0 22px}
.lock{flex:1;border:1px solid var(--line);border-radius:4px;padding:12px 10px;background:repeating-linear-gradient(135deg,#ffffff06 0 8px,#00000000 8px 16px);position:relative}
.lock .nm{font-family:var(--serif);font-weight:800;font-size:17px}
.lock .ds{font-size:11.5px;color:var(--ink2);margin-top:4px;line-height:1.5}
.lock .lk{position:absolute;top:8px;right:8px;font-size:10px;color:var(--gold);border:1px solid var(--gold-dk);padding:0 4px;border-radius:2px}
.q{font-family:var(--serif);font-weight:800;font-size:15px;margin-bottom:10px;line-height:1.5}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.opts button{height:46px;border:1px solid var(--line);border-radius:4px;font-size:14px;background:#00000030}
.opts button.sel{border-color:var(--gold);color:var(--gold);background:#f0b54a1a;font-weight:700}
.thanks{font-size:12px;color:var(--ink2);min-height:18px;margin-bottom:18px}
.seed{font-size:11px;color:var(--ink3);margin-top:14px;text-align:right}

@media (prefers-reduced-motion: reduce){
  *,*:before,*:after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}
}
</style>

<div id="app">
  <header class="hd">
    <div class="place"><div><span class="vn" id="vname">灰野</span><span class="sub" id="vsub"></span></div><div class="stage" id="stage"><i></i><i></i><i></i></div></div>
    <div class="goldbox"><span class="coin"></span><span id="gold">100</span><small>銭</small></div>
    <button class="bookbtn" id="bookBtn">手帳<span class="dot"></span></button>
  </header>
  <div class="notice" id="notice"></div>
  <section class="top" id="top"></section>
  <div class="info" id="info"></div>
  <div class="cartwrap"><div class="cart" id="cart"></div><div class="wheel l"></div><div class="wheel r"></div></div>
  <footer class="ft">
    <div class="trash" id="trash" data-drop="trash">捨てる<small>ここへ置く</small></div>
    <button class="go" id="go">出発</button>
  </footer>
</div>
<div id="ghost"></div>

<script id="logic">
/* ===== 純粋なゲームロジック（DOM なし。Node でテストする） ===== */
const L = (() => {
  const COLS = 4, ROWS = 3, N = COLS * ROWS;
  const I = (glyph, name, base, kind, extra) => Object.assign({ glyph, name, base, kind }, extra || {});
  const ITEMS = {
    herb: I('草', '薬草', 6, 'fresh', { per: 3 }),
    fish: I('魚', '魚', 12, 'fresh', { per: 3 }),
    meat: I('肉', '肉', 14, 'fresh', { per: 3 }),
    egg: I('卵', '卵', 7, 'fresh', { per: 4 }),
    flower: I('花', '花', 8, 'fresh', { per: 3 }),
    ice: I('氷', '氷', 5, 'cold', { melt: 3 }),
    water: I('水', '水', 2, 'cold'),
    fire: I('火', '火種', 6, 'heat'),
    spice: I('香', '香辛料', 10, 'spice'),
    salt: I('塩', '塩', 6, 'spice'),
    honey: I('蜜', '蜂蜜', 12, 'spice'),
    dye: I('染', '染料', 8, 'spice'),
    cloth: I('布', '布', 10, 'goods'),
    book: I('本', '本', 15, 'goods'),
    iron: I('鉄', '鉄', 18, 'goods'),
    seed: I('種', '種', 4, 'goods'),
    bread: I('糧', 'パン', 6, 'goods'),
    sake: I('酒', '酒', 16, 'brew'),
    barrel: I('樽', '樽', 8, 'brew'),
    cat: I('猫', '猫', 10, 'beast'),
    begg: I('焼', '焼き卵', 20, 'fine'),
    jerky: I('干', '干し肉', 32, 'fine'),
    sfish: I('漬', '塩漬け魚', 28, 'fine'),
    dcloth: I('彩', '染め布', 30, 'fine'),
    asake: I('醸', '熟成酒', 52, 'fine'),
    med: I('薬', '薬', 32, 'fine'),
    sprout: I('苗', '苗', 16, 'fine'),
    wbook: I('濡', '濡れた本', 3, 'spoil'),
    wbread: I('湿', '湿ったパン', 1, 'spoil'),
    rust: I('錆', '錆びた鉄', 5, 'spoil'),
    ash: I('灰', '灰', 0, 'spoil'),
    rot: I('腐', '腐ったもの', 0, 'spoil'),
  };
  const BASE_IDS = ['herb','fish','meat','egg','flower','ice','water','fire','spice','salt','honey','dye','cloth','book','iron','seed','bread','sake','barrel','cat'];
  const CHILLED = ['fish', 'meat', 'herb', 'egg'];

  // 隣接ルール（a の隣にある b が変わる）。手帳の項目でもある。並び順 = 手帳の順
  const RULES = [
    { id: 'chill', a: 'ice', b: CHILLED, keep: true, text: '氷の隣の生ものは、鮮度が落ちない' },
    { id: 'bake', a: 'fire', b: 'egg', to: 'begg', text: '火種の隣の卵が、焼き卵になった' },
    { id: 'melt', a: 'fire', b: 'ice', to: 'water', text: '火種の熱で、氷が溶けて水に' },
    { id: 'burn', a: 'fire', b: 'book', to: 'ash', text: '火の粉が飛んで、本が灰に' },
    { id: 'icepack', a: 'ice', b: 'ice', keep: true, text: '氷どうしを並べると、溶けにくい' },
    { id: 'thaw', a: null, b: 'ice', to: 'water', text: 'ひとりきりの氷は、やがて溶けて水に' },
    { id: 'dry', a: 'spice', b: 'meat', to: 'jerky', text: '香辛料をまぶした肉が、干し肉に（もう腐らない）' },
    { id: 'salt', a: 'salt', b: 'fish', to: 'sfish', text: '塩の隣の魚が、塩漬けに（もう腐らない）' },
    { id: 'dye', a: 'dye', b: 'cloth', to: 'dcloth', text: '染料の隣の布が、染め布に' },
    { id: 'age', a: 'barrel', b: 'sake', to: 'asake', steps: 2, text: '樽の隣で2区間、酒が熟成酒に' },
    { id: 'med', a: 'honey', b: 'herb', to: 'med', text: '蜂蜜と薬草が合わさって、薬に' },
    { id: 'eat', a: 'cat', b: 'fish', to: null, text: '猫が魚を食べてしまった' },
    { id: 'sprout', a: 'water', b: 'seed', to: 'sprout', text: '水の隣の種が、芽を出して苗に' },
    { id: 'bloom', a: 'water', b: 'flower', keep: true, text: '水の隣の花は、しおれない' },
    { id: 'wetbook', a: 'water', b: 'book', to: 'wbook', text: '水がしみて、本が濡れた' },
    { id: 'wetbread', a: 'water', b: 'bread', to: 'wbread', text: '水がしみて、パンが湿った' },
    { id: 'rust', a: 'water', b: 'iron', to: 'rust', text: '水の隣の鉄が、錆びた' },
    { id: 'rot', a: null, b: 'fresh', to: 'rot', text: '生ものは、時間がたつと腐る' },
  ];
  const RULE = Object.fromEntries(RULES.map(r => [r.id, r]));

  function mk(id) {
    const d = ITEMS[id]; const t = { id };
    if (d.per) t.f = d.per;
    if (d.melt) t.m = d.melt;
    if (id === 'sake') t.age = 0;
    return t;
  }
  const clone = g => g.map(t => (t ? Object.assign({}, t) : null));
  function nb(i) {
    const r = Math.floor(i / COLS), c = i % COLS, o = [];
    if (r > 0) o.push(i - COLS);
    if (c < COLS - 1) o.push(i + 1);
    if (r < ROWS - 1) o.push(i + COLS);
    if (c > 0) o.push(i - 1);
    return o;
  }
  const near = (g, i, id) => nb(i).filter(j => g[j] && g[j].id === id);

  /** a の隣にいる b に何が起きるか（ドラッグ中の予告用）。null = 何も起きない */
  function pairEffect(a, b) {
    for (const r of RULES) {
      if (!r.a || r.a !== a) continue;
      const bs = Array.isArray(r.b) ? r.b : [r.b];
      if (bs.includes(b)) return r;
    }
    return null;
  }

  /**
   * 1区間ぶんの変化。処理順は決定的：
   * 1 熱（火種）→ 2 氷の溶け → 3 加工（香辛料・塩・染料・樽・蜂蜜）→ 4 猫 → 5 水 → 6 鮮度
   * 各段階は「段階の始めの状態」を見て同時に適用する。前の段階の結果は次の段階に効く（連鎖）。
   * 返す events は表示の順。minor = まとめて見せる小さな変化
   */
  function simulateSegment(grid) {
    let g = clone(grid); const events = [];
    const push = (phase, rule, cell, src, before, after, minor) =>
      events.push({ phase, rule, cell, src, before: before ? Object.assign({}, before) : null, after: after ? Object.assign({}, after) : null, minor: !!minor });
    let s;
    // 1 熱
    s = clone(g);
    for (let i = 0; i < N; i++) {
      const t = s[i]; if (!t) continue;
      const rid = { ice: 'melt', egg: 'bake', book: 'burn' }[t.id]; if (!rid) continue;
      const src = near(s, i, 'fire'); if (!src.length) continue;
      const nt = mk(RULE[rid].to); g[i] = nt; push(1, rid, i, src, t, nt);
    }
    // 2 氷
    s = clone(g);
    for (let i = 0; i < N; i++) {
      const t = s[i]; if (!t || t.id !== 'ice') continue;
      const pack = near(s, i, 'ice');
      if (pack.length) { push(2, 'icepack', i, pack, t, t, true); continue; }
      const m = (t.m || 1) - 1;
      if (m <= 0) { const nt = mk('water'); g[i] = nt; push(2, 'thaw', i, [], t, nt); }
      else { const nt = Object.assign({}, t, { m }); g[i] = nt; push(2, null, i, [], t, nt, true); }
    }
    // 3 加工
    s = clone(g);
    const CRAFT = { meat: 'dry', fish: 'salt', cloth: 'dye', herb: 'med', sake: 'age' };
    for (let i = 0; i < N; i++) {
      const t = s[i]; if (!t) continue;
      const rid = CRAFT[t.id]; if (!rid) continue;
      const r = RULE[rid]; const src = near(s, i, r.a); if (!src.length) continue;
      if (rid === 'age') {
        const age = (t.age || 0) + 1;
        if (age >= r.steps) { const nt = mk('asake'); g[i] = nt; push(3, 'age', i, src, t, nt); }
        else { const nt = Object.assign({}, t, { age }); g[i] = nt; push(3, 'aging', i, src, t, nt, true); }
      } else { const nt = mk(r.to); g[i] = nt; push(3, rid, i, src, t, nt); }
    }
    // 4 猫
    s = clone(g);
    for (let i = 0; i < N; i++) {
      const t = s[i]; if (!t || t.id !== 'fish') continue;
      const src = near(s, i, 'cat'); if (!src.length) continue;
      g[i] = null; push(4, 'eat', i, src, t, null);
    }
    // 5 水
    s = clone(g);
    const WET = { seed: 'sprout', book: 'wetbook', bread: 'wetbread', iron: 'rust' };
    for (let i = 0; i < N; i++) {
      const t = s[i]; if (!t) continue;
      const rid = WET[t.id]; if (!rid) continue;
      const src = near(s, i, 'water'); if (!src.length) continue;
      const nt = mk(RULE[rid].to); g[i] = nt; push(5, rid, i, src, t, nt);
    }
    // 6 鮮度
    s = clone(g);
    for (let i = 0; i < N; i++) {
      const t = s[i]; if (!t) continue; const d = ITEMS[t.id]; if (!d.per) continue;
      const guard = t.id === 'flower' ? near(s, i, 'water') : (CHILLED.includes(t.id) ? near(s, i, 'ice') : []);
      if (guard.length) { push(6, t.id === 'flower' ? 'bloom' : 'chill', i, guard, t, t, true); continue; }
      const f = (t.f || 1) - 1;
      if (f <= 0) { const nt = mk('rot'); g[i] = nt; push(6, 'rot', i, [], t, nt); }
      else { const nt = Object.assign({}, t, { f }); g[i] = nt; push(6, null, i, [], t, nt, true); }
    }
    return { grid: g, events };
  }

  function quality(t) { const d = ITEMS[t.id]; return d.per ? 0.5 + 0.5 * (t.f / d.per) : 1; }
  function sellPrice(t, demand) {
    if (!t) return 0;
    const dm = demand && demand[t.id] != null ? demand[t.id] : 1;
    return Math.max(0, Math.round(ITEMS[t.id].base * dm * quality(t)));
  }

  const RANKS = ['見習い', '駆け出し', '一人前', '目利き', '大商人'];
  const RANK_AT = [0, 150, 220, 300, 420];
  function rankOf(gold) { let r = 0; for (let k = 0; k < RANK_AT.length; k++) if (gold >= RANK_AT[k]) r = k; return r; }

  function rng(seed) {
    let a = seed >>> 0;
    return function () { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  function shuffle(arr, R) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  const pick = (arr, R) => arr[Math.floor(R() * arr.length)];

  const NAMES = ['灰野', '鳴沢', '夕凪', '古井', '狐坂', '槙原', '月見', '白樺', '鷺ノ宮', '錆川', '風待', '野分'];
  const MARKET_RULES = ['bake', 'dry', 'salt', 'dye', 'age', 'med', 'sprout', 'chill', 'bloom'];
  const SOURCES = new Set(['fire', 'ice', 'salt', 'spice', 'dye', 'barrel', 'honey', 'water', 'cat']);
  const HOT_POOL = ['med', 'asake', 'dcloth', 'jerky', 'sfish', 'begg', 'sprout', 'book', 'iron', 'flower', 'fish', 'meat', 'honey', 'cloth', 'spice', 'herb', 'egg', 'salt', 'sake', 'bread'];
  const START_GOLD = 100;
  const FIXED_START = [
    { id: 'ice', qty: 2, price: 5 }, { id: 'fish', qty: 2, price: 12 }, { id: 'fire', qty: 1, price: 6 },
    { id: 'egg', qty: 3, price: 7 }, { id: 'book', qty: 1, price: 15 }, { id: 'herb', qty: 2, price: 6 },
  ];

  function genMarket(R, n) {
    const ids = []; const add = id => { if (id && !ids.includes(id)) ids.push(id); };
    for (const rid of shuffle(MARKET_RULES, R).slice(0, 2)) {
      const r = RULE[rid]; add(r.a); add(Array.isArray(r.b) ? pick(r.b, R) : r.b);
    }
    for (const id of shuffle(BASE_IDS, R)) { if (ids.length >= n) break; add(id); }
    return ids.slice(0, n).map(id => ({
      id,
      qty: SOURCES.has(id) ? 1 + (R() < 0.4 ? 1 : 0) : 1 + Math.floor(R() * 3),
      price: Math.max(1, Math.round(ITEMS[id].base * (0.85 + R() * 0.3))),
    }));
  }
  /** 市場の品から作れるもの（そのまま + 隣接で変わるもの） */
  function obtainable(markets) {
    const ids = new Set(); markets.forEach(m => m.forEach(w => ids.add(w.id)));
    const out = new Set(ids);
    for (const r of RULES) {
      if (!r.a || !r.to || !ids.has(r.a)) continue;
      const bs = Array.isArray(r.b) ? r.b : [r.b];
      if (bs.some(b => ids.has(b)) && ITEMS[r.to].kind === 'fine') out.add(r.to);
    }
    return [...out];
  }
  const r2 = x => Math.round(x * 10) / 10;

  /** 1回の旅（村3つ）をシードから決定的に作る */
  function genJourney(seed, fixedStart) {
    const R = rng(seed);
    const names = shuffle(NAMES, R).slice(0, 3);
    const villages = names.map((name, k) => ({ name, demand: {}, market: [], legSegs: k < 2 ? 2 + (R() < 0.5 ? 1 : 0) : 0, rumor: null }));
    for (let k = 1; k < 3; k++) {
      const d = villages[k].demand;
      for (const id of Object.keys(ITEMS)) d[id] = r2(0.8 + R() * 0.35);
      for (const id of shuffle(HOT_POOL, R).slice(0, 3)) d[id] = r2(1.7 + R() * 0.7);
      for (const id of shuffle(BASE_IDS.filter(x => d[x] < 1.5 && x !== 'cat'), R).slice(0, 2)) d[id] = r2(0.5 + R() * 0.2);
      d.ash = 1; d.rot = 1;
    }
    const catVillage = R() < 0.5 ? 1 : 2;
    villages[catVillage].demand.cat = r2(3 + R());
    villages[3 - catVillage].demand.cat = 0.6;
    villages[0].market = fixedStart ? FIXED_START.map(w => Object.assign({}, w)) : genMarket(R, 6);
    villages[1].market = genMarket(R, 5);
    for (const w of villages[1].market) villages[1].demand[w.id] = Math.min(villages[1].demand[w.id], 0.85);
    // 噂（k の村で聞く、k+1 の村の話）。約3割は外れ
    for (let k = 0; k < 2; k++) {
      const next = villages[k + 1];
      const own = k === 0 ? [] : villages[1].market.map(w => w.id);
      const ok = id => !own.includes(id) && HOT_POOL.concat('cat').includes(id);
      let can = obtainable([villages[k].market]).filter(ok);
      if (can.length < 2) can = obtainable(villages.slice(0, k + 1).map(v => v.market)).filter(ok);
      const truth = R() >= 0.3;
      let id;
      if (truth) {
        const hot = can.filter(x => next.demand[x] >= 1.7);
        id = hot.length ? pick(hot, R) : pick(can, R);
        if (next.demand[id] < 1.7) next.demand[id] = r2(1.8 + R() * 0.5);
      } else {
        const cold = can.filter(x => next.demand[x] <= 1.05);
        id = cold.length ? pick(cold, R) : pick(can, R);
        next.demand[id] = Math.min(next.demand[id], r2(0.7 + R() * 0.3));
      }
      villages[k].rumor = { id, truth, village: next.name };
    }
    return { seed, villages };
  }

  return { COLS, ROWS, N, ITEMS, BASE_IDS, RULES, RULE, RANKS, RANK_AT, START_GOLD, mk, nb, pairEffect, simulateSegment, quality, sellPrice, rankOf, rng, genJourney, obtainable };
})();
if (typeof module !== 'undefined') module.exports = L;
</script>

<script>
/* ===== 計測（db があればそこへ、無ければ localStorage だけ） ===== */
const M = (() => {
  const KEY = 'gyosho.metrics.v1';
  const DEF = () => ({ firstPlayAt: null, updatedAt: null, sessions: 0, runsStarted: 0, runsCompleted: 0, firstRunCleared: false, replayed: false, priceAnswer: null, bestScore: 0, tutorialStuck: false, finalGold: null, discoveredCombos: 0 });
  let m = DEF();
  try { const raw = localStorage.getItem(KEY); if (raw) m = Object.assign(DEF(), JSON.parse(raw)); } catch (e) {}
  const ops = []; let ref = null, ready = false, inflight = false, again = false;
  const saveLocal = () => { try { localStorage.setItem(KEY, JSON.stringify(m)); } catch (e) {} };
  function write() {
    if (!ref) return;
    if (inflight) { again = true; return; }
    inflight = true;
    Promise.resolve().then(() => ref.set(Object.assign({}, m))).catch(() => {}).finally(() => { inflight = false; if (again) { again = false; write(); } });
  }
  function apply(op) {
    const before = JSON.stringify(m);
    op(m); if (!m.firstPlayAt) m.firstPlayAt = new Date().toISOString();
    if (JSON.stringify(m) === before) return;
    m.updatedAt = new Date().toISOString();
    saveLocal();
    if (ready) write(); else ops.push(op);
  }
  async function init() {
    try {
      const c = window.claude; if (!c || !c.use) return;
      const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
      if (!db || !user) return;
      const id = await user.id(); if (!id) return;
      const r = db.doc('plays/' + id);
      let base = null;
      try { const snap = await r.get(); base = snap.exists ? snap.data() : null; } catch (e) { return; }
      const nm = Object.assign(DEF(), base || {});
      if (!nm.firstPlayAt) nm.firstPlayAt = m.firstPlayAt || new Date().toISOString();
      ops.forEach(o => o(nm)); ops.length = 0;
      nm.updatedAt = new Date().toISOString();
      m = nm; ref = r; ready = true; saveLocal(); write();
    } catch (e) {}
  }
  return { apply, init, get: () => m };
})();
</script>

<script>
/* ===== 画面 ===== */
(() => {
  const { ITEMS, RULES, RULE } = L;
  const $ = s => document.querySelector(s);
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let speed = 1;
  const wait = ms => new Promise(r => setTimeout(r, reduced ? Math.min(ms, 120) * speed : ms * speed));
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // 発見済み
  let disc = new Set(), seen = new Set();
  try { disc = new Set(JSON.parse(localStorage.getItem('gyosho.disc') || '[]')); seen = new Set(disc); } catch (e) {}
  const saveDisc = () => { try { localStorage.setItem('gyosho.disc', JSON.stringify([...disc])); } catch (e) {} };

  const st = { screen: 'title', journey: null, vi: 0, gold: L.START_GOLD, grid: Array(L.N).fill(null), stock: [], busy: false, firstRun: false, undo: null, seed: 0, sold: false, departArmed: false };

  /* ---------- 札 ---------- */
  function tileHTML(t, opts = {}) {
    const d = ITEMS[t.id];
    let pips = '';
    if (d.per) pips = `<div class="pips">${Array.from({ length: d.per }, (_, k) => `<i class="${k < t.f ? '' : 'off'}"></i>`).join('')}</div>`;
    else if (t.id === 'ice') pips = `<div class="pips ice">${Array.from({ length: d.melt }, (_, k) => `<i class="${k < t.m ? '' : 'off'}"></i>`).join('')}</div>`;
    else if (t.id === 'sake' && t.age) pips = `<div class="pips age">${[0, 1].map(k => `<i class="${k < t.age ? '' : 'off'}"></i>`).join('')}</div>`;
    let tag = '';
    if (opts.price != null) tag = `<div class="ptag ${opts.dm >= 1.5 ? 'hi' : opts.dm <= 0.75 ? 'lo' : ''}">${opts.price}</div>`;
    return `<div class="tile k-${d.kind} ${opts.cls || ''}" ${opts.src ? `data-src="${opts.src}"` : ''} style="--sz:${opts.sz || 'var(--cell)'}">${tag}${pips}<div class="seal"><span>${d.glyph}</span></div><div class="nm">${d.name}</div></div>`;
  }
  const mini = (id, extra = '') => id ? `<span class="mini ${extra}" style="--kc:var(--k-${ITEMS[id].kind})">${ITEMS[id].glyph}</span>` : `<span class="mini q ${extra}">？</span>`;
  const miniGlyph = (g, kind, extra = '') => `<span class="mini ${extra}" style="--kc:var(--k-${kind})">${g}</span>`;

  const V = () => st.journey.villages[st.vi];
  const sells = () => st.vi > 0;
  const demand = () => (sells() ? V().demand : null);

  /* ---------- 描画 ---------- */
  function renderHeader() {
    const v = V();
    $('#vname').textContent = v.name;
    $('#vsub').textContent = st.screen === 'travel' ? '街道を移動中' : ['出発の村', '二つ目の村', '最後の村'][st.vi];
    [...$('#stage').children].forEach((el, k) => el.classList.toggle('on', k <= st.vi));
    $('#gold').textContent = st.gold;
    $('#bookBtn').classList.toggle('new', [...disc].some(x => !seen.has(x)));
  }
  function rumorRow(v) {
    if (!v.rumor) return '';
    const r = v.rumor, n = ITEMS[r.id];
    const text = r.id === 'cat' ? `${esc(r.village)}には猫好きが多いらしい` : `${esc(r.village)}では${n.name}が足りないらしい`;
    return `<div class="row"><span class="lbl">噂</span>${mini(r.id)}<span>${text}</span></div>`;
  }
  function demandRow(v) {
    const ent = Object.entries(v.demand).filter(([id]) => ITEMS[id].base > 0);
    const hi = ent.filter(([, d]) => d >= 1.5).sort((a, b) => b[1] - a[1]).slice(0, 4);

  const SCENERY = `<div class="scenery" aria-hidden="true"><svg viewBox="0 0 390 200" preserveAspectRatio="xMidYMax slice">

  function info(html, warn) { const el = $('#info'); el.innerHTML = html; el.classList.toggle('warn', !!warn); }
  function defaultInfo() {

    const H = app.clientHeight;

  }
  addEventListener('resize', fit);

  /* ---------- 操作 ---------- */
  let interacted = false;
  function markInteract() { interacted = true; }
  function floatAt(el, html, cls) {
    const r = el.getBoundingClientRect();
    const f = document.createElement('div'); f.className = 'float ' + (cls || ''); f.innerHTML = html;
    f.style.left = (r.left + r.width / 2) + 'px'; f.style.top = (r.top + r.height / 2) + 'px';
    document.body.appendChild(f); setTimeout(() => f.remove(), 1200);
  }
  const firstEmpty = () => st.grid.findIndex(t => !t);
  function buy(j, cell) {
    const w = st.stock[j]; if (!w || w.qty <= 0) return;
    if (w.price > st.gold) { info(`お金が足りない（${ITEMS[w.id].name}は${w.price}銭）`, true); return; }
    if (cell == null || cell < 0) cell = firstEmpty();
    if (cell < 0) { info('荷車がいっぱい。捨てるか売って空けよう。', true); return; }
    if (st.grid[cell]) { info('空いているマスに置こう。', true); return; }
    st.gold -= w.price; w.qty--;
    const t = L.mk(w.id); t.here = w.price; t.from = j; st.grid[cell] = t; st.departArmed = false;
    renderHeader(); renderTop(); setCell(cell, 'morph'); renderFooter();
    describe(t, cell, `${ITEMS[w.id].name}を${w.price}銭で買った。`);
  }
  function sell(i) {
    const t = st.grid[i]; if (!t) return;
    const cellEl = $(`#cart .cell[data-i="${i}"]`);
    if (t.here != null) {
      st.gold += t.here; if (st.stock[t.from]) st.stock[t.from].qty++;
      st.grid[i] = null; renderHeader(); renderTop(); setCell(i); info(`${ITEMS[t.id].name}を返品した。`);
      return;
    }
    if (st.vi === 0) return;
    const p = L.sellPrice(t, demand());
    st.gold += p; st.grid[i] = null; st.sold = true;
    renderHeader(); setCell(i); floatAt($('#gold'), `+${p}`);
    info(`${ITEMS[t.id].name}を<b>${p}銭</b>で売った。`);
  }
  function discard(i) {
    const t = st.grid[i]; if (!t) return;
    st.grid[i] = null; st.undo = { i, t }; setCell(i);
    info(`${ITEMS[t.id].name}を捨てた。<button class="undo" id="undoBtn">元に戻す</button>`);
    $('#undoBtn').onclick = () => { if (st.undo && !st.grid[st.undo.i]) { st.grid[st.undo.i] = st.undo.t; setCell(st.undo.i, 'morph'); } st.undo = null; defaultInfo(); };
  }
  function moveTo(i, j) {
    if (i === j) return;
    [st.grid[i], st.grid[j]] = [st.grid[j], st.grid[i]];
    setCell(i); setCell(j, 'morph');
  }
  function describe(t, i, lead) {
    const d = ITEMS[t.id]; let s = lead ? lead : `<b>${d.name}</b>`;
    if (d.per) s += ` 鮮度 ${t.f}/${d.per}`;
    if (t.id === 'ice') s += ` 溶けるまで ${t.m}区間`;
    if (t.id === 'sake' && t.age) s += ` 熟成 ${t.age}/2`;
    if (sells()) { const p = cellPrice(t); s += `　ここで <b>${p.price}銭</b>${t.here != null ? '（返品）' : ''}`; }
    // 今の並びで何が起きるか
    const fx = [];
    if (i != null) for (const j of L.nb(i)) { const n = st.grid[j]; if (!n) continue; const r = L.pairEffect(n.id, t.id); if (r) fx.push(r); }
    if (fx.length) s += '　・' + fx.map(r => effectShort(r)).join('、');

  }
  function effectShort(r) {

  function chip(r) {

    const res = r.keep ? miniGlyph('保', 'cold') : r.to ? mini(r.to) : miniGlyph('消', 'spoil');
    return `<div class="pv ${cls}"><span class="ar">→</span>${res}<span>${effectShort(r)}</span></div>`;
  }

  // ドラッグ
  let drag = null;
  const ghost = $('#ghost');
  function clearHover() {
    document.querySelectorAll('.cell.hover,.cell.bad').forEach(c => c.classList.remove('hover', 'bad'));
    document.querySelectorAll('.drop-on').forEach(c => c.classList.remove('drop-on'));
    document.querySelectorAll('#cart .pv').forEach(p => p.remove());
    ghost.querySelector('.self') && (ghost.querySelector('.self').innerHTML = '');
  }
  function dragTileId() {
    if (!drag) return null;
    const [k, n] = drag.src.split(':');
    return k === 'mkt' ? st.stock[+n].id : st.grid[+n] && st.grid[+n].id;
  }
  function onHover(target) {
    clearHover(); if (!target) return;
    const [k, n] = target.split(':');
    if (k === 'trash') { $('#trash').classList.add('drop-on'); return; }
    if (k === 'market') { const s = $('#top .stall'); if (s && drag.src.startsWith('cart')) s.classList.add('drop-on'); return; }
    const i = +n; const cellEl = $(`#cart .cell[data-i="${i}"]`);
    const fromCart = drag.src.startsWith('cart'); const srcI = fromCart ? +drag.src.split(':')[1] : -1;
    if (!fromCart && st.grid[i]) { cellEl.classList.add('bad'); return; }
    cellEl.classList.add('hover');
    const id = dragTileId(); const self = [];
    for (const j of L.nb(i)) {
      if (j === srcI) continue;
      const nt = st.grid[j]; if (!nt) continue;
      const r1 = L.pairEffect(id, nt.id);
      if (r1) $(`#cart .cell[data-i="${j}"]`).insertAdjacentHTML('beforeend', chip(r1));
      const r2 = L.pairEffect(nt.id, id);
      if (r2 && !self.includes(r2)) self.push(r2);
    }
    ghost.querySelector('.self').innerHTML = self.map(chip).join('');
  }
  function hitTest(x, y) {
    const el = document.elementFromPoint(x, y);

    return d ? d.dataset.drop : null;
  }
  document.addEventListener('pointerdown', e => {
    markInteract();
    const src = e.target.closest('[data-src]');

  });

    if (!drag || e.pointerId !== drag.id) return;

    if (!drag.moved) {
      drag.moved = true;
      const id = dragTileId(); if (!id) { drag = null; return; }
      ghost.innerHTML = tileHTML(L.mk(id)) + '<div class="self"></div>';
      if (drag.src.startsWith('cart')) { const t = st.grid[+drag.src.split(':')[1]]; ghost.innerHTML = tileHTML(t) + '<div class="self"></div>'; drag.el.closest('.cell').classList.add('lifted'); document.body.classList.add('dragging-cart'); }
      ghost.style.display = 'block';
    }
    const cs = ghost.getBoundingClientRect();

    ghost.style.top = (e.clientY - cs.height - 18) + 'px';
    const t = hitTest(e.clientX, e.clientY);

  function endDrag(e, cancel) {
    if (!drag || (e && e.pointerId !== drag.id)) return;
    const d = drag; drag = null;
    ghost.style.display = 'none'; document.body.classList.remove('dragging-cart');
    document.querySelectorAll('.lifted').forEach(c => c.classList.remove('lifted'));
    clearHover();
    if (cancel) return;
    const [k, n] = d.src.split(':');
    if (!d.moved) { // タップ
      if (k === 'mkt') buy(+n, -1);
      else { const t = st.grid[+n]; if (t) describe(t, +n); }
      return;
    }
    const tg = d.target; if (!tg) return;
    const [tk, tn] = tg.split(':');

      if (tk === 'cell') buy(+n, +tn);
      return;
    }

  addEventListener('pointerup', e => endDrag(e));
  addEventListener('pointercancel', e => endDrag(e, true));

  /* ---------- 旅 ---------- */
  function roadHTML() {
    const v = st.journey.villages;
    return `<div class="road">
      <svg viewBox="0 0 360 140" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
        <defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--sky2)"/><stop offset=".6" stop-color="var(--sky3)"/><stop offset="1" stop-color="var(--sky4)"/></linearGradient></defs>
        <rect width="360" height="140" fill="url(#sk)"/>
        <circle cx="250" cy="92" r="22" fill="var(--sun)" opacity=".85"/>

        <path d="M0 104 Q60 88 120 100 T240 98 T360 102 L360 140 L0 140Z" fill="var(--hill2)"/>
        <path d="M0 122 Q90 112 180 118 T360 116 L360 140 L0 140Z" fill="var(--hill3)"/>

  }
  async function travel() {
    const from = st.vi, v = V(), segs = v.legSegs;
    st.screen = 'travel'; st.busy = true; speed = 1; st.departArmed = false;
    st.grid.forEach(t => { if (t) { delete t.here; delete t.from; } });
    $('#top').innerHTML = roadHTML(); renderHeader(); renderCart(); renderFooter();
    $('#notice').innerHTML = `<div class="row"><span class="muted">${esc(v.name)}を出て、${esc(st.journey.villages[from + 1].name)}へ。</span></div>`;
    info('荷車がゆれる。並べた品が、少しずつ変わっていく。');
    const wagon = $('#wagon'); const x0 = [9, 50, 91][from], x1 = [9, 50, 91][from + 1];
    wagon.style.left = x0 + '%';

  async function playEvents(events, s, segs) {
    let k = 0;
    while (k < events.length) {
      const e = events[k];
      if (e.minor) { // 同じ段階の小さな変化をまとめて
        const batch = [];
        while (k < events.length && events[k].minor && events[k].phase === e.phase) batch.push(events[k++]);
        let newOnes = [];
        for (const b of batch) {
          st.grid[b.cell] = b.after; setCell(b.cell, 'tick');
          if (b.rule && (b.rule === 'chill' || b.rule === 'bloom' || b.rule === 'icepack')) {
            if (!disc.has(b.rule)) { newOnes.push(b); }
            floatAt($(`#cart .cell[data-i="${b.cell}"]`), '保', 'keep');
          }
        }
        for (const b of newOnes) if (!disc.has(b.rule)) { discover(b.rule); notice(b, s, segs, true); }
        if (newOnes.length) await wait(1100);
        else await wait(320);
        continue;
      }
      k++;
      const cellEl = () => $(`#cart .cell[data-i="${e.cell}"]`);
      e.src.forEach(j => $(`#cart .cell[data-i="${j}"]`).classList.add('src'));
      cellEl().classList.add('tgt');
      const isNew = e.rule && !disc.has(e.rule);
      if (e.rule) { if (isNew) discover(e.rule); notice(e, s, segs, isNew); }
      await wait(520);
      st.grid[e.cell] = e.after; setCell(e.cell, 'morph');
      const nm = e.after ? ITEMS[e.after.id].name : '消えた';
      const bad = !e.after || ITEMS[e.after.id].kind === 'spoil' || e.after.id === 'water';
      floatAt(cellEl(), `${nm}${isNew ? '<span class="newstamp">新発見</span>' : ''}`, bad ? 'neg' : '');
      await wait(isNew ? 1150 : 700);
      document.querySelectorAll('#cart .cell.src,#cart .cell.tgt').forEach(c => c.classList.remove('src', 'tgt'));
    }
  }
  function notice(e, s, segs, isNew) {
    const r = RULE[e.rule]; if (!r) return;
    $('#notice').innerHTML = `<div class="row"><span class="lbl">区間${s + 1}</span><span>${r.text}${isNew ? ' <span class="ok">— 手帳に記した</span>' : ''}</span></div>`;
  }
  function discover(rid) {

  }

  /* ---------- 終わり ---------- */
  async function finish() {
    st.busy = true; renderFooter();
    for (let i = 0; i < L.N; i++) {
      const t = st.grid[i]; if (!t) continue;
      const p = L.sellPrice(t, V().demand); st.gold += p; st.grid[i] = null;
      setCell(i); floatAt($(`#cart .cell[data-i="${i}"]`), `+${p}`, p ? '' : 'neg'); renderHeader();
      await wait(160);
    }
    await wait(500);
    const gold = st.gold, rank = L.rankOf(gold);
    M.apply(m => {
      if (m.runsCompleted === 0) m.firstRunCleared = rank >= 2;
      m.runsCompleted++; m.finalGold = gold; m.bestScore = Math.max(m.bestScore || 0, gold); m.discoveredCombos = disc.size;
    });
    showEnd(gold, rank);
  }
  function showEnd(gold, rank) {
    const ov = $('#ov'); ov.className = 'show';
    const ans = M.get().priceAnswer;
    const opts = ['買わない', '480円', '980円', '1,480円'];
    const toNext = rank < 4 ? `次の「${L.RANKS[rank + 1]}」まで あと${L.RANK_AT[rank + 1] - gold}銭` : '街道いちばんの商人だ';
    ov.innerHTML = `<div class="ovin end">
      <h2>旅の終わり — 最後の村 ${esc(V().name)}</h2>
      <div class="big">${gold}<small> 銭</small></div>
      <div class="stat">元手 ${L.START_GOLD}銭から ${gold >= L.START_GOLD ? '+' : ''}${gold - L.START_GOLD}銭。${toNext}</div>
      <div class="ranks">${L.RANKS.map((r, k) => `<div class="${k === rank ? 'on' : ''}">${r}</div>`).join('')}</div>
      <div class="stat">見つけた変化 <b>${disc.size}</b> / ${RULES.length}　<button id="endBook" style="color:var(--gold);text-decoration:underline">旅の手帳を見る</button></div>
      <div class="q">この先に、まだ2つの地域があります</div>
      <div class="locks">
        <div class="lock"><span class="lk">完全版</span><div class="nm">港町</div><div class="ds">潮風と異国の品。船荷は揺れて、隣り合わせが変わる。</div></div>
        <div class="lock"><span class="lk">完全版</span><div class="nm">雪山</div><div class="ds">凍える峠。氷は溶けず、火種が命綱になる。</div></div>
      </div>
      <div class="q">有料の完全版があったら、いくらなら買いますか？</div>
      <div class="opts">${opts.map(o => `<button data-ans="${o}" class="${ans === o ? 'sel' : ''}">${o}</button>`).join('')}</div>
      <div class="thanks" id="thanks">${ans ? 'ありがとうございます。' : ''}</div>
      <button class="bigbtn" id="again">もう一度旅に出る</button>
      <div class="seed">旅の番号 #${st.seed}</div>
    </div>`;
    ov.scrollTop = 0;
    ov.querySelectorAll('[data-ans]').forEach(b => b.onclick = () => {
      const a = b.dataset.ans; M.apply(m => { m.priceAnswer = a; });
      ov.querySelectorAll('[data-ans]').forEach(x => x.classList.toggle('sel', x === b));
      $('#thanks').textContent = 'ありがとうございます。';
    });
    $('#again').onclick = () => { closeOv(); startRun(); };
    $('#endBook').onclick = () => showBook(true);
  }

  /* ---------- 手帳 ---------- */
  function showBook(fromEnd) {
    const ov = $('#ov'); ov.className = 'show';
    const rows = RULES.map(r => {
      const known = disc.has(r.id);
      const isNew = known && !seen.has(r.id);
      if (!known) return `<div class="entry unk"><div class="eq">${mini(null)}<span>＋</span>${mini(null)}<span>→</span>${mini(null)}</div><div class="tx">まだ見つけていない変化</div></div>`;
      const a = r.a ? mini(r.a) : miniGlyph('時', 'goods');
      const bId = Array.isArray(r.b) ? r.b[0] : r.b === 'fresh' ? 'fish' : r.b;
      const res = r.keep ? miniGlyph('保', 'cold') : r.to ? mini(r.to) : miniGlyph('消', 'spoil');
      return `<div class="entry"><div class="eq">${a}<span>＋</span>${mini(bId)}<span>→</span>${res}</div><div class="tx">${r.text}${isNew ? '<span class="new">新</span>' : ''}</div></div>`;
    }).join('');
    ov.innerHTML = `<div class="ovin book"><button class="close" id="closeBook">${fromEnd ? '戻る' : '閉じる'}</button>
      <h2 class="ttl">旅の手帳</h2><div class="cnt">見つけた変化 ${disc.size} / ${RULES.length}　— 荷車で隣り合った品は、旅のあいだに変わる。</div>${rows}</div>`;
    ov.scrollTop = 0;
    disc.forEach(x => seen.add(x));
    renderHeader();
    $('#closeBook').onclick = () => { if (fromEnd) showEnd(st.gold, L.rankOf(st.gold)); else closeOv(); };
  }
  function closeOv() { const ov = $('#ov'); ov.className = ''; ov.innerHTML = ''; }

  /* ---------- 開始 ---------- */
  function startRun() {
    const m = M.get();
    st.firstRun = m.runsStarted === 0;
    const qs = new URLSearchParams(location.search);
    const qseed = parseInt(qs.get('seed'), 10);
    if (Number.isFinite(qseed) && !st.seedUsed) { st.seed = qseed; st.seedUsed = true; }
    else st.seed = Math.floor(Math.random() * 1e6);
    st.journey = L.genJourney(st.seed, st.firstRun);
    st.vi = 0; st.gold = L.START_GOLD; st.grid = Array(L.N).fill(null); st.screen = 'market'; st.busy = false; st.undo = null; st.departArmed = false;
    st.stock = V().market.map(w => Object.assign({}, w));
    M.apply(mm => { if (mm.runsStarted >= 1) mm.replayed = true; mm.runsStarted++; });
    renderAll();
    if (st.firstRun && !st.stuckTimer) {
      interacted = false;
      st.stuckTimer = setTimeout(() => { if (!interacted) M.apply(mm => { mm.tutorialStuck = true; }); }, 30000);
    }
  }
  $('#go').onclick = () => {
    if (st.screen === 'travel') { speed = speed < 1 ? 1 : 0.25; renderFooter(); return; }
    if (st.busy) return;
    if (st.vi === 2) { finish(); return; }
    if (!st.grid.some(Boolean) && !st.departArmed) { st.departArmed = true; renderFooter(); info('荷車が空っぽだ。', true); return; }
    travel();
  };
  $('#bookBtn').onclick = () => showBook(false);

  function showTitle() {
    const ov = $('#ov'); ov.className = 'show titlebg';
    ov.innerHTML = `<svg class="title-art" viewBox="0 0 390 844" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <circle cx="120" cy="560" r="70" fill="var(--sun)" opacity=".8"/>
      <path d="M0 560 L60 520 L120 548 L190 490 L250 535 L320 505 L390 540 L390 844 L0 844Z" fill="var(--hill1)"/>
      <path d="M0 620 Q100 585 200 610 T390 600 L390 844 L0 844Z" fill="var(--hill2)"/>
      <path d="M0 690 Q120 660 220 680 T390 670 L390 844 L0 844Z" fill="var(--hill3)"/>
      <path d="M150 844 Q190 740 260 676" stroke="var(--road)" stroke-width="10" fill="none" opacity=".7"/>
      <g transform="translate(232 640)"><rect x="0" y="0" width="34" height="18" rx="2" fill="var(--wood2)" stroke="var(--hill3)" stroke-width="2"/><circle cx="8" cy="22" r="6" fill="var(--hill3)"/><circle cx="28" cy="22" r="6" fill="var(--hill3)"/><rect x="-10" y="-6" width="7" height="26" rx="3" fill="var(--hill3)"/></g>
    </svg>
    <div class="title-screen"><h1>帰り道の<br>行商人</h1>
      <p>魔王が倒れて、街道に静けさが戻った。<br>荷車ひとつで、村から村へ。</p>
      <button class="bigbtn" id="startBtn">旅に出る</button></div>`;
    $('#startBtn').onclick = () => { closeOv(); startRun(); };
  }

  // 初期表示（use() を待たない）
  st.journey = L.genJourney(1, true); st.stock = V().market.map(w => Object.assign({}, w));
  renderAll(); showTitle();
  M.apply(m => { m.sessions++; });
  M.init();
  window.__gyosho = { st, L, M };
})();
</script>
</body></html>
