<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.5 system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body><title>昨日の私のダンジョン</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@import url("https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap");
/* 構成：上から「部屋名・一言」「時の目盛り」「盤面（灯りと影）」「十字ボタン」の1画面。単一テーマ（地下の遺跡、暗い） */
:root {
  color-scheme: dark;
  --bg: #0b0d10;
  --void: #07080a;
  --wall: #22252a;
  --wall-top: #2d3137;
  --wall-face: #15171b;
  --floor: #1a1c1f;
  --floor-2: #1f2124;
  --grout: #111214;
  --ink: #e4dccb;
  --muted: #8f897c;
  --faint: #5a5852;
  --line: #2a2d32;
  --panel: #111317;
  --btn: #1a1d22;
  --btn-hi: #262a31;
  --lamp: #f0b25e;
  --lamp-glow: #ffd596;
  --echo: #a8d3e2;
  --rune-a: #6cc7a6;
  --rune-b: #e58fae;
  --rune-c: #9aaeff;
  --box: #4a4339;
  --box-hi: #6b6153;
  --danger: #d9826b;
  --font-display: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body);
  overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
#app {
  position: relative; height: 100%; max-width: 520px; margin: 0 auto; box-sizing: border-box;
  display: flex; flex-direction: column; gap: 8px;
  padding-block: 8px 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
/* 部屋名 */
.top { display: flex; align-items: center; gap: 10px; min-height: 36px; }
.roomname { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 8px; }
.roomno { font-family: var(--font-display); font-weight: 800; font-size: 22px; color: var(--lamp); font-variant-numeric: tabular-nums; }
.roomtitle { font-family: var(--font-display); font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.iconbtn {
  border: 1px solid var(--line); background: var(--btn); border-radius: 8px; height: 34px; padding: 0 10px;
  font-size: 13px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
}
.iconbtn:active { background: var(--btn-hi); }
.hint { font-size: 13px; color: var(--muted); min-height: 18px; letter-spacing: .04em; }
/* 時の目盛り */
#tl { display: flex; flex-direction: column; gap: 3px; }
.lane { display: grid; grid-template-columns: 44px 1fr; align-items: center; gap: 6px; }
.lane .who { font-size: 11px; color: var(--muted); letter-spacing: .05em; white-space: nowrap; }
.lane.me .who { color: var(--lamp); }
.lane.ghost .who { color: var(--echo); }
.track { display: grid; gap: 2px; }
.tk {
  height: 18px; border-radius: 3px; background: var(--panel); display: grid; place-items: center;
  font-size: 11px; line-height: 1; color: var(--faint); position: relative; font-variant-numeric: tabular-nums;
}
.lane.ghost .tk { color: var(--echo); }
.lane.me .tk.done { color: var(--lamp); }
.tk.now { box-shadow: inset 0 0 0 1px var(--lamp); }
.tk.past { opacity: .55; }
.tk.sw::after { content: ""; position: absolute; left: 2px; right: 2px; bottom: 1px; height: 3px; border-radius: 2px; background: var(--swc); }
.tk.blk { color: var(--danger); }
.ticks .tk { background: none; height: 12px; font-size: 10px; color: var(--faint); }
.ticks .tk.now { box-shadow: none; color: var(--lamp); }
/* 盤面 */
.boardwrap { flex: 1; min-height: 0; display: grid; place-items: center; position: relative; }
#board { display: block; touch-action: none; border-radius: 6px; cursor: pointer; max-width: 100%; }
/* 操作 */
.controls { display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); align-items: center; gap: 8px; }
.pad { display: grid; grid-template-columns: repeat(3, 54px); grid-template-rows: repeat(3, 50px); gap: 4px; }
.pad button {
  border: 1px solid var(--line); background: var(--btn); border-radius: 10px; cursor: pointer; display: grid; place-items: center;
  touch-action: manipulation;
}
.pad button:active, .pad button.hit { background: var(--btn-hi); border-color: var(--lamp); }
.pad svg { width: 22px; height: 22px; stroke: var(--ink); fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.pad .wait { font-size: 13px; color: var(--lamp); letter-spacing: .08em; }
.side { display: flex; flex-direction: column; gap: 8px; }
.side.r { align-items: flex-end; }
.side.l { align-items: flex-start; }
.sbtn {
  border: 1px solid var(--line); background: none; border-radius: 8px; padding: 8px 10px; font-size: 12px; color: var(--muted);
  cursor: pointer; display: inline-flex; flex-direction: column; align-items: center; gap: 2px; min-width: 64px; white-space: nowrap;
}
.sbtn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.sbtn:active { background: var(--btn-hi); }
.sbtn.lit { color: var(--lamp); border-color: var(--lamp); }
/* 重ねる画面 */
.sheet {
  position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column; justify-content: center; gap: 16px;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-y: auto;
}
.sheet h2 { font-family: var(--font-display); font-weight: 800; font-size: 28px; margin: 0; text-wrap: balance; }
.sheet .sub { color: var(--muted); font-size: 14px; margin: 0; }
.starrow { display: flex; gap: 6px; }
.starrow svg { width: 34px; height: 34px; }
.primary {
  border: 0; background: var(--lamp); color: #1c1306; font-weight: 700; border-radius: 10px; padding: 14px 18px; font-size: 16px; cursor: pointer;
}
.secondary { border: 1px solid var(--line); background: var(--btn); border-radius: 10px; padding: 12px 16px; font-size: 14px; cursor: pointer; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.rooms { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.rtile {
  border: 1px solid var(--line); background: var(--btn); border-radius: 8px; padding: 10px 8px; text-align: left; cursor: pointer;
  display: flex; flex-direction: column; gap: 4px; min-height: 68px; min-width: 0;
}
.rtile .n { font-family: var(--font-display); font-weight: 800; font-size: 20px; color: var(--lamp); }
.rtile .nm { font-size: 12px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rtile .st { font-size: 12px; color: var(--lamp); letter-spacing: 1px; }
.rtile[disabled] { cursor: default; opacity: .45; }
.rtile.locked { background: var(--panel); border-style: dashed; }
.rtile.locked .n { color: var(--faint); }
.rtile.locked .nm { color: var(--muted); }
.label { font-size: 11px; letter-spacing: .12em; color: var(--muted); }
.vault {
  border: 1px dashed var(--faint); border-radius: 10px; padding: 14px; display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center;
  background: var(--panel);
}
.vault svg { width: 30px; height: 30px; stroke: var(--muted); fill: none; stroke-width: 2; }
.vault b { font-family: var(--font-display); font-size: 17px; display: block; }
.vault span { font-size: 13px; color: var(--muted); }
.survey { display: flex; flex-direction: column; gap: 8px; }
.survey p { margin: 0; font-size: 15px; font-weight: 700; }
.opts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.opt { border: 1px solid var(--line); background: var(--btn); border-radius: 8px; padding: 12px; font-size: 15px; cursor: pointer; font-variant-numeric: tabular-nums; }
.opt[aria-pressed="true"] { border-color: var(--lamp); color: var(--lamp); background: var(--btn-hi); }
.thanks { font-size: 13px; color: var(--echo); min-height: 18px; margin: 0; }
.big { font-family: var(--font-display); font-weight: 800; font-size: 40px; color: var(--lamp); font-variant-numeric: tabular-nums; }
@media (max-height: 700px) {
  .pad { grid-template-rows: repeat(3, 42px); }
  .tk { height: 15px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>

<div id="app">

    <button class="iconbtn" id="btnRooms" aria-label="部屋をえらぶ">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="1.5" y="1.5" width="5" height="5"/><rect x="9.5" y="1.5" width="5" height="5"/><rect x="1.5" y="9.5" width="5" height="5"/><rect x="9.5" y="9.5" width="5" height="5"/></svg>部屋</button>

<script id="logic">
/* ===== 昨日の私のダンジョン：ゲームのロジック（純粋関数のみ。DOM に触れない） ===== */
var Kinou = (function () {
  "use strict";
  var DIRS = { U: [0, -1], D: [0, 1], L: [-1, 0], R: [1, 0], W: [0, 0] };
  var MOVES = ["U", "D", "L", "R", "W"];

  // 記号: # 壁 / . 床 / S 入口 / E 出口 / a b c スイッチ / A B C 対応する扉 / o 箱
  var ROOM_DEFS = [
    { name: "入口の回廊", hint: "灯りの階段へ", turns: 12, maxGhosts: 2, parRuns: 1, parTurns: 10,
      map: ["#######", "##E####", "##.####", "##...##", "####.##", "##...##", "##.####", "##S####", "#######"] },
    { name: "留め石の間", hint: "乗ったまま、待ってみる", turns: 10, maxGhosts: 2, parRuns: 2, parTurns: 8,
      map: ["#######", "###E###", "###A###", "##...##", "##.#.##", "##.#a##", "##...##", "###S###", "#######"] },
    { name: "石の重さ", hint: "石も、重さになる", turns: 14, maxGhosts: 2, parRuns: 1, parTurns: 13,
      map: ["#######", "##E####", "##A####", "#.....#", "#.###.#", "#.o..a#", "#.#####", "#S#####", "#######"] },
    { name: "二つの扉", hint: "昨日の私は、ふたりまで", turns: 12, maxGhosts: 2, parRuns: 3, parTurns: 11,
      map: ["#######", "#E#####", "#B...b#", "###A###", "##...##", "##.#.##", "#a...##", "###S###", "#######"] },
    { name: "ひとりの昨日", hint: "この部屋の昨日は、ひとりだけ", turns: 12, maxGhosts: 1, parRuns: 2, parTurns: 10,
      map: ["#######", "####.a#", "####.##", "#...b##", "#.##o##", "#S...B#", "#####A#", "#####E#", "#######"] },
    { name: "刻の間", hint: "待つのも一手", turns: 14, maxGhosts: 2, parRuns: 3, parTurns: 13,
      map: ["#######", "#E###b#", "#B###.#", "#.###.#", "#A###C#", "#.....#", "#a#.c##", "###S###", "#######"] }
  ];

  function parseRoom(def) {
    var h = def.map.length, w = def.map[0].length;
    var kind = [], boxes = [], switches = [], doors = [], start = -1, exit = -1;
    for (var y = 0; y < h; y++) {
      for (var x = 0; x < w; x++) {
        var ch = def.map[y][x], i = y * w + x;
        if (ch === "o") { boxes.push(i); ch = "."; }
        if (ch === "S") { start = i; ch = "."; }
        if (ch === "E") exit = i;
        if (/[a-c]/.test(ch)) switches.push({ i: i, c: ch });
        if (/[A-C]/.test(ch)) doors.push({ i: i, c: ch.toLowerCase() });
        kind.push(ch);
      }
    }
    return { name: def.name, hint: def.hint, w: w, h: h, kind: kind, start: start, exit: exit,
      boxes: boxes, switches: switches, doors: doors, turns: def.turns, maxGhosts: def.maxGhosts,
      parRuns: def.parRuns, parTurns: def.parTurns };
  }

  function initState(room, ghostCount, withMe) {
    var g = [];
    for (var k = 0; k < ghostCount; k++) g.push(room.start);
    return { t: 0, me: withMe === false ? -1 : room.start, ghosts: g, boxes: room.boxes.slice(), cleared: false };
  }

  function neighbor(room, i, d) {
    var v = DIRS[d], x = i % room.w + v[0], y = Math.floor(i / room.w) + v[1];
    if (x < 0 || y < 0 || x >= room.w || y >= room.h) return -1;
    return y * room.w + x;
  }

  function occupied(st, i) {
    return st.me === i || st.ghosts.indexOf(i) >= 0 || st.boxes.indexOf(i) >= 0;
  }

  // スイッチが押されている色の集合（誰か・箱が乗っている）
  function pressedColors(room, st) {
    var out = {};
    room.switches.forEach(function (s) { if (occupied(st, s.i)) out[s.c] = true; });
    return out;
  }

  // ターン開始時点で開いている扉（スイッチが押されているか、扉のマスに何かがいる）
  function openDoors(room, st) {
    var pressed = pressedColors(room, st), open = {};
    room.doors.forEach(function (d) { if (pressed[d.c] || occupied(st, d.i)) open[d.i] = true; });
    return open;
  }

  function passable(room, open, i) {
    if (i < 0) return false;
    var k = room.kind[i];
    if (k === "#") return false;
    if (/[A-C]/.test(k)) return !!open[i];
    return true;
  }

  // 1ターン進める。順番は「過去の自分（古い順）→ 今の自分」。扉の開閉はターン開始時点で決まる。
  // 今の自分の移動が不可能なら ok:false（ターンは進まない）。過去の自分は進めなければその場で待つ。
  function step(room, st, ghostInputs, myInput) {
    var open = openDoors(room, st);
    var cur = { t: st.t + 1, me: st.me, ghosts: st.ghosts.slice(), boxes: st.boxes.slice(), cleared: false };
    var ghostBlocked = [], pushes = [];

    function tryMove(from, d, isGhost) {
      if (d === "W" || from < 0) return from;
      var to = neighbor(room, from, d);
      if (!passable(room, open, to)) return null;
      if (isGhost && to === cur.me) return null;
      var bi = cur.boxes.indexOf(to);
      if (bi >= 0) {
        var beyond = neighbor(room, to, d);
        if (!passable(room, open, beyond) || room.kind[beyond] === "E" || cur.boxes.indexOf(beyond) >= 0 ||
            beyond === cur.me || cur.ghosts.indexOf(beyond) >= 0) return null;
        cur.boxes[bi] = beyond;
        pushes.push(bi);
      }
      return to;
    }

    for (var g = 0; g < cur.ghosts.length; g++) {
      var inp = (ghostInputs[g] && ghostInputs[g][st.t]) || "W";
      var r = tryMove(cur.ghosts[g], inp, true);
      if (r === null) { ghostBlocked[g] = true; } else { cur.ghosts[g] = r; }
    }
    var mr = tryMove(cur.me, myInput, false);
    if (mr === null) return { ok: false, state: st, ghostBlocked: [], pushes: [] };
    cur.me = mr;
    cur.cleared = cur.me >= 0 && cur.me === room.exit;
    return { ok: true, state: cur, ghostBlocked: ghostBlocked, pushes: pushes };
  }

  // 過去の自分だけの再生（今の自分がいない場合）。タイムラインの予告と軌跡の表示に使う
  function previewGhosts(room, ghostInputs) {
    var st = initState(room, ghostInputs.length, false), frames = [st];
    for (var t = 0; t < room.turns; t++) { st = step(room, st, ghostInputs, "W").state; frames.push(st); }
    return frames;
  }

  // 入力列を最初から再生する（無効な入力は飛ばしてターンを使わない＝プレイと同じ扱い）
  function replay(room, ghostInputs, inputs) {
    var st = initState(room, ghostInputs.length), states = [st], valid = [];
    for (var k = 0; k < inputs.length && st.t < room.turns && !st.cleared; k++) {
      var r = step(room, st, ghostInputs, inputs[k]);
      if (r.ok) { st = r.state; states.push(st); valid.push(inputs[k]); }
    }
    return { state: st, states: states, valid: valid.join("") };
  }

  function stateKey(st) {
    return st.t + "|" + st.me + "|" + st.ghosts.join(",") + "|" + st.boxes.slice().sort(function (a, b) { return a - b; }).join(",");
  }

  // 過去の自分を固定したときの、今の自分の最短クリア（幅優先探索）。解なしは null
  function solvePresent(room, ghostInputs) {
    var start = initState(room, ghostInputs.length), queue = [[start, ""]], seen = {};
    seen[stateKey(start)] = true;
    while (queue.length) {
      var item = queue.shift(), st = item[0];
      if (st.t >= room.turns) continue;
      for (var m = 0; m < MOVES.length; m++) {
        var r = step(room, st, ghostInputs, MOVES[m]);
        if (!r.ok) continue;
        var path = item[1] + MOVES[m];
        if (r.state.cleared) return path;
        var key = stateKey(r.state);
        if (seen[key]) continue;
        seen[key] = true;
        queue.push([r.state, path]);
      }

    if (c === "a") { g.moveTo(cx, cy - r); g.lineTo(cx + r, cy); g.lineTo(cx, cy + r); g.lineTo(cx - r, cy); g.closePath(); }
    else if (c === "b") { g.moveTo(cx, cy - r); g.lineTo(cx + r * .95, cy + r * .75); g.lineTo(cx - r * .95, cy + r * .75); g.closePath(); }
    else { g.arc(cx, cy, r * .85, 0, Math.PI * 2); }
  }

  function drawFigure(g, cx, cy, kind, alpha, label) {
    var s = S;
    g.save();
    g.globalAlpha = alpha;
    // 影
    g.fillStyle = "rgba(0,0,0,.45)";
    g.beginPath(); g.ellipse(cx, cy + s * .34, s * .24, s * .07, 0, 0, Math.PI * 2); g.fill();
    var body = function () {
      g.beginPath();
      g.moveTo(cx - s * .25, cy + s * .34);
      g.quadraticCurveTo(cx - s * .22, cy + s * .02, cx - s * .14, cy - s * .08);
      g.arc(cx, cy - s * .14, s * .16, Math.PI * 1.05, Math.PI * 1.95);
      g.quadraticCurveTo(cx + s * .22, cy + s * .02, cx + s * .25, cy + s * .34);
      g.quadraticCurveTo(cx, cy + s * .4, cx - s * .25, cy + s * .34);
      g.closePath();
    };
    if (kind === "me") {
      body(); g.fillStyle = C.ink; g.fill();
      g.fillStyle = C["wall-face"];
      g.beginPath(); g.ellipse(cx, cy - s * .12, s * .085, s * .1, 0, 0, Math.PI * 2); g.fill();
      // ランタン
      g.shadowColor = C.lamp; g.shadowBlur = s * .4;
      g.fillStyle = C["lamp-glow"];
      g.beginPath(); g.arc(cx + s * .27, cy + s * .1, s * .075, 0, Math.PI * 2); g.fill();
      g.shadowBlur = 0;
      g.strokeStyle = C.lamp; g.lineWidth = 1.2;
      g.beginPath(); g.moveTo(cx + s * .27, cy + s * .02); g.lineTo(cx + s * .2, cy - s * .02); g.stroke();
    } else {
      g.shadowColor = C.echo; g.shadowBlur = s * .35;
      body(); g.fillStyle = rgba(C.echo, .30); g.fill();
      g.shadowBlur = 0;
      g.strokeStyle = rgba(C.echo, .85); g.lineWidth = 1.4; g.stroke();
      g.fillStyle = rgba(C.void, .6);
      g.beginPath(); g.ellipse(cx, cy - s * .12, s * .075, s * .09, 0, 0, Math.PI * 2); g.fill();
      if (label) {
        g.fillStyle = C.echo; g.font = "700 " + Math.round(s * .22) + "px " + getComputedStyle(document.body).fontFamily;
        g.textAlign = "center"; g.textBaseline = "middle";
        g.fillText(label, cx, cy + s * .16);
      }
    }
    g.restore();
  }

  function lerp(a, b, t) { return a + (b - a) * t; }
  function posOf(i) { return [i % G.room.w, Math.floor(i / G.room.w)]; }
  function interp(ia, ib, t) {
    if (ia < 0 || ib < 0) return ib < 0 ? null : posOf(ib);
    var a = posOf(ia), b = posOf(ib);
    var e = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    return [lerp(a[0], b[0], e), lerp(a[1], b[1], e)];
  }

  // いま見せる場面（位置は補間）
  function view(now) {
    var from, to, t, mode = "play", focus = -1;
    if (G.seq) {
      var s = G.seq, f = Math.max(0, (now - s.start) / s.dur), k = Math.floor(f);
      if (k >= s.frames.length - 1) { finishSeq(); return view(now); }
      from = s.frames[k]; to = s.frames[k + 1]; t = f - k; mode = s.mode; focus = s.focus;
    } else if (G.anim) {
      t = G.anim.dur ? Math.max(0, Math.min(1, (now - G.anim.start) / G.anim.dur)) : 1;
      from = G.anim.from; to = G.anim.to;
      if (t >= 1) G.anim = null;
    } else { from = to = cur(); t = 1; }
    var v = { mode: mode, focus: focus, st: to, t: t };
    v.me = mode === "echo" ? posOf(G.room.start) : interp(from.me, to.me, t);
    v.ghosts = to.ghosts.map(function (gi, g) { return interp(from.ghosts.length === to.ghosts.length ? from.ghosts[g] : gi, gi, t); });
    v.boxes = to.boxes.map(function (bi, b) { return interp(from.boxes[b], bi, t); });
    return v;
  }

  function draw(now) {
    if (!staticLayer) buildStatic();
    var room = G.room, v = view(now), st = v.st;
    var W = room.w * S, H = room.h * S;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(staticLayer, 0, 0);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var open = K.openDoors(room, st), pressed = K.pressedColors(room, st);

    // スイッチ
    room.switches.forEach(function (sw) {
      var p = posOf(sw.i), px = p[0] * S, py = p[1] * S, on = !!pressed[sw.c] && (st.me === sw.i || st.ghosts.indexOf(sw.i) >= 0 || st.boxes.indexOf(sw.i) >= 0);
      var ins = S * .14;
      ctx.fillStyle = on ? rgba(rune(sw.c), .22) : C["wall-face"];
      ctx.fillRect(px + ins, py + ins, S - ins * 2, S - ins * 2);
      ctx.strokeStyle = rgba(rune(sw.c), on ? .95 : .55); ctx.lineWidth = 1.5;
      ctx.strokeRect(px + ins, py + ins, S - ins * 2, S - ins * 2);
      ctx.save();
      if (on) { ctx.shadowColor = rune(sw.c); ctx.shadowBlur = S * .4; }
      runePath(ctx, sw.c, px + S / 2, py + S / 2, S * .17);
      ctx.strokeStyle = rune(sw.c); ctx.lineWidth = 2; ctx.stroke();
      ctx.restore();
    });

    // 扉
    room.doors.forEach(function (d) {
      var p = posOf(d.i), px = p[0] * S, py = p[1] * S, col = rune(d.c);
      if (open[d.i]) {
        ctx.fillStyle = C["wall-top"];
        ctx.fillRect(px, py, S * .1, S); ctx.fillRect(px + S * .9, py, S * .1, S);
        ctx.setLineDash([3, 3]);
        runePath(ctx, d.c, px + S / 2, py + S / 2, S * .17);
        ctx.strokeStyle = rgba(col, .5); ctx.lineWidth = 1.2; ctx.stroke();
        ctx.setLineDash([]);
      } else {
        ctx.fillStyle = C["wall-top"]; ctx.fillRect(px + 1, py + 1, S - 2, S - 2);
        ctx.fillStyle = C.wall;
        for (var b = 0; b < 4; b++) ctx.fillRect(px + S * (.12 + b * .21), py + S * .08, S * .1, S * .84);
        ctx.strokeStyle = rgba(col, .7); ctx.lineWidth = 2; ctx.strokeRect(px + 2, py + 2, S - 4, S - 4);
        ctx.save(); ctx.shadowColor = col; ctx.shadowBlur = S * .25;
        ctx.fillStyle = C["wall-top"]; ctx.beginPath(); ctx.arc(px + S / 2, py + S / 2, S * .24, 0, Math.PI * 2); ctx.fill();
        runePath(ctx, d.c, px + S / 2, py + S / 2, S * .16);
        ctx.fillStyle = col; ctx.fill();
        ctx.restore();
      }
    });

    // 過去の自分の軌跡（残像の道）
    var tNow = st.t;
    G.preview.length && G.ghosts.forEach(function (_, g) {
      var focus = v.mode === "echo" ? (g === v.focus) : true;
      ctx.save();
      ctx.strokeStyle = rgba(C.echo, focus ? .28 : .12); ctx.lineWidth = Math.max(1.5, S * .05);
      ctx.setLineDash([S * .08, S * .12]); ctx.lineCap = "round";
      ctx.beginPath();
      var prev = -1;
      G.preview.forEach(function (f, t) {
        var gi = f.ghosts[g]; if (gi === prev) return;
        var p = posOf(gi);
        if (prev < 0) ctx.moveTo(p[0] * S + S / 2, p[1] * S + S / 2); else ctx.lineTo(p[0] * S + S / 2, p[1] * S + S / 2);
        prev = gi;
      });
      ctx.stroke(); ctx.setLineDash([]);
      // 行き先の印
      var endP = posOf(G.preview[G.preview.length - 1].ghosts[g]);
      ctx.fillStyle = rgba(C.echo, .35);
      ctx.beginPath(); ctx.arc(endP[0] * S + S / 2, endP[1] * S + S / 2, S * .07, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    });

    // 巻き戻し中：今の自分の軌跡
    if (v.mode === "rewind" && G.seq) {
      ctx.save();
      ctx.strokeStyle = rgba(C.lamp, .35); ctx.lineWidth = S * .06; ctx.lineCap = "round"; ctx.lineJoin = "round";
      ctx.beginPath();
      G.seq.frames.forEach(function (f, k) {
        if (f.me < 0) return;
        var p = posOf(f.me);
        if (k === 0) ctx.moveTo(p[0] * S + S / 2, p[1] * S + S / 2); else ctx.lineTo(p[0] * S + S / 2, p[1] * S + S / 2);
      });
      ctx.stroke(); ctx.restore();
    }

    // 箱
    v.boxes.forEach(function (p) {
      var px = p[0] * S, py = p[1] * S, ins = S * .1;
      ctx.fillStyle = "rgba(0,0,0,.4)"; ctx.fillRect(px + ins + 2, py + ins + 4, S - ins * 2, S - ins * 2);
      ctx.fillStyle = C.box; ctx.fillRect(px + ins, py + ins, S - ins * 2, S - ins * 2);
      ctx.fillStyle = C["box-hi"]; ctx.fillRect(px + ins, py + ins, S - ins * 2, S * .14);
      ctx.strokeStyle = rgba(C.void, .6); ctx.lineWidth = 1.5;
      ctx.strokeRect(px + S * .28, py + S * .36, S * .44, S * .36);
      ctx.beginPath(); ctx.moveTo(px + S * .5, py + S * .36); ctx.lineTo(px + S * .5, py + S * .72); ctx.stroke();
    });

    // 過去の自分
    v.ghosts.forEach(function (p, g) {
      if (!p) return;
      var shake = 0, bt = G.blocked[g];
      if (bt && now - bt < 360) shake = Math.sin((now - bt) / 22) * S * .05;
      var a = v.mode === "echo" ? (g === v.focus ? 1 : .55) : (v.mode === "rewind" ? .5 : .9);
      drawFigure(ctx, p[0] * S + S / 2 + shake, p[1] * S + S / 2, "ghost", a, String(g + 1));
      if (bt && now - bt < 700) {
        ctx.strokeStyle = rgba(C.danger, .8 * (1 - (now - bt) / 700)); ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(p[0] * S + S / 2, p[1] * S + S / 2, S * .42, 0, Math.PI * 2); ctx.stroke();
      }
    });

    // 今の自分
    if (v.me) {
      var bx = 0, by = 0;
      if (G.bump && now - G.bump.at < 180) {
        var dd = K.DIRS[G.bump.d], k2 = Math.sin((now - G.bump.at) / 180 * Math.PI) * S * .12;
        bx = dd[0] * k2; by = dd[1] * k2;
      }
      var meA = v.mode === "echo" ? .3 : (v.mode === "rewind" ? .85 : 1);
      drawFigure(ctx, v.me[0] * S + S / 2 + bx, v.me[1] * S + S / 2 + by, "me", meA);
    }

    // 灯りと影
    var flick = reduceMotion ? 1 : 1 + Math.sin(now / 170) * .025 + Math.sin(now / 53) * .012;
    lctx.setTransform(1, 0, 0, 1, 0, 0);
    lctx.globalCompositeOperation = "source-over";
    lctx.clearRect(0, 0, light.width, light.height);
    lctx.fillStyle = "rgba(3,4,7,0.84)"; lctx.fillRect(0, 0, light.width, light.height);
    lctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    lctx.globalCompositeOperation = "destination-out";
    function hole(x, y, r, a) {
      var gr = lctx.createRadialGradient(x, y, 0, x, y, r);
      gr.addColorStop(0, "rgba(0,0,0," + a + ")"); gr.addColorStop(.55, "rgba(0,0,0," + a * .6 + ")"); gr.addColorStop(1, "rgba(0,0,0,0)");
      lctx.fillStyle = gr; lctx.beginPath(); lctx.arc(x, y, r, 0, Math.PI * 2); lctx.fill();
    }
    if (v.me) hole(v.me[0] * S + S / 2, v.me[1] * S + S / 2, S * 3.4 * flick, v.mode === "echo" ? .55 : 1);
    v.ghosts.forEach(function (p) { if (p) hole(p[0] * S + S / 2, p[1] * S + S / 2, S * 1.7, .7); });
    var ep = posOf(room.exit); hole(ep[0] * S + S / 2, ep[1] * S + S / 2, S * 1.6, .8);
    room.switches.forEach(function (sw) { var p = posOf(sw.i); hole(p[0] * S + S / 2, p[1] * S + S / 2, S * (pressed[sw.c] ? 1.3 : .8), pressed[sw.c] ? .6 : .35); });
    room.doors.forEach(function (d) { var p = posOf(d.i); hole(p[0] * S + S / 2, p[1] * S + S / 2, S * .8, .35); });
    // 遠くまでうっすら見えるように全体を少しだけ明るく
    lctx.fillStyle = "rgba(0,0,0,.18)"; lctx.fillRect(0, 0, W, H);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(light, 0, 0);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // ランタンの暖かい光
    if (v.me) {
      ctx.save(); ctx.globalCompositeOperation = "lighter";
      var lx = v.me[0] * S + S / 2, ly = v.me[1] * S + S / 2;
      var gl = ctx.createRadialGradient(lx, ly, 0, lx, ly, S * 2.2 * flick);
      gl.addColorStop(0, rgba(C.lamp, v.mode === "echo" ? .05 : .16)); gl.addColorStop(1, rgba(C.lamp, 0));
      ctx.fillStyle = gl; ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }

    // 巻き戻しの色
    if (v.mode === "rewind") {
      ctx.fillStyle = rgba(C.echo, .10); ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = rgba(C.echo, .07);
      var off = (now / 6) % 6;
      for (var yy = -6 + off; yy < H; yy += 6) ctx.fillRect(0, yy, W, 1.5);
      ctx.fillStyle = rgba(C.echo, .9);
      ctx.beginPath();
      var ix = S * .3, iy = S * .3, ih = S * .36;
      ctx.moveTo(ix + ih * .55, iy); ctx.lineTo(ix, iy + ih / 2); ctx.lineTo(ix + ih * .55, iy + ih); ctx.closePath();
      ctx.moveTo(ix + ih * 1.1, iy); ctx.lineTo(ix + ih * .55, iy + ih / 2); ctx.lineTo(ix + ih * 1.1, iy + ih); ctx.closePath();
      ctx.fill();
    }
  }

  function frame(now) {
    try { draw(now); } catch (e) { console.error(e); }
    requestAnimationFrame(frame);
  }

  // ---------- 操作のつなぎこみ ----------
  Array.prototype.forEach.call(document.querySelectorAll("#pad button"), function (b) {
    b.addEventListener("pointerdown", function (e) { e.preventDefault(); input(b.dataset.d); b.classList.add("hit"); setTimeout(function () { b.classList.remove("hit"); }, 120); });
    b.addEventListener("click", function (e) { if (e.detail === 0) input(b.dataset.d); });
  });
  $("btnRetry").addEventListener("click", retry);
  $("btnErase").addEventListener("click", erase);
  $("btnRooms").addEventListener("click", function () { showRooms(); });
  $("btnCloseRooms").addEventListener("click", function () { $("sheetRooms").hidden = true; });
  $("btnQuit").addEventListener("click", function () { showEnd("quit"); });
  $("btnResume").addEventListener("click", function () { $("sheetEnd").hidden = true; G.roomEnter = Date.now(); });
  $("btnNext").addEventListener("click", function () { if (G.ri === 5) showEnd("complete"); else startRoom(G.ri + 1); });
  $("btnAgainRoom").addEventListener("click", function () { startRoom(G.ri, G.ri === 0); });
  $("btnReplay").addEventListener("click", function () { startRoom(0, true); });
  Array.prototype.forEach.call(document.querySelectorAll(".opt"), function (b) {
    b.addEventListener("click", function () {
      Array.prototype.forEach.call(document.querySelectorAll(".opt"), function (o) { o.setAttribute("aria-pressed", String(o === b)); });
      Metrics.set({ priceAnswer: b.dataset.v });
      $("thanks").textContent = "回答しました。ありがとう。";
    });
  });

  // 盤面：スワイプ、または隣のマスをタップ（自分をタップで待つ）
  var down = null;
  canvas.addEventListener("pointerdown", function (e) { down = { x: e.clientX, y: e.clientY }; try { canvas.setPointerCapture(e.pointerId); } catch (er) {} });
  canvas.addEventListener("pointerup", function (e) {
    if (!down) return;
    var dx = e.clientX - down.x, dy = e.clientY - down.y; down = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) > 18) {
      input(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "R" : "L") : (dy > 0 ? "D" : "U"));
      return;
    }
    if (G.seq) { finishSeq(); return; }
    var r = canvas.getBoundingClientRect();
    var cx = Math.floor((e.clientX - r.left) / S), cy = Math.floor((e.clientY - r.top) / S);
    var me = cur().me; if (me < 0) return;
    var mx = me % G.room.w, my = Math.floor(me / G.room.w), ddx = cx - mx, ddy = cy - my;
    if (ddx === 0 && ddy === 0) input("W");
    else if (Math.abs(ddx) + Math.abs(ddy) === 1) input(ddx === 1 ? "R" : ddx === -1 ? "L" : ddy === 1 ? "D" : "U");
  });
  canvas.addEventListener("pointercancel", function () { down = null; });

  window.addEventListener("keydown", function (e) {
    var map = { ArrowUp: "U", ArrowDown: "D", ArrowLeft: "L", ArrowRight: "R", w: "U", s: "D", a: "L", d: "R", " ": "W", ".": "W" };
    if (map[e.key]) { e.preventDefault(); input(map[e.key]); }
    else if (e.key === "r" || e.key === "Backspace") { e.preventDefault(); retry(); }
  });
  window.addEventListener("resize", layout);
  try { new ResizeObserver(layout).observe($("boardwrap")); } catch (e) {}

  // ---------- 開始 ----------
  var firstOpen = save.best.every(function (b) { return !b; });
  var startAt = 0;
  for (var i = 0; i < ROOMS.length; i++) { if (!save.best[i]) { startAt = i; break; } }
  startRoom(startAt, startAt === 0);
  requestAnimationFrame(frame);
  Metrics.connect();
  if (firstOpen && (Metrics.get().sessions || 0) <= 1) {
    setTimeout(function () { if (!G.anyInput && G.ri === 0) Metrics.set({ tutorialStuck: true }); }, 30000);
  }
  document.addEventListener("visibilitychange", function () { if (document.hidden) accrueTime(); else G.roomEnter = Date.now(); });
})();
</script>
</body></html>
