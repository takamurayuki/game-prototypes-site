<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.5 system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body><title>ウツリギ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@import url('https://fonts.googleapis.com/css2?family=DotGothic16&display=swap');
/* 単一テーマ：夜の採石場。旗だけが黄色く光る */
:root{
  color-scheme: dark;
  --bg:#0e1714; --bg2:#14211d; --bg3:#1b2b26;
  --rock:#2a3a34; --rock-dk:#1f2c27; --rock-edge:#93b5a2; --rock-dot:#34473f;
  --bars:#8a9ba6; --bars-dk:#56656e;
  --spike:#ef6b5b; --spike-lt:#ffb3a6;
  --exit:#7cf0c4; --exit-dk:#1f5a47;
  --flag:#ffd23f; --flag2:#ff9f1c; --pole:#f3efe2;
  --hero:#f3efe2; --hero-ink:#0b1210;
  --ink:#e8eee9; --ink2:#a4b6ad; --ink3:#6c8178;
  --btn:#1a2924; --btn-hi:#243832; --btn-edge:#3a5249; --btn-ink:#e8eee9;
  --danger:#ef6b5b;
  --dot:'DotGothic16','Hiragino Kaku Gothic ProN','Hiragino Sans','Noto Sans JP',monospace;
  --sans:'Hiragino Kaku Gothic ProN','Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:3px solid var(--flag);outline-offset:2px}

.wrap{height:100%;max-width:520px;margin:0 auto;position:relative;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{position:relative;height:100%}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;
  padding:max(8px,env(safe-area-inset-top,0px)) 0 max(12px,env(safe-area-inset-bottom,0px))}
.screen[hidden]{display:none}

/* ヘッダ */
.top{flex:none;display:flex;align-items:center;gap:10px;height:44px}
.sno{font-family:var(--dot);font-size:15px;color:var(--ink2);display:flex;align-items:baseline;gap:4px;min-width:52px}
.sno b{font-size:26px;color:var(--ink);font-weight:400;line-height:1}
.clock{flex:1;font-family:var(--dot);font-size:20px;font-variant-numeric:tabular-nums;color:var(--ink);text-align:left}
.clock small{font-size:12px;color:var(--ink3);margin-left:2px}
.tbtn{flex:none;height:34px;padding:0 10px;border:1px solid var(--btn-edge);border-radius:6px;background:var(--btn);
  font-size:13px;font-weight:700;color:var(--ink2);display:flex;align-items:center;gap:5px}
.tbtn:active{background:var(--btn-hi)}
.tbtn svg{width:15px;height:15px}
.tbtn.pulse{color:var(--hero-ink);background:var(--flag);border-color:var(--flag);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}

/* 遊ぶ場所：キャンバスの外の空白も引っぱれる */
.play{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;
  touch-action:none;cursor:crosshair}
.field{position:relative;flex:none}
#cv{display:block;touch-action:none;border-radius:4px}
.hint{flex:none;align-self:stretch;font-family:var(--dot);font-size:22px;line-height:1.2;color:var(--flag);letter-spacing:.06em;
  padding:0 0 10px 2px;pointer-events:none;transition:opacity .6s;min-height:36px}
.hint::before{content:'';display:inline-block;width:10px;height:10px;background:var(--flag);margin-right:10px;vertical-align:.12em}
.hint:empty::before{display:none}
.hint.off{opacity:.25}

/* 札（クリア・詰み） */
.card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(300px,88%);
  background:var(--bg2);border:2px solid var(--flag);border-radius:10px;padding:18px 18px 16px;text-align:left;
  box-shadow:0 10px 40px rgba(0,0,0,.6);cursor:default}
.card[hidden]{display:none}
.card.stuck{border-color:var(--danger)}
.card h2{font-family:var(--dot);font-weight:400;font-size:30px;color:var(--flag);line-height:1.1}
.card.stuck h2{color:var(--danger);font-size:22px}
.card p{font-size:14px;color:var(--ink2);margin-top:6px;line-height:1.5}
.times{margin-top:10px;display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:14px;color:var(--ink2)}
.times b{font-family:var(--dot);font-weight:400;font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums}
.times .new{color:var(--flag);font-size:12px;margin-left:6px}
.tease{margin-top:8px;font-size:13px;color:var(--exit)}
.tease:empty{display:none}
.primary{margin-top:14px;width:100%;height:50px;border-radius:8px;background:var(--flag);color:var(--hero-ink);
  font-family:var(--dot);font-size:20px;display:flex;align-items:center;justify-content:center;gap:8px}
.primary:active{transform:translateY(1px)}
.skip{position:absolute;right:6px;top:6px;height:30px;padding:0 10px;border-radius:6px;border:1px dashed var(--ink3);
  font-size:12px;color:var(--ink2);background:rgba(14,23,20,.8)}
.skip[hidden]{display:none}

/* 操作ボタン */
.pad{flex:none;display:flex;justify-content:space-between;gap:8px;margin-top:12px;height:78px;touch-action:none}
.pad .grp{display:flex;gap:8px}
.key{width:76px;height:78px;border-radius:12px;background:var(--btn);border:1px solid var(--btn-edge);
  border-bottom-width:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:12px;font-weight:700;color:var(--ink2);touch-action:none}
.key svg{width:30px;height:30px}
.key.on{background:var(--btn-hi);border-bottom-width:1px;transform:translateY(3px)}
.key.swap{border-color:#7a6a2a;color:var(--flag)}
.key.swap.on{background:#3a3418}
.key.swap.off{opacity:.45}
.key.jump{width:96px}

/* タイトル・終了 */
.center{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;padding-bottom:20px}
.logo{font-family:var(--dot);font-size:54px;line-height:1;color:var(--ink);letter-spacing:.04em;display:flex;align-items:flex-end;gap:10px}
.logo svg{width:54px;height:66px;flex:none}
.sub{font-size:14px;color:var(--ink2);line-height:1.6}
.sub.tip{font-size:13px;color:var(--ink3);margin-top:-10px}
.btns{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.ghost{height:48px;border-radius:8px;border:1px solid var(--btn-edge);background:var(--btn);font-size:15px;font-weight:700;color:var(--ink)}
.ghost:active{background:var(--btn-hi)}

.end{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:16px;padding:12px 0 8px}
.end h1{font-family:var(--dot);font-weight:400;font-size:34px;color:var(--flag)}
.stat{display:flex;gap:10px}
.stat div{flex:1;background:var(--bg2);border:1px solid var(--btn-edge);border-radius:8px;padding:10px 12px}
.stat small{display:block;font-size:12px;color:var(--ink3)}
.stat b{font-family:var(--dot);font-weight:400;font-size:28px;font-variant-numeric:tabular-nums}
.stat b span{font-size:14px;color:var(--ink2)}
.rows{list-style:none;display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.rows li{background:var(--bg2);border-radius:5px;text-align:center;padding:5px 0 4px;font-family:var(--dot);font-size:12px;color:var(--ink3)}
.rows li.ok{background:var(--bg3);color:var(--flag)}
.rows li i{display:block;font-style:normal;font-size:10px;color:var(--ink2);margin-top:1px}
.q{font-weight:700;font-size:16px;line-height:1.5}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{height:48px;border-radius:8px;border:1px solid var(--btn-edge);background:var(--btn);font-size:15px;font-weight:700;text-align:left;padding:0 14px;
  display:flex;align-items:center;gap:10px}
.opt::before{content:'';width:14px;height:14px;border-radius:50%;border:2px solid var(--ink3);flex:none}
.opt[aria-pressed="true"]{border-color:var(--flag);color:var(--flag)}
.opt[aria-pressed="true"]::before{border-color:var(--flag);background:var(--flag)}
.thanks{font-size:13px;color:var(--exit);min-height:1em}

@media (prefers-reduced-motion: reduce){
  .tbtn.pulse{animation:none}
  .hint{transition:none}
}
@media (max-height:640px){
  .pad{height:64px;margin-top:8px}
  .key{height:64px;width:66px}
  .key.jump{width:84px}
  .key svg{width:24px;height:24px}
}
</style>

<div class="wrap"><div class="inner">
  <!-- タイトル（2回目以降） -->
  <section class="screen" id="title" hidden>
    <div class="center">
      <div class="logo">
        <svg viewBox="0 0 54 66" aria-hidden="true"><line x1="10" y1="62" x2="10" y2="6" stroke="#f3efe2" stroke-width="4" stroke-linecap="round"/><path d="M12 7 L48 14 L12 28 Z" fill="#ffd23f"/><path d="M12 18 L36 18 L12 28 Z" fill="#ff9f1c"/></svg>
        <span>ウツリギ</span>
      </div>
      <p class="sub" id="titleSub"></p>
      <p class="sub tip" id="titleTip">落ちても、刺さった旗があれば自動で入れ替わる。</p>
      <div class="btns">
        <button type="button" class="primary" id="tContinue"></button>
        <button type="button" class="ghost" id="tNew">はじめから</button>
      </div>
    </div>
  </section>

  <!-- ゲーム -->
  <section class="screen" id="game" hidden>
    <div class="top">
      <div class="sno"><b id="sno">1</b>/7</div>
      <div class="clock" id="clock">0.0<small>秒</small></div>
      <button type="button" class="tbtn" id="restart" aria-label="この面を最初から">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 8a5 5 0 1 0 1.6-3.7"/><path d="M3 2.5v3h3"/></svg>最初から</button>
      <button type="button" class="tbtn" id="quit">おわる</button>
    </div>
    <div class="play" id="play">
     <div class="hint" id="hint"></div>
     <div class="field" id="field">
      <canvas id="cv" aria-label="ステージ。引っぱって離すと旗を投げる。入れ替えボタンで旗の位置へ乗り移る"></canvas>
      <button type="button" class="skip" id="skip" hidden>この面をとばす</button>
      <div class="card" id="clearCard" hidden>
        <h2>クリア</h2>
        <div class="times">
          <span>タイム</span><b id="cTime"></b>
          <span>ベスト</span><b id="cBest"></b>
          <span id="cAuthL" hidden>作者</span><b id="cAuth" hidden></b>
        </div>
        <div class="tease" id="cTease"></div>
        <button type="button" class="primary" id="next">次へ</button>
      </div>
      <div class="card stuck" id="stuckCard" hidden>
        <h2>旗が戻せない…</h2>
        <p>起き上がる場所がなくなった。</p>
        <button type="button" class="primary" id="stuckRestart">
          <svg viewBox="0 0 16 16" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 8a5 5 0 1 0 1.6-3.7"/><path d="M3 2.5v3h3"/></svg>最初から</button>
      </div>
     </div>
    </div>
    <div class="pad" id="pad">
      <div class="grp">
        <button type="button" class="key" data-k="l" aria-label="左へ">
          <svg viewBox="0 0 30 30"><path d="M19 6 L9 15 L19 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button type="button" class="key" data-k="r" aria-label="右へ">
          <svg viewBox="0 0 30 30"><path d="M11 6 L21 15 L11 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
      <div class="grp">
        <button type="button" class="key swap" data-k="swap">
          <svg viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 11h17l-4-4"/><path d="M24 19H7l4 4"/></svg>入れ替え</button>
        <button type="button" class="key jump" data-k="jump">
          <svg viewBox="0 0 30 30"><path d="M7 19 L15 9 L23 19" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>ジャンプ</button>
      </div>
    </div>
  </section>

  <!-- 終了 -->
  <section class="screen" id="end" hidden>
    <div class="end">
      <h1 id="endTitle">おつかれさま</h1>
      <div class="stat">
        <div><small>クリア</small><b id="eN">0</b><b><span> / 7面</span></b></div>
        <div><small>合計タイム</small><b id="eT">-</b></div>
      </div>
      <ul class="rows" id="eRows"></ul>
      <p class="sub" id="eBest"></p>
      <div>
        <p class="q">この仕掛けで、もっと遊びたいですか？</p>
        <div class="opts" id="opts" style="margin-top:10px"></div>
        <p class="thanks" id="thanks" style="margin-top:8px"></p>
      </div>
      <button type="button" class="primary" id="again">もう一度遊ぶ</button>
    </div>
  </section>
</div></div>

<script id="logic">
/* ===== ルール（純粋関数。DOM に触らない。Node でもそのまま動く） =====
 * 座標はマス単位。x→右、y→下。主人公は (x=足元の中心, y=足の高さ)。
 * 1 tick = 1/60 秒の固定ステップ。同じ入力列なら必ず同じ結果になる。
 *
 * 再設計 v2（物理試作・第1弾）：「投げて、入れ替わる」
 *  - 旗は1本。引いて離すと放物線で飛ぶ。壁・床に刺さる／鉄格子はすり抜ける／0.75秒でその場に浮く
 *  - 画面の端（左右上）を越えた旗・下へ落ちた旗は消えて手に戻る（交換できない）。トゲに刺さった旗とは交換できない
 *  - 入れ替えボタン：自分が旗の位置と速度を受け取り、旗は手に戻る
 *      飛行中の旗 → 投射状態（重力24）で飛ぶ。浮いた旗 → その場から落ちる。どちらも空中チャージを1つ使う
 *      地形に刺さった旗 → 法線側に収まる位置へ。無料でチャージ回復、12ステップぶら下がる
 *  - 地上は加速・減速あり、空中は小さな加速だけ（慣性）。助走で旗の初速が伸びる
 *  - 穴・トゲ → 復帰点（地形の上に6フレーム以上立った地点）へ0.5秒で巻き戻し
 *  - 自動入れ替え（三者確定 2026-11-07）：空中で致命判定が出たtickに、そのとき手動で入れ替えられる旗があれば
 *      巻き戻しの代わりにその旗と入れ替える。判定は手動と同じ swapTarget()、処理も同じ doSwap()。
 *      手動の入れ替えでできないことは何もさせない（結果は「次のtickに手動で押した場合」と一致する）
 * 処理順（固定）：入力 → 入れ替え → 投げの開放 → 自分の積分 → 旗の積分（細分ステップ）
 *               → 刺さり・浮遊判定 → 危険判定（→自動入れ替え）→ 接地・回復・復帰点の更新 → 助走値の更新
 */
const L = (() => {
  const W = 16, H = 18, DT = 1 / 60;
  const P = {
    w: 0.6, h: 0.9, speed: 5.5,
    accel: 5.5 / (18 / 60),        // 停止→最高速 18フレーム
    decel: 2 * 5.5 / (18 / 60),    // 逆入力・手を離したときの減速（2倍）
    airAcc: 20,                    // 空中の入力は加速だけ
    g: 38, jump: 13.5, maxFall: 18, coyote: 5, buffer: 6,
  };
  const F = { vmax: 17, g: 24, ticks: 45, sub: 4, reach: 0.3, hand: 0.35, pole: 1.0, run: 0.35 };
  const VCAP = F.vmax * (1 + F.run);   // 22.95：速度ベクトルの上限（旗の最大初速）
  const HANG = 12, SWAP_HOLD = 3, REWIND = 30, CHECK = 6, SLIDE = 0.45, SLIDE_STEP = 0.05;
  const EPS = 1e-6;
  // 切り替え（既定は有効）。記録の再生・テストで自動入れ替えを止めるときは L.OPT.autoSwap = false
  const OPT = { autoSwap: true };

  /* ---- 面の読み込み ---- */
  // # 壁  | 鉄格子（旗だけ通る）  ^ トゲ  E 出口（このマスと上のマス）  S 開始位置  . 空
  function parse(def) {
    const grid = def.map.map(r => r.split(''));
    if (grid.length !== H || grid.some(r => r.length !== W)) throw new Error('map size: ' + def.name);
    let start = null, exit = null;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const c = grid[y][x];
      if (c === 'S') { start = { x: x + 0.5, y: y + 1 }; grid[y][x] = '.'; }
      if (c === 'E') { exit = { x, y }; grid[y][x] = '.'; }
    }
    if (!start || !exit) throw new Error('S/E missing: ' + def.name);
    return { name: def.name, hint: def.hint || '', author: def.author || 0, grid, start, exit };
  }
  function cell(lv, x, y) {
    if (x < 0 || x >= W || y < 0) return '#';
    if (y >= H) return '.';
    return lv.grid[y][x];
  }
  const playerSolid = c => c === '#' || c === '|';
  function boxSolid(lv, x0, y0, x1, y1) {
    for (let ty = Math.floor(y0 + EPS); ty <= Math.floor(y1 - EPS); ty++)
      for (let tx = Math.floor(x0 + EPS); tx <= Math.floor(x1 - EPS); tx++)
        if (playerSolid(cell(lv, tx, ty))) return true;
    return false;
  }
  // トゲの当たり：マスの下半分（主人公は少し内側）
  function boxSpike(lv, x0, y0, x1, y1) {
    for (let ty = Math.floor(y0); ty <= Math.floor(y1); ty++)
      for (let tx = Math.floor(x0); tx <= Math.floor(x1); tx++)
        if (cell(lv, tx, ty) === '^' && x1 > tx + 0.1 && x0 < tx + 0.9 && y1 > ty + 0.5 && y0 < ty + 1) return true;
    return false;
  }
  const pSolid = (lv, x, y) => boxSolid(lv, x - P.w / 2, y - P.h, x + P.w / 2, y);
  const pSpike = (lv, x, y) => boxSpike(lv, x - P.w / 2 + 0.04, y - P.h, x + P.w / 2 - 0.04, y + 0.02);
  // 旗の先が当たるもの：画面の端（左右上）は 'edge'、'#' は 'wall'、トゲの下半分は 'spike'
  // 端の判定は cell() と同じ境界（x<0・x>=W・y<0 が画面の外）にそろえる。x===W ちょうども端（地形には刺さらない）
  function flagHit(lv, x, y) {
    if (x < 0 || x >= W || y < 0) return 'edge';
    if (y >= H) return null;
    const tx = Math.floor(x), ty = Math.floor(y), c = cell(lv, tx, ty);
    if (c === '#') return 'wall';
    if (c === '^' && y >= ty + 0.5) return 'spike';
    return null;
  }
  const flagSolid = (lv, x, y) => { const h = flagHit(lv, x, y); return h === 'wall' || h === 'spike'; };

  // 速度の上限：大きさ VCAP 以下（向き保持）→ 下向きは maxFall
  function capV(o) {
    const m = Math.hypot(o.vx, o.vy);
    if (m > VCAP) { o.vx = o.vx / m * VCAP; o.vy = o.vy / m * VCAP; }
    if (o.vy > P.maxFall) o.vy = P.maxFall;
    return o;
  }
  // 自由飛行の1サブステップ（旗と自分で共通）：重力を足す → 上限で丸める → 丸めた速度で動く。
  // 速度 o.vx/o.vy を更新し、この1サブステップの移動量 [dx, dy] を返す。
  // 旗も自分もこの関数だけで積分するので、上限が作動する軌道でも投射状態の自分は旗と同じ所を通る
  function subMove(o, g, h) {
    o.vy += g * h; capV(o);
    return [o.vx * h, o.vy * h];
  }

  /* ---- 状態 ---- */
  function init(lv) {
    const x = lv.start.x, y = lv.start.y - EPS;
    return {
      t: 0, clear: false,
      p: { x, y, vx: 0, vy: 0, ground: true, coyote: 0, buf: 0, face: 1, proj: false, hang: 0 },
      hold: true, charge: 1, a: 0, aHold: false, aimOn: false, swapBuf: 0,
      stand: CHECK, cp: { x, y },              // 復帰点（開始位置は地形の上）
      rew: 0, rewFrom: null, fails: 0, swaps: 0, inFlightSwaps: 0,
      // 旗：mode 'fly' | 'stop'。kind 'fly' | 'ground'（地形に刺さった）| 'air'（浮いた）| 'spike'
      // 手に戻ったら hold=true（f は最後の状態を残すだけ）
      f: { mode: 'stop', x, y, vx: 0, vy: 0, age: 0, kind: 'none', ang: -Math.PI / 2, nx: 0, ny: -1, sx: 0, sy: 0 },
      ev: [],
      // 計測：自動入れ替えの回数／救済のあと接地しないまま巻き戻しになった回数。
      // autoArmed＝救済してからまだ接地していない（巻き戻しになったら autoSwapThenFail に数える）
      autoSwaps: 0, autoSwapThenFail: 0, autoArmed: false,
    };
  }
  function clone(s) { return { ...s, p: { ...s.p }, f: { ...s.f }, cp: { ...s.cp }, ev: [] }; }

  /* ---- 旗を1tick飛ばす（予測線にも同じ関数を使う）。止まったら kind を返す ---- */
  function flyTick(lv, f) {
    const n = F.sub, h = DT / n;
    for (let k = 0; k < n; k++) {
      const v = { vx: f.vx, vy: f.vy }, [dx, dy] = subMove(v, F.g, h);
      const nvx = v.vx, nvy = v.vy;
      const nx = f.x + dx, ny = f.y + dy;
      if (ny >= H + 0.6) { f.vx = nvx; f.vy = nvy; f.y = ny; f.x = nx; f.mode = 'stop'; f.kind = 'lost'; return 'lost'; }
      const hit = flagHit(lv, nx, ny);
      if (hit === 'edge') { f.x = nx; f.y = ny; f.mode = 'stop'; f.kind = 'edge'; return 'edge'; }
      if (hit) {
        // 法線：刺さる直前のサブステップで軸ごとに判定。両方なら速度の大きい軸、同点は縦
        const hx = flagSolid(lv, nx, f.y), hy = flagSolid(lv, f.x, ny);
        let axis;
        if (hx && !hy) axis = 'x';
        else if (hy && !hx) axis = 'y';
        else axis = Math.abs(nvx) > Math.abs(nvy) ? 'x' : 'y';
        if (axis === 'x') { f.nx = nvx > 0 ? -1 : 1; f.ny = 0; f.sx = nvx > 0 ? Math.floor(nx) : Math.floor(nx) + 1; f.sy = f.y; }
        else { f.nx = 0; f.ny = nvy > 0 ? -1 : 1; f.sy = nvy > 0 ? Math.floor(ny) : Math.floor(ny) + 1; f.sx = f.x; }
        f.vx = nvx; f.vy = nvy;
        f.mode = 'stop'; f.kind = hit === 'spike' ? 'spike' : 'ground';
        f.ang = Math.atan2(-f.vy, -f.vx);
        f.vx = 0; f.vy = 0;
        return f.kind;
      }
      f.x = nx; f.y = ny; f.vx = nvx; f.vy = nvy;
    }
    f.age++;
    if (f.age >= F.ticks) { f.mode = 'stop'; f.kind = 'air'; f.ang = -Math.PI / 2; f.vx = 0; f.vy = 0; return 'air'; }
    return null;
  }
  function handPos(p) { return { x: p.x, y: p.y - P.h + F.hand }; }
  // 投げの初速：u×(Vmax×p) ＋ (0.35×Vmax×a, 0)
  function throwVel(vx, vy, a) {
    const m = Math.hypot(vx, vy);
    if (m > F.vmax) { vx = vx / m * F.vmax; vy = vy / m * F.vmax; }
    return capV({ vx: vx + F.run * F.vmax * (a || 0), vy });
  }
  // 予測線：手から投げたときの通り道と止まる場所（助走 a を含む）
  function predict(lv, p, vx, vy, a) {
    const v = throwVel(vx, vy, a), h = handPos(p);
    const f = { mode: 'fly', x: h.x, y: h.y, vx: v.vx, vy: v.vy, age: 0, kind: 'fly', ang: 0, nx: 0, ny: 0, sx: 0, sy: 0 };
    const pts = [[f.x, f.y]];
    for (let i = 0; i < 200; i++) { const done = flyTick(lv, f); pts.push([f.x, f.y]); if (done) break; }
    return { pts, end: f };
  }
  // 飛行中の旗の残りの通り道（交換後の自分の通り道の目安）
  function flagPath(lv, f0) {
    const f = { ...f0 }, pts = [[f.x, f.y]];
    for (let i = 0; i < 200 && f.mode === 'fly'; i++) { flyTick(lv, f); pts.push([f.x, f.y]); }
    return { pts, end: f };
  }

  /* ---- 入れ替えの着地点 ---- */
  const okAt = (lv, x, y) => !pSolid(lv, x, y) && !pSpike(lv, x, y);
  // 返り値 { x, y, ok, cost(使うチャージ), why }
  function swapTarget(lv, s) {
    const f = s.f;
    if (s.hold) return { ok: false, why: 'hold' };
    if (f.kind === 'spike') return { ok: false, why: 'spike' };
    if (f.kind === 'ground') {
      let x, y, along;
      if (f.ny === -1) { x = f.x; y = f.sy - EPS; along = 'x'; }                  // 床：上に立つ
      else if (f.ny === 1) { x = f.x; y = f.sy + P.h + EPS; along = 'x'; }        // 天井：下にぶら下がる
      else if (f.nx === -1) { x = f.sx - P.w / 2 - EPS; y = f.y + P.h / 2; along = 'y'; } // 右の壁：左側に
      else { x = f.sx + P.w / 2 + EPS; y = f.y + P.h / 2; along = 'y'; }           // 左の壁：右側に
      if (okAt(lv, x, y)) return { x, y, ok: true, cost: 0 };
      // 表面に沿う1軸だけ最大0.45マスずらす（上・左を先に）
      for (let d = SLIDE_STEP; d <= SLIDE + EPS; d += SLIDE_STEP) {
        const dd = Math.round(d * 100) / 100;
        const tries = along === 'y' ? [[0, -dd], [0, dd]] : [[-dd, 0], [dd, 0]];
        for (const [dx, dy] of tries) if (okAt(lv, x + dx, y + dy)) return { x: x + dx, y: y + dy, ok: true, cost: 0 };
      }
      return { x, y, ok: false, cost: 0, why: 'blocked' };
    }
    if (f.mode === 'fly' || f.kind === 'air') {
      // 手の位置＝旗の位置になるように置く（予測線の続きがそのまま自分の通り道になる）
      const x = f.x, y = f.y + P.h - F.hand;
      if (s.charge < 1) return { x, y, ok: false, cost: 1, why: 'charge' };
      if (!okAt(lv, x, y)) return { x, y, ok: false, cost: 1, why: 'blocked' };
      return { x, y, ok: true, cost: 1 };
    }
    return { ok: false, why: 'none' };
  }

  /* ---- 当たり ---- */
  function distBoxPt(p, x, y) {
    const dx = Math.max(p.x - P.w / 2 - x, 0, x - (p.x + P.w / 2));
    const dy = Math.max(p.y - P.h - y, 0, y - p.y);
    return Math.hypot(dx, dy);
  }
  function canPick(s) {
    const f = s.f;
    if (s.hold || f.mode !== 'stop' || (f.kind !== 'ground' && f.kind !== 'air')) return false;
    for (const k of [0, 0.5, 1]) {
      const x = f.x + Math.cos(f.ang) * F.pole * k, y = f.y + Math.sin(f.ang) * F.pole * k;
      if (distBoxPt(s.p, x, y) <= F.reach) return true;
    }
    return false;
  }
  function atExit(lv, p) {
    const e = lv.exit;
    return p.x + P.w / 2 > e.x + 0.2 && p.x - P.w / 2 < e.x + 0.8 && p.y > e.y - 1 && p.y - P.h < e.y + 1;
  }
  function deadly(lv, p) { return p.y - P.h > H || pSpike(lv, p.x, p.y); }
  function returnFlag(s) { s.hold = true; s.f.mode = 'stop'; }
  // 入れ替えの本体（手動＝処理順2、自動＝処理順7 の両方から呼ぶ）。tg は swapTarget() の ok な返り値。
  // 自分が旗の位置・速度を受け取り、旗は手に戻る。チャージ精算：刺さった旗＝無料で1に回復／飛行中・浮いた旗＝cost を使う
  function doSwap(s, s0, tg) {
    const p = s.p, f = s.f, wasFly = f.mode === 'fly';
    p.x = tg.x; p.y = tg.y; p.coyote = 0; p.buf = 0; p.ground = false;
    if (wasFly) { p.vx = f.vx; p.vy = f.vy; capV(p); p.proj = true; p.hang = 0; }
    else { p.vx = 0; p.vy = 0; p.proj = false; p.hang = f.kind === 'ground' ? HANG : 0; }
    if (f.kind === 'ground') s.charge = 1; else s.charge -= tg.cost;
    s.swaps++; if (wasFly) s.inFlightSwaps++; s.stand = 0;
    s.swapFrom = { x: s0.p.x, y: s0.p.y, kind: wasFly ? 'fly' : f.kind };
    returnFlag(s); s.swapBuf = 0; s.ev.push('swap');
  }

  /* ---- 1 tick 進める ----
   * inp: { l, r, jump(押した瞬間), throw: {vx,vy}|null（引きの量。助走は中で足す）,
   *        swap(押した瞬間), recall(旗が出ている間に引き始めた), aim(照準中) } */
  function step(lv, s0, inp) {
    const s = clone(s0); inp = inp || {};
    if (s.clear) return s;
    s.t++;
    const p = s.p;

    // 巻き戻し中
    if (s.rew > 0) {
      s.rew--;
      if (s.rew === 0) {
        p.x = s.cp.x; p.y = s.cp.y; p.vx = p.vy = 0; p.ground = true; p.coyote = 0; p.buf = 0; p.proj = false; p.hang = 0;
        s.hold = true; s.charge = 1; s.a = 0; s.aHold = false; s.aimOn = false; s.swapBuf = 0; s.stand = CHECK;
        s.ev.push('rewound');
      }
      return s;
    }

    // 1. 入力
    const dir = (inp.r ? 1 : 0) - (inp.l ? 1 : 0);
    if (inp.recall && !s.hold) { returnFlag(s); s.ev.push('recall'); }
    if (inp.swap) s.swapBuf = SWAP_HOLD;

    // 2. 入れ替え（押してから3フレームは試し続ける）
    if (s.swapBuf > 0) {
      const tg = swapTarget(lv, s);
      if (tg.ok) doSwap(s, s0, tg);
      else s.swapBuf--;
    }

    // 3. 投げの開放（旗が出ていれば手に戻してから投げる）
    if (inp.throw) {
      const v = throwVel(inp.throw.vx, inp.throw.vy, s.a), h = handPos(p);
      s.f = { mode: 'fly', x: h.x, y: h.y, vx: v.vx, vy: v.vy, age: 0, kind: 'fly', ang: Math.atan2(v.vy, v.vx), nx: 0, ny: 0, sx: 0, sy: 0 };
      s.hold = false; p.proj = false; s.swapBuf = 0; s.ev.push('throw');
      if (v.vx) p.face = v.vx > 0 ? 1 : -1;
    }

    // 4. 自分の積分
    if (dir) p.face = dir;
    if (p.ground) {
      if (dir) {
        if (p.vx * dir < 0) p.vx += dir * P.decel * DT;
        else if (Math.abs(p.vx) < P.speed) p.vx = dir * Math.min(P.speed, Math.abs(p.vx) + P.accel * DT);
        else p.vx = dir * Math.max(P.speed, Math.abs(p.vx) - P.decel * DT);
      } else {
        const d = P.decel * DT;
        p.vx = Math.abs(p.vx) <= d ? 0 : p.vx - Math.sign(p.vx) * d;
      }
    } else if (dir) {
      // 空中：±20マス/秒² の加速だけ（同方向にも頭打ちなし。制限は全体の上限 22.95／落下18 だけ）
      p.vx += dir * P.airAcc * DT;
    }
    p.buf = inp.jump ? P.buffer : Math.max(0, p.buf - 1);
    p.coyote = p.ground ? P.coyote : Math.max(0, p.coyote - 1);
    if (p.buf > 0 && p.coyote > 0 && p.hang === 0) { p.vy = -P.jump; p.buf = 0; p.coyote = 0; p.ground = false; s.ev.push('jump'); }
    // 積分は旗と同じ subMove を同じ細分（F.sub）で回す（重力→上限→移動の順もサブステップごとに同じ）。
    // 投射状態の自分は、上限が作動する軌道でも予測線の続きを正確に通る。当たり判定は1tick分の移動量でまとめて行う
    const g = p.hang > 0 ? 0 : p.proj ? F.g : P.g;
    if (p.hang > 0) { p.hang--; p.vy = 0; }
    let px = p.x, py = p.y;
    for (let k = 0, h = DT / F.sub; k < F.sub; k++) { const [ddx, ddy] = subMove(p, g, h); px += ddx; py += ddy; }
    const dy = py - p.y;

    // 横
    let nx = px;
    if (p.vx && pSolid(lv, nx, p.y)) {
      nx = p.vx > 0 ? Math.floor(nx + P.w / 2) - P.w / 2 - EPS : Math.floor(nx - P.w / 2) + 1 + P.w / 2 + EPS;
      if (pSolid(lv, nx, p.y)) nx = p.x;
      p.vx = 0; p.proj = false;
    }
    p.x = nx;
    // 縦
    let ny = py;
    if (dy && pSolid(lv, p.x, ny)) {
      if (dy > 0) ny = Math.floor(ny) - EPS;
      else ny = Math.floor(ny - P.h) + 1 + P.h + EPS;
      if (pSolid(lv, p.x, ny)) ny = p.y;
      p.vy = 0; p.proj = false;
    }
    p.y = ny;

    // 5・6. 旗の積分と刺さり・浮遊判定
    if (!s.hold && s.f.mode === 'fly') {
      const r = flyTick(lv, s.f);
      if (r === 'edge' || r === 'lost') { returnFlag(s); s.ev.push(r); }
      else if (r) s.ev.push(r === 'air' ? 'float' : r === 'spike' ? 'spike' : 'plant');
    }

    // 7. 危険判定
    if (deadly(lv, p)) {
      // 自動入れ替え：tick開始時に空中にいて（地上でトゲに歩いて触れたのは対象外）、手動と同じ判定で入れ替えられ、
      // 着地点が画面下の外でなければ、巻き戻しの代わりに入れ替える。旗は処理順5・6の後の状態（このtickに刺さった旗は無料）。
      // 入れ替えたらこのtickはここで終える（8 接地・回復・復帰点、9 助走値は行わない）→ 次tickに手動で押した場合と同じ状態になる
      if (OPT.autoSwap && s0.p.ground === false) {
        const tg = swapTarget(lv, s);
        if (tg.ok && !deadly(lv, tg)) {
          doSwap(s, s0, tg);
          s.a = 0; s.aHold = false; s.aimOn = false; // 照準状態も含めてこの tick を打ち切る（次に照準したときは照準開始として扱う）
          s.autoSwaps++; s.autoArmed = true; s.ev.push('autoswap');
          return s;
        }
      }
      if (s.autoArmed) { s.autoSwapThenFail++; s.autoArmed = false; }
      s.rew = REWIND; s.fails++; s.rewFrom = { x: p.x, y: p.y };
      returnFlag(s); p.vx = p.vy = 0; s.ev.push('fail');
      return s;
    }

    // 8. 接地・回復・復帰点
    const onTile = p.vy >= 0 && pSolid(lv, p.x, p.y + 0.02);
    p.ground = onTile;
    if (p.ground) {
      p.hang = 0; p.proj = false; s.charge = 1; s.autoArmed = false;
      s.stand++;
      if (s.stand >= CHECK) { s.cp.x = p.x; s.cp.y = p.y; }
    } else s.stand = 0;
    if (canPick(s)) { s.hold = true; s.ev.push('pick'); }
    if (atExit(lv, p)) { s.clear = true; s.ev.push('clear'); }

    // 9. 助走値：照準中に同じ向きを押し続けていれば保つ。それ以外は接地中の水平速度から取り直す
    //    （照準を始めたtickは取り直し、以後は離すか逆を押すまで保つ）
    const keep = !!inp.aim && s.aimOn && s.aHold && dir !== 0 && Math.sign(s.a) === dir;
    if (!keep) s.a = p.ground ? Math.max(-1, Math.min(1, p.vx / P.speed)) : 0;
    s.aHold = !!inp.aim && (s.aimOn ? keep : true);
    s.aimOn = !!inp.aim;
    return s;
  }

  /* ---- 入力列 ----
   * 簡易記法（テスト用）：['R',n] 右をn tick  ['L',n]  ['W',n] 待つ  ['J'] / ['RJ',n] / ['LJ',n] 跳んでから押し続ける
   * ['T',vx,vy] 投げる ['RT',vx,vy] 右を押しながら投げる  ['X'] 入れ替え ['RX'] 右を押しながら入れ替え  ['C'] 手元へ戻す
   * 記録形式：[[ステップ番号, {入力}], ...]（空の入力のステップは省く）。toLog / fromLog で相互変換 */
  function expand(script) {
    const out = [];
    for (const c of script) {
      const [k, a, b] = c;
      const l = k[0] === 'L', r = k[0] === 'R';
      if (k.endsWith('T')) out.push({ l, r, throw: { vx: a, vy: b } });
      else if (k.endsWith('X')) out.push({ l, r, swap: true });
      else if (k === 'C') out.push({ recall: true });
      else if (k === 'J') out.push({ jump: true });
      else {
        const n = a || 1;
        for (let i = 0; i < n; i++) out.push({ l, r, jump: k.endsWith('J') && i === 0 });
      }
    }
    return out;
  }
  const clean = o => { const r = {}; for (const k in o) if (o[k]) r[k] = o[k]; return r; };
  function toLog(ins) { const log = []; ins.forEach((o, i) => { const c = clean(o); if (Object.keys(c).length) log.push([i + 1, c]); }); return log; }
  function fromLog(log, n) {
    const last = log.length ? log[log.length - 1][0] : 0, out = [];
    for (let i = 0; i < Math.max(n || 0, last); i++) out.push({});
    for (const [t, o] of log) out[t - 1] = { ...o };
    return out;
  }
  function run(lv, ins, extra, s) {
    s = s || init(lv);
    for (let i = 0; i < ins.length && !s.clear; i++) s = step(lv, s, ins[i]);
    for (let i = 0; i < (extra || 0) && !s.clear; i++) s = step(lv, s, {});
    return s;
  }
  function replay(lv, script, extra) { return run(lv, expand(script), extra); }

  /* ---- 7面（旧面をそのまま。作り直しは範囲外） ---- */
  const S = '................';
  // author = 新規則での想定解の入力列（テストで再生）でのクリア時間（tick）。新規則で解が確認できた面だけ
  const LEVELS_DEF = [
  { name: '旗', hint: '引っぱって、投げる', author: 0, map: [
    S,S,S,S,S,S,S,S,S,S,S,S,
    '..............E.',
    '...S.......#####',
    '######^^^#######',
    '################','################','################'] },
  { name: '鉄格子', hint: '旗は、すりぬける', author: 43, map: [
    S,S,S,S,S,
    '################',
    '#.......|......#','#.......|......#','#.......|......#','#.......|......#','#.......|......#','#.......|......#',
    '#.......|......#',
    '#.S.....|....E.#',
    '################','################','################','################'] },
  { name: '崖', hint: 'あの上へ', author: 105, map: [
    S,S,S,S,S,S,S,S,S,S,
    '..............E.',
    '..........######',
    '..........######',
    '.S........######',
    '#####.....######','#####.....######','#####.....######','#####.....######'] },
  { name: '縦穴', hint: '落ちながら', author: 0, map: [
    '################',
    '#......#########',
    '#......#########',
    '#.S....#########',
    '####.###########',
    '.......#........',
    '.......#........',
    '.......#........',
    '.......#........',
    '................',
    '................',
    '..............E.',
    '...........#####',
    '...........#####','...........#####','...........#####','...........#####','...........#####'] },
  { name: 'トゲの海', hint: 'ねらって', author: 0, map: [
    S,S,S,S,S,S,
    '################',
    '#...........|..#','#...........|..#','#...........|..#','#...........|..#',
    '#.....###...|..#',
    '#.....###...|.E#',
    '#.S^^^###^^^####',
    '################','################','################','################'] },
  { name: '檻', hint: '近道、あるかも', author: 0, map: [
    '................',
    '................',
    '..........||||||',
    '..........|....|',
    '..........|..E.|',
    '..........######',
    '................',
    '................',
    '......###.......',
    '......###.......',
    '................',
    '................',
    '###.............',
    '................',
    '....S...........',
    '#####.....######','#####.....######','#####.....######'] },
  { name: '塔', hint: '近道、あるかも', author: 0, map: [
    '################',
    '#S.....#.......#',
    '#......#.......#',
    '#......#.......#',
    '####...#.......#',
    '#......#.E.....#',
    '#......####^...#',
    '#......#...#...#',
    '#......#.......#',
    '#......#.......#',
    '#......|....####',
    '#......|.......#',
    '#......|.......#',
    '#......|.......#',
    '#......#.##....#',
    '#......#.......#',
    '#^^^^^^#^^^^^^^#',
    '################'] },
  ];

  const LEVELS = () => LEVELS_DEF.map(parse);
  return { W, H, DT, P, F, VCAP, HANG, SWAP_HOLD, REWIND, CHECK, SLIDE, OPT, parse, cell, init, step, predict, flagPath, throwVel, handPos,
    swapTarget, deadly, canPick, flyTick, capV, subMove, pSolid, pSpike, expand, toLog, fromLog, run, replay, LEVELS_DEF, LEVELS };
})();
if (typeof module !== 'undefined') module.exports = L;
</script>

<script>
/* ===== 計測（db があればそこへ、無ければ localStorage だけ） ===== */
const M = (() => {
  const KEY = 'hata.metrics.v1';
  // ゲーム固有：stagesCleared（クリアしたことのある面の数）/ deaths（倒れた回数の合計）/ bestTotalTime（7面通しの最短合計秒）
  // wantMore は終了画面のアンケート（この試作では priceAnswer の代わり。priceAnswer は null のまま）
  const DEF = () => ({ firstPlayAt: null, updatedAt: null, sessions: 0, runsStarted: 0, runsCompleted: 0, firstRunCleared: false, replayed: false, priceAnswer: null, bestScore: 0, tutorialStuck: false, stagesCleared: 0, deaths: 0, bestTotalTime: null, wantMore: null });
  let m = DEF();
  try { const raw = localStorage.getItem(KEY); if (raw) m = Object.assign(DEF(), JSON.parse(raw)); } catch (e) {}
  const ops = []; let ref = null, ready = false, gaveUp = false, inflight = false, again = false, timer = 0;
  const saveLocal = () => { try { localStorage.setItem(KEY, JSON.stringify(m)); } catch (e) {} };
  function write() {
    clearTimeout(timer); timer = 0;
    if (!ref) return;
    if (inflight) { again = true; return; }
    inflight = true;
    Promise.resolve().then(() => ref.set(Object.assign({}, m))).catch(() => {}).finally(() => { inflight = false; if (again) { again = false; write(); } });
  }
  // lazy: 倒れた回数のように続けて変わるものは、間が空いてから1回だけ書く
  function apply(op, lazy) {
    const before = JSON.stringify(m);
    op(m); if (!m.firstPlayAt) m.firstPlayAt = new Date().toISOString();
    if (JSON.stringify(m) === before) return;
    m.updatedAt = new Date().toISOString();
    saveLocal();
    if (!ready) { if (!gaveUp) ops.push(op); return; }
    if (lazy) { clearTimeout(timer); timer = setTimeout(write, 2000); } else write();
  }
  function flush() { if (timer) write(); }
  async function init() {
    try {
      const c = window.claude; if (!c || !c.use) return;
      const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
      if (!db || !user) return;
      const id = await user.id(); if (!id) return;
      const r = db.doc('plays/' + id);
      let base = null;
      try { const snap = await r.get(); base = snap.exists ? snap.data() : null; } catch (e) { return; }
      const nm = Object.assign(DEF(), base || {});
      if (!nm.firstPlayAt) nm.firstPlayAt = m.firstPlayAt || new Date().toISOString();
      ops.forEach(o => o(nm)); ops.length = 0;
      nm.updatedAt = new Date().toISOString();
      m = nm; ref = r; ready = true; saveLocal(); write();
    } catch (e) {
    } finally { if (!ready) { gaveUp = true; ops.length = 0; } }
  }
  addEventListener('pagehide', flush);
  document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });
  return { apply, init, flush, get: () => m };
})();
</script>

<script>
/* ===== 画面 ===== */
(() => {
  const $ = q => document.querySelector(q);
  const LV = L.LEVELS(), N = LV.length, W = L.W, H = L.H;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const css = getComputedStyle(document.documentElement);
  const T = n => css.getPropertyValue('--' + n).trim();
  const C = {};
  ['bg', 'bg2', 'bg3', 'rock', 'rock-dk', 'rock-edge', 'rock-dot', 'bars', 'bars-dk', 'spike', 'spike-lt', 'exit', 'exit-dk',
    'flag', 'flag2', 'pole', 'hero', 'hero-ink', 'ink', 'ink2', 'ink3', 'danger'].forEach(k => { C[k.replace(/-(\w)/g, (_, c) => c.toUpperCase())] = T(k); });

  /* ---- 進み具合（ローカルだけ） ---- */
  const PKEY = 'hata.progress.v1';
  let prog = { run: null, best: {}, cleared: [], s2at: 0, s2done: false, threw: false, bestRun: 0 };
  try { const r = localStorage.getItem(PKEY); if (r) prog = Object.assign(prog, JSON.parse(r)); } catch (e) {}
  const saveProg = () => { try { localStorage.setItem(PKEY, JSON.stringify(prog)); } catch (e) {} };

  /* ---- 計測：開いた回数・最初の画面で止まっていないか ---- */
  const firstSession = M.get().sessions === 0 && !prog.cleared.length && !prog.run;
  M.apply(m => { m.sessions++; });
  let anyInput = false, stuckTimer = 0;
  const touchedAny = () => { anyInput = true; clearTimeout(stuckTimer); };
  addEventListener('pointerdown', touchedAny, { capture: true });
  addEventListener('keydown', touchedAny, { capture: true });

  /* ---- 状態 ---- */
  let li = 0, lv = LV[0], s = null, acc = 0, last = 0, raf = 0, paused = false;
  const keys = { l: false, r: false, kl: false, kr: false };
  let jumpQ = false, swapQ = false, recallQ = false, throwQ = null, aim = null;
  let fx = {}, stageWall = 0, skipTimer = 0, cardTimer = 0;
  const cv = $('#cv'), ctx = cv.getContext('2d'), play = $('#play'), hintEl = $('#hint');
  let cell = 20, cw = 320, ch = 360, dpr = 1, bg = null;

  const screens = { title: $('#title'), game: $('#game'), end: $('#end') };
  function show(name) {
    for (const k in screens) screens[k].hidden = k !== name;
    if (name === 'game') { sizeCanvas(); loop(); }
  }

  /* ---- 通し（1面から）を始める ---- */
  function startRun() {
    prog.run = { stage: 0, times: Array(N).fill(null), skipped: false };
    saveProg();
    M.apply(m => { if (m.runsStarted >= 1) m.replayed = true; m.runsStarted++; });
    startStage(0);
  }
  function startStage(i) {
    li = i; lv = LV[i]; s = L.init(lv); acc = 0; last = 0; paused = false;
    aim = null; throwQ = null; jumpQ = swapQ = recallQ = false;
    fx = { dieAt: -9, dieX: 0, dieY: 0, respAt: -9, pickAt: -9, pingAt: -9, clearAt: -9, parts: [], swapAt: -9, swapFrom: null, swapTo: null, autoAt: -9, lostAt: -9, lostX: 0, lostY: 0 };
    $('#clearCard').hidden = true; $('#stuckCard').hidden = true; $('#skip').hidden = true;
    $('#restart').classList.remove('pulse');
    $('#sno').textContent = i + 1;
    hintEl.textContent = lv.hint; hintEl.classList.remove('off');
    if (prog.run) { prog.run.stage = i; saveProg(); }
    if (i === 1 && !prog.s2at) { prog.s2at = Date.now(); saveProg(); }
    clearTimeout(skipTimer); clearTimeout(cardTimer);
    stageWall = Date.now();
    skipTimer = setTimeout(() => { if (!s.clear) $('#skip').hidden = false; }, 120000);
    bg = null;
    show('game');
    if (i === 0 && firstSession && !anyInput && !stuckTimer) {
      stuckTimer = setTimeout(() => { if (!anyInput) M.apply(m => { m.tutorialStuck = true; }); }, 30000);
    }
  }

  /* ---- クリア ---- */
  function onClear() {
    const ticks = s.t, prev = prog.best[li];
    fx.clearAt = performance.now();
    clearTimeout(skipTimer); $('#skip').hidden = true;
    const isNew = !prev || ticks < prev;
    if (isNew) prog.best[li] = ticks;
    if (!prog.cleared.includes(li)) prog.cleared.push(li);
    let runDone = 0, total = null;
    if (prog.run) {
      prog.run.times[li] = ticks;
      runDone = prog.run.times.filter(v => v != null).length;
      if (li === N - 1 && !prog.run.skipped && prog.run.times.every(v => v != null)) total = prog.run.times.reduce((a, b) => a + b, 0) / 60;
    }
    let s2 = false;
    if (li === 1 && !prog.s2done) { prog.s2done = true; s2 = Date.now() - prog.s2at <= 90000; }
    saveProg();
    M.apply(m => {
      m.stagesCleared = Math.max(m.stagesCleared || 0, prog.cleared.length);
      m.bestScore = Math.max(m.bestScore || 0, runDone);
      if (s2) m.firstRunCleared = true;
      if (li === N - 1) m.runsCompleted++;
      if (total != null) m.bestTotalTime = m.bestTotalTime == null ? +total.toFixed(2) : Math.min(m.bestTotalTime, +total.toFixed(2));
    });
    $('#cTime').textContent = sec(ticks);
    $('#cBest').innerHTML = '';
    $('#cBest').append(sec(prog.best[li]));
    if (isNew && prev) { const n = document.createElement('span'); n.className = 'new'; n.textContent = '新記録'; $('#cBest').append(n); }
    const showAuth = li >= 5 && lv.author > 0;
    $('#cAuthL').hidden = $('#cAuth').hidden = !showAuth;
    $('#cAuth').textContent = sec(lv.author);
    $('#cTease').textContent = showAuth ? (prog.best[li] < lv.author ? '作者より速い。どこを通った？' : 'もっと速い道が、あるかも') : '';
    $('#next').textContent = li === N - 1 ? '結果へ' : '次へ';
    cardTimer = setTimeout(() => { $('#clearCard').hidden = false; $('#next').focus({ preventScroll: true }); }, reduced ? 150 : 650);
  }
  const sec = t => (t / 60).toFixed(1) + '秒';
  function next() {
    if (li === N - 1) { showEnd(); return; }
    startStage(li + 1);
  }

  /* ---- 1 tick ---- */
  function tick() {
    const inp = { l: keys.l || keys.kl, r: keys.r || keys.kr, jump: jumpQ, swap: swapQ, recall: recallQ, throw: throwQ, aim: !!(aim && aim.live) };
    jumpQ = swapQ = recallQ = false; throwQ = null;
    const prevF = s.f;
    s = L.step(lv, s, inp);
    for (const e of s.ev) onEvent(e, prevF);
    if (aim && s.rew) aim = null;
  }
  function onEvent(e, prevF) {
    const now = performance.now();
    if (e === 'swap') {
      fx.swapAt = now; fx.swapFrom = { x: s.swapFrom.x, y: s.swapFrom.y }; fx.swapTo = { x: s.p.x, y: s.p.y };
      if (navigator.vibrate) try { navigator.vibrate(10); } catch (err) {}
    }
    if (e === 'edge' || e === 'lost') { fx.lostAt = now; fx.lostX = s.f.x; fx.lostY = Math.min(s.f.y, H - .3); }
    if (e === 'fail') {
      M.apply(m => { m.deaths = (m.deaths || 0) + 1; }, true);
      fx.dieAt = now; fx.dieX = s.p.x; fx.dieY = s.p.y;
      if (!reduced) for (let i = 0; i < 9; i++) { const a = i / 9 * Math.PI * 2 + .3; fx.parts.push({ x: s.p.x, y: s.p.y - .45, vx: Math.cos(a) * 3, vy: Math.sin(a) * 3 - 2, t0: now }); }
      if (navigator.vibrate) try { navigator.vibrate(20); } catch (err) {}
    }
    if (e === 'autoswap') fx.autoAt = now;
    if (e === 'rewound') fx.respAt = now;
    if (e === 'pick') fx.pickAt = now;
    if (e === 'throw') { if (!prog.threw) { prog.threw = true; saveProg(); } hintEl.classList.add('off'); }
    if (e === 'clear') onClear();
  }

  /* ---- ループ（固定ステップ。狙っている間はゆっくり） ---- */
  function loop() { if (!raf) raf = requestAnimationFrame(frame); }
  function frame(now) {
    raf = 0;
    if (screens.game.hidden) return;
    const dt = last ? Math.min(0.1, (now - last) / 1000) : 0; last = now;
    if (!paused && s && !s.clear) {
      acc += dt * (aim && aim.live ? 0.25 : 1);
      let n = 0;
      while (acc >= L.DT && n < 8) { tick(); acc -= L.DT; n++; if (s.clear) break; }
      if (n >= 8) acc = 0;
    }
    draw(now);
    const c = $('#clock'); const txt = (s.t / 60).toFixed(1);
    if (c.firstChild.nodeValue !== txt) c.firstChild.nodeValue = txt;
    raf = requestAnimationFrame(frame);
  }

  /* ---- 大きさ ---- */
  function sizeCanvas() {
    const r = play.getBoundingClientRect(), hh = hintEl.offsetHeight;
    if (!r.width || !r.height) return;
    cell = Math.max(8, Math.min(r.width / W, (r.height - hh) / H));
    cw = cell * W; ch = cell * H;
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
    cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    bg = null;
  }
  addEventListener('resize', () => { if (!screens.game.hidden) sizeCanvas(); });

  /* ---- 描画 ---- */
  const X = x => x * cell, Y = y => y * cell;
  const hash = (x, y) => { let h = x * 374761393 + y * 668265263; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };

  function buildBg() {
    bg = document.createElement('canvas');
    bg.width = cv.width; bg.height = cv.height;
    const g = bg.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const gr = g.createLinearGradient(0, 0, 0, ch); gr.addColorStop(0, C.bg2); gr.addColorStop(1, C.bg);
    g.fillStyle = gr; g.fillRect(0, 0, cw, ch);
    // うすい格子の点
    g.fillStyle = C.bg3;
    for (let y = 1; y < H; y++) for (let x = 1; x < W; x++) g.fillRect(X(x) - 1, Y(y) - 1, 2, 2);
    // 穴（画面の下が空いている列）
    for (let x = 0; x < W; x++) if (L.cell(lv, x, H - 1) === '.') {
      const hg = g.createLinearGradient(0, Y(H - 2), 0, ch); hg.addColorStop(0, 'rgba(0,0,0,0)'); hg.addColorStop(1, 'rgba(0,0,0,.75)');
      g.fillStyle = hg; g.fillRect(X(x), Y(H - 2), cell + .5, cell * 2);
    }
    const lw = Math.max(2, cell * .12);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const c = lv.grid[y][x];
      if (c === '#') {
        g.fillStyle = C.rock; g.fillRect(X(x), Y(y), cell + .6, cell + .6);
        g.fillStyle = C.rockDot;
        const h1 = hash(x, y), h2 = hash(y + 7, x + 3);
        g.fillRect(X(x + .15 + h1 * .6), Y(y + .2 + h2 * .6), cell * .12, cell * .08);
        if (h1 > .5) g.fillRect(X(x + .1 + h2 * .7), Y(y + .1 + h1 * .5), cell * .08, cell * .08);
      }
    }
    // 縁：上に見えている面は明るく、横と下は暗く
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      if (lv.grid[y][x] !== '#') continue;
      const open = (dx, dy) => { const c = L.cell(lv, x + dx, y + dy); return c !== '#' && !(y + dy < 0); };
      if (open(0, -1)) { g.fillStyle = C.rockEdge; g.fillRect(X(x), Y(y), cell + .6, lw); }
      g.fillStyle = C.rockDk;
      if (open(0, 1) && y + 1 < H) g.fillRect(X(x), Y(y + 1) - lw * .7, cell + .6, lw * .7);
      if (open(-1, 0) && x > 0) g.fillRect(X(x), Y(y), lw * .6, cell + .6);
      if (open(1, 0) && x < W - 1) g.fillRect(X(x + 1) - lw * .6, Y(y), lw * .6, cell + .6);
    }
    // 鉄格子
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      if (lv.grid[y][x] !== '|') continue;
      const rw = Math.max(2, cell * .11);
      for (const k of [.22, .5, .78]) {
        g.fillStyle = C.barsDk; g.fillRect(X(x + k) - rw / 2, Y(y), rw, cell + .6);
        g.fillStyle = C.bars; g.fillRect(X(x + k) - rw / 2, Y(y), rw * .45, cell + .6);
      }
      g.fillStyle = C.bars;
      if (L.cell(lv, x, y - 1) !== '|') g.fillRect(X(x), Y(y), cell + .6, rw);
      if (L.cell(lv, x, y + 1) !== '|') g.fillRect(X(x), Y(y + 1) - rw, cell + .6, rw);
      if (L.cell(lv, x - 1, y) !== '|' && L.cell(lv, x, y - 1) === '|' && L.cell(lv, x, y + 1) !== '|') {}
    }
    // トゲ
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      if (lv.grid[y][x] !== '^') continue;
      for (let k = 0; k < 3; k++) {
        const x0 = X(x + k / 3), x1 = X(x + (k + 1) / 3), xm = (x0 + x1) / 2;
        g.fillStyle = C.spike; g.beginPath(); g.moveTo(x0, Y(y + 1)); g.lineTo(xm, Y(y + .45)); g.lineTo(x1, Y(y + 1)); g.closePath(); g.fill();
        g.fillStyle = C.spikeLt; g.beginPath(); g.moveTo(xm - cell * .05, Y(y + .62)); g.lineTo(xm, Y(y + .45)); g.lineTo(xm + cell * .02, Y(y + .62)); g.closePath(); g.fill();
      }
    }
  }

  function draw(now) {
    const t = now / 1000;
    if (!bg) buildBg();
    ctx.clearRect(0, 0, cw, ch);
    ctx.drawImage(bg, 0, 0, cw, ch);
    drawExit(t);
    drawCheckpoint(t);
    if (!s.hold && !s.rew) { drawWorldFlag(t); drawSwapTarget(t); }
    drawHero(t, now);
    drawFx(now);
    if (aim && aim.live) drawAim(t);
    else if (li === 0 && !prog.threw && s.hold && !s.rew) drawTutorial(t);
    if (now - fx.pingAt < 900 && !s.hold) drawPing(now);
    drawCharge();
    const sk = document.querySelector('.key.swap');
    if (sk) sk.classList.toggle('off', !L.swapTarget(lv, s).ok);
  }

  function drawExit(t) {
    const e = lv.exit, x = X(e.x + .12), y = Y(e.y - 1 + .1), w = cell * .76, h = cell * 1.9;
    const a = reduced ? .5 : .4 + .2 * Math.sin(t * 2.4);
    ctx.save();
    ctx.shadowColor = C.exit; ctx.shadowBlur = cell * .8 * a;
    ctx.fillStyle = C.exitDk; ctx.fillRect(x, y, w, h);
    const g = ctx.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, 'rgba(124,240,196,.05)'); g.addColorStop(1, 'rgba(124,240,196,' + (.35 + a * .4) + ')');
    ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
    ctx.shadowBlur = 0;
    ctx.strokeStyle = C.exit; ctx.lineWidth = Math.max(2, cell * .1); ctx.strokeRect(x, y, w, h);
    ctx.restore();
  }

  // 旗：根元 (bx,by)px、竿の向き ang。opt: {alpha, flip, glow, ghost, color}
  function drawFlag(bx, by, ang, t, opt = {}) {
    const len = cell * 1.05, ux = Math.cos(ang), uy = Math.sin(ang);
    let nx = -uy, ny = ux; if (opt.flip) { nx = -nx; ny = -ny; }
    const tx = bx + ux * len, ty = by + uy * len;
    const wv = reduced ? 0 : Math.sin(t * (opt.fast ? 9 : 5) + bx * .05) * cell * (opt.fast ? .14 : .08);
    const cw_ = cell * .72, chh = cell * .46;
    const p2x = tx + nx * cw_ + ux * wv * .3, p2y = ty + ny * cw_ + uy * wv * .3 + wv;
    const p3x = tx - ux * chh + nx * cw_ * .92, p3y = ty - uy * chh + ny * cw_ * .92 + wv * .6;
    const p4x = tx - ux * chh, p4y = ty - uy * chh;
    ctx.save(); ctx.globalAlpha = opt.alpha == null ? 1 : opt.alpha;
    if (opt.glow) {
      const cx = (tx + p3x) / 2, cy = (ty + p3y) / 2, rr = cell * (1.1 + (reduced ? 0 : .18 * Math.sin(t * 4)));
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, rr * (opt.glow > 1 ? 1.5 : 1));
      g.addColorStop(0, 'rgba(255,210,63,' + (.45 * opt.glow) + ')'); g.addColorStop(1, 'rgba(255,210,63,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, rr * (opt.glow > 1 ? 1.5 : 1), 0, 7); ctx.fill();
    }
    if (opt.ghost) ctx.setLineDash([cell * .14, cell * .12]);
    ctx.strokeStyle = opt.ghost ? C.flag : C.pole; ctx.lineWidth = Math.max(2, cell * .1); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(tx, ty); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(p2x, p2y); ctx.lineTo(p3x, p3y); ctx.lineTo(p4x, p4y); ctx.closePath();
    if (opt.ghost) { ctx.lineWidth = Math.max(1.5, cell * .07); ctx.stroke(); }
    else {
      ctx.fillStyle = opt.color || C.flag; ctx.fill();
      ctx.fillStyle = C.flag2; ctx.beginPath();
      ctx.moveTo(p4x, p4y); ctx.lineTo((tx + p4x) / 2 + nx * cw_ * .5 + wv * .3, (ty + p4y) / 2 + ny * cw_ * .5 + wv * .8); ctx.lineTo(p3x, p3y); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  // 旗が止まっている／飛んでいる
  function drawWorldFlag(t) {
    const f = s.f;
    if (f.mode === 'fly') { drawFlag(X(f.x), Y(f.y), Math.atan2(-f.vy, -f.vx), t, { glow: 1, fast: true }); return; }
    const bx = X(f.x), by = Y(f.y);
    if (f.kind === 'air') {
      // 浮いている：根元に光の輪
      ctx.save(); ctx.strokeStyle = C.flag; ctx.globalAlpha = .7; ctx.lineWidth = 1.5;
      const r = cell * (.42 + (reduced ? 0 : .06 * Math.sin(t * 5)));
      ctx.beginPath(); ctx.ellipse(bx, by, r, r * .35, 0, 0, 7); ctx.stroke(); ctx.restore();
    } else {
      ctx.save(); ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(bx, by, cell * .22, cell * .1, 0, 0, 7); ctx.fill(); ctx.restore();
    }
    drawFlag(bx, by, f.ang, t, { glow: f.kind === 'spike' ? 0 : 1, color: f.kind === 'spike' ? C.danger : null });
  }

  // 復帰点：地形の上に6フレーム以上立った地点（失敗したらここへ巻き戻す）
  function drawCheckpoint(t) {
    const c = s.cp, bx = X(c.x), by = Y(c.y);
    if (!s.rew && Math.hypot(c.x - s.p.x, c.y - s.p.y) < 1.2) return;
    ctx.save(); ctx.strokeStyle = C.ink3; ctx.globalAlpha = .8; ctx.lineWidth = 1.5; ctx.setLineDash([2, 3]);
    ctx.beginPath(); ctx.ellipse(bx, by, cell * .36, cell * .13, 0, 0, 7); ctx.stroke(); ctx.restore();
  }
  // 入れ替え先の輪郭（緑＝交換できる、赤＝できない）。飛行中なら予測線の残りも
  function drawSwapTarget(t) {
    const tg = L.swapTarget(lv, s);
    if (tg.x == null) return;
    const w = cell * L.P.w, h = cell * L.P.h, x = X(tg.x) - w / 2, y = Y(tg.y) - h;
    if (s.f.mode === 'fly' && tg.ok) {
      const pr = L.flagPath(lv, s.f);
      ctx.save(); ctx.fillStyle = C.ink2;
      for (let i = 3; i < pr.pts.length; i += 3) { ctx.globalAlpha = .5 * (1 - i / pr.pts.length); ctx.beginPath(); ctx.arc(X(pr.pts[i][0]), Y(pr.pts[i][1] + L.P.h - L.F.hand), Math.max(1.4, cell * .06), 0, 7); ctx.fill(); }
      ctx.restore();
    }
    // 空中で入れ替えられる間は、ゆっくり点滅（「落ちても、ここへ戻る」の合図。自動入れ替えの予告）
    const warn = tg.ok && !s.p.ground && !L.deadly(lv, tg) && L.OPT.autoSwap && !reduced; // 救済の適格条件と同じ（画面下の外へ落ちる旗では点滅しない）
    ctx.save(); ctx.lineWidth = 2; ctx.setLineDash(tg.ok ? [] : [4, 3]);
    ctx.strokeStyle = tg.ok ? C.exit : C.danger; ctx.globalAlpha = tg.ok ? (warn ? .55 + .3 * Math.cos(t * Math.PI * 2 / 1.2) : .85) : .7;
    rr(x, y, w, h - cell * .08, cell * .16); ctx.stroke();
    if (!tg.ok) { ctx.beginPath(); ctx.moveTo(x + w * .2, y + h * .25); ctx.lineTo(x + w * .8, y + h * .75); ctx.moveTo(x + w * .8, y + h * .25); ctx.lineTo(x + w * .2, y + h * .75); ctx.stroke(); }
    ctx.restore();
  }
  // 空中チャージ（頭の上の小さな菱形。空なら輪郭だけ）
  function drawCharge() {
    if (s.rew) return;
    const x = X(s.p.x), y = Y(s.p.y - L.P.h) - cell * .38, r = cell * .14;
    ctx.save(); ctx.beginPath(); ctx.moveTo(x, y - r); ctx.lineTo(x + r, y); ctx.lineTo(x, y + r); ctx.lineTo(x - r, y); ctx.closePath();
    ctx.lineWidth = 1.5; ctx.strokeStyle = C.flag;
    if (s.charge > 0) { ctx.fillStyle = C.flag; ctx.fill(); } else { ctx.globalAlpha = .6; }
    ctx.stroke(); ctx.restore();
  }

  function drawHero(t, now) {
    const p = s.p, w = cell * L.P.w, h = cell * L.P.h;
    const x = X(p.x), y = Y(p.y);
    ctx.save();
    ctx.lineWidth = Math.max(1.5, cell * .07); ctx.strokeStyle = C.heroInk; ctx.fillStyle = C.hero;
    if (s.rew) {
      // 巻き戻し：失敗した場所から復帰点へすべるように戻る
      const k = 1 - s.rew / L.REWIND, e = k * k * (3 - 2 * k), f0 = s.rewFrom || p;
      const hx = X(f0.x + (s.cp.x - f0.x) * e), hy = Y(Math.min(f0.y, H + .5) + (s.cp.y - Math.min(f0.y, H + .5)) * e);
      ctx.globalAlpha = .35 + .5 * k;
      rr(hx - w / 2, hy - h, w, h - cell * .08, cell * .16); ctx.fill(); ctx.stroke();
      ctx.restore();
      return;
    }
    const moving = (keys.l || keys.r || keys.kl || keys.kr) && p.ground && !reduced;
    const bob = moving ? Math.abs(Math.sin(t * 14)) * cell * .05 : 0;
    // 足
    ctx.fillStyle = C.heroInk;
    const st = moving ? Math.sin(t * 14) * cell * .08 : 0;
    ctx.fillRect(x - w * .3 + st, y - cell * .12, w * .22, cell * .12);
    ctx.fillRect(x + w * .08 - st, y - cell * .12, w * .22, cell * .12);
    // 体
    ctx.fillStyle = C.hero;
    rr(x - w / 2, y - h - bob, w, h - cell * .08, cell * .16); ctx.fill(); ctx.stroke();
    // 目
    ctx.fillStyle = C.heroInk;
    const ey = y - h * .68 - bob, eo = p.face * cell * .08;
    for (const ex of [-.1, .1]) { ctx.beginPath(); ctx.arc(x + ex * cell + eo, ey, cell * .045 + .6, 0, 7); ctx.fill(); }
    ctx.restore();
    // 持っている旗（背中に背負う）
    if (s.hold) {
      const bx = x - p.face * cell * .2, by = y - cell * .2 - bob;
      drawFlag(bx, by, -Math.PI / 2 - p.face * .28, t, { flip: p.face > 0, glow: li === 0 && !prog.threw ? 2 : .8, fast: li === 0 && !prog.threw });
    }
  }
  function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  function drawFx(now) {
    // 倒れたときのかけら
    fx.parts = fx.parts.filter(q => now - q.t0 < 600);
    ctx.save(); ctx.fillStyle = C.hero;
    for (const q of fx.parts) {
      const k = (now - q.t0) / 1000;
      ctx.globalAlpha = 1 - k / .6;
      ctx.fillRect(X(q.x + q.vx * k) - 2, Y(q.y + q.vy * k + 6 * k * k) - 2, 4, 4);
    }
    ctx.restore();
    // 入れ替え：元の位置の残像と、2点を結ぶ光の筋（地形を貫く）
    if (fx.swapFrom) {
      const k = (now - fx.swapAt) / 420;
      if (k >= 0 && k < 1) {
        const a = fx.swapFrom, b = fx.swapTo, w = cell * L.P.w, h = cell * L.P.h;
        ctx.save(); ctx.globalAlpha = (1 - k) * .55; ctx.strokeStyle = C.hero; ctx.lineWidth = 1.5; ctx.setLineDash([3, 3]);
        rr(X(a.x) - w / 2, Y(a.y) - h, w, h - cell * .08, cell * .16); ctx.stroke(); ctx.setLineDash([]);
        ctx.globalAlpha = (1 - k) * .8; ctx.strokeStyle = C.flag; ctx.lineWidth = Math.max(2, cell * .14) * (1 - k);
        ctx.beginPath(); ctx.moveTo(X(a.x), Y(a.y - .45)); ctx.lineTo(X(b.x), Y(b.y - .45)); ctx.stroke(); ctx.restore();
      }
    }
    // 旗が端を越えた・落ちた：その場所に×（旗は手に戻る）
    { const k = (now - fx.lostAt) / 700;
      if (k >= 0 && k < 1) { const x = Math.max(.3, Math.min(W - .3, fx.lostX)), y = Math.max(.3, fx.lostY), d = cell * .28;
        ctx.save(); ctx.globalAlpha = 1 - k; ctx.strokeStyle = C.danger; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(X(x) - d, Y(y) - d); ctx.lineTo(X(x) + d, Y(y) + d); ctx.moveTo(X(x) + d, Y(y) - d); ctx.lineTo(X(x) - d, Y(y) + d); ctx.stroke(); ctx.restore(); } }
    // 自動入れ替え：着いた自分の周りに一瞬だけ輪（約8フレーム）
    { const k = (now - fx.autoAt) / 135;
      if (k >= 0 && k < 1) {
        ctx.save(); ctx.strokeStyle = C.exit; ctx.globalAlpha = 1 - k * .7; ctx.lineWidth = Math.max(2, cell * .12);
        ctx.beginPath(); ctx.arc(X(s.p.x), Y(s.p.y - .45), cell * (.55 + k * .5), 0, 7); ctx.stroke(); ctx.restore();
      } }
    // 復帰した・拾った：輪
    for (const [t0, col, big] of [[fx.respAt, C.flag, 1.6], [fx.pickAt, C.flag, 1]]) {
      const k = (now - t0) / 450; if (k < 0 || k > 1) continue;
      ctx.save(); ctx.strokeStyle = col; ctx.globalAlpha = 1 - k; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(X(s.p.x), Y(s.p.y - .45), cell * (.4 + k * big), 0, 7); ctx.stroke(); ctx.restore();
    }
    // クリア
    if (s.clear) {
      const e = lv.exit;
      for (const d of [0, 180]) {
        const k = Math.min(1, Math.max(0, (now - fx.clearAt - d) / 700)); if (!k || k >= 1) continue;
        ctx.save(); ctx.globalAlpha = 1 - k; ctx.strokeStyle = C.exit; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(X(e.x + .5), Y(e.y), cell * (.8 + k * 3), 0, 7); ctx.stroke(); ctx.restore();
      }
    }
  }

  // 旗が手元にないときに引っぱろうとした：旗の場所を指す
  function drawPing(now) {
    const k = (now - fx.pingAt) / 900, f = s.f;
    const fx_ = X(f.x), fy = Y(f.y - .5);
    ctx.save(); ctx.strokeStyle = C.flag; ctx.globalAlpha = 1 - k; ctx.lineWidth = 2;
    ctx.setLineDash([4, 5]);
    ctx.beginPath(); ctx.moveTo(X(s.p.x), Y(s.p.y - .5)); ctx.lineTo(fx_, fy); ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath(); ctx.arc(fx_, fy, cell * (.6 + k * 1.2), 0, 7); ctx.stroke();
    ctx.restore();
  }

  /* ---- 狙い ---- */
  const maxDrag = () => Math.max(90, Math.min(160, cell * 5));
  function aimVel(a) {
    const dx = a.x0 - a.x, dy = a.y0 - a.y, len = Math.hypot(dx, dy);
    if (len < 12) return null;
    const pw = Math.min(len / maxDrag(), 1), v = L.F.vmax * pw;
    return { vx: dx / len * v, vy: dy / len * v, pw };
  }
  function drawPath(v, alpha, t) {
    const pr = L.predict(lv, s.p, v.vx, v.vy, s.a), pts = pr.pts, end = pr.end;
    ctx.save(); ctx.globalAlpha = alpha;
    ctx.fillStyle = C.flag;
    for (let i = 2; i < pts.length; i += 2) {
      const k = i / pts.length;
      ctx.globalAlpha = alpha * (.9 - k * .45);
      ctx.beginPath(); ctx.arc(X(pts[i][0]), Y(pts[i][1]), Math.max(1.6, cell * .075), 0, 7); ctx.fill();
    }
    ctx.globalAlpha = alpha;
    const ex = X(end.x), ey = Y(Math.min(end.y, H - .15));
    if (end.kind === 'spike' || end.kind === 'lost' || end.kind === 'edge') {
      ctx.strokeStyle = C.danger; ctx.lineWidth = 3; const d = cell * .3;
      ctx.beginPath(); ctx.moveTo(ex - d, ey - d); ctx.lineTo(ex + d, ey + d); ctx.moveTo(ex + d, ey - d); ctx.lineTo(ex - d, ey + d); ctx.stroke();
    } else if (end.kind === 'air') {
      ctx.strokeStyle = C.flag; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(ex, ey, cell * .42, cell * .15, 0, 0, 7); ctx.stroke();
      drawFlag(ex, ey, -Math.PI / 2, t, { ghost: true, alpha: .9 });
    } else {
      drawFlag(ex, ey, end.ang, t, { ghost: true, alpha: .9 });
    }
    ctx.restore();
  }
  function drawAim(t) {
    const v = aimVel(aim), r = cv.getBoundingClientRect();
    const h = L.handPos(s.p), hx = X(h.x), hy = Y(h.y);
    const ox = aim.x - aim.x0, oy = aim.y - aim.y0, len = Math.hypot(ox, oy), lim = maxDrag();
    const k = len > lim ? lim / len : 1;
    ctx.save();
    ctx.strokeStyle = C.ink2; ctx.lineWidth = 2; ctx.setLineDash([3, 4]);
    ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx + ox * k, hy + oy * k); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = C.ink; ctx.globalAlpha = .8;
    ctx.beginPath(); ctx.arc(hx + ox * k, hy + oy * k, Math.max(5, cell * .22), 0, 7); ctx.fill();
    ctx.restore();
    void r;
    if (v) drawPath(v, 1, t);
    // ゆっくり中のしるし
    ctx.save(); ctx.strokeStyle = 'rgba(255,210,63,.25)'; ctx.lineWidth = 4; ctx.strokeRect(2, 2, cw - 4, ch - 4); ctx.restore();
  }

  // 1面：指が主人公から引っぱるお手本
  const DEMO = { vx: 9.19, vy: -7.71 };
  function drawTutorial(t) {
    const per = 2.6, a = reduced ? .7 : (t % per) / per;
    const h = L.handPos(s.p), hx = X(h.x), hy = Y(h.y);
    const m = Math.hypot(DEMO.vx, DEMO.vy), dist = m / L.F.vmax * maxDrag();
    const tx = -DEMO.vx / m * dist, ty = -DEMO.vy / m * dist;
    let k, alpha;
    if (a < .12) { k = 0; alpha = a / .12; }
    else if (a < .55) { k = (a - .12) / .43; k = k * k * (3 - 2 * k); alpha = 1; }
    else if (a < .85) { k = 1; alpha = 1; }
    else { k = 1; alpha = 1 - (a - .85) / .15; }
    if (k > .3) drawPath({ vx: DEMO.vx * k, vy: DEMO.vy * k }, alpha * (k - .3) / .7 * .8, t);
    const fx_ = hx + tx * k, fy = hy + ty * k;
    ctx.save(); ctx.globalAlpha = alpha;
    // ひも
    ctx.strokeStyle = C.ink2; ctx.lineWidth = 2; ctx.setLineDash([3, 4]);
    ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(fx_, fy); ctx.stroke(); ctx.setLineDash([]);
    // 指（丸い指先と手の甲）
    const r = Math.max(11, cell * .52);
    ctx.fillStyle = C.ink; ctx.strokeStyle = C.heroInk; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(fx_ + r * .55, fy + r * 1.5, r * .9, r * 1.1, -.35, 0, 7); ctx.fill(); ctx.stroke();
    rr(fx_ - r * .45, fy - r * .5, r * .9, r * 2.0, r * .45); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(fx_, fy - r * .1, r * .35, 0, 7); ctx.strokeStyle = 'rgba(11,18,16,.35)'; ctx.stroke();
    if (k === 0) { ctx.strokeStyle = C.flag; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(hx, hy, r * (1 + a * 4), 0, 7); ctx.stroke(); }
    ctx.restore();
  }

  /* ---- 引っぱって投げる（キャンバスの外の空白からでもよい） ---- */
  play.addEventListener('pointerdown', e => {
    if (e.target.closest('button') || e.target.closest('.card')) return;
    if (!s || s.clear || s.rew || screens.game.hidden) return;
    e.preventDefault();
    // 旗が出ている間：12px 以上引いたら旗を手に戻して照準へ（それまでは旗は出たまま）
    aim = { id: e.pointerId, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, live: s.hold };
    if (!s.hold) fx.pingAt = performance.now();
    try { play.setPointerCapture(e.pointerId); } catch (err) {}
  });
  play.addEventListener('pointermove', e => {
    if (!aim || e.pointerId !== aim.id) return;
    e.preventDefault(); aim.x = e.clientX; aim.y = e.clientY;
    if (!aim.live && Math.hypot(aim.x - aim.x0, aim.y - aim.y0) >= 12) { aim.live = true; if (!s.hold) recallQ = true; }
  });
  play.addEventListener('pointerup', e => {
    if (!aim || e.pointerId !== aim.id) return;
    aim.x = e.clientX; aim.y = e.clientY;
    const v = aim.live ? aimVel(aim) : null; aim = null;
    if (v && !s.rew) throwQ = { vx: v.vx, vy: v.vy };
  });
  play.addEventListener('pointercancel', e => { if (aim && e.pointerId === aim.id) aim = null; });
  play.addEventListener('contextmenu', e => e.preventDefault());

  /* ---- ボタン ---- */
  document.querySelectorAll('.key').forEach(b => {
    const k = b.dataset.k;
    const on = e => {
      e.preventDefault();
      try { b.setPointerCapture(e.pointerId); } catch (err) {}
      b.classList.add('on');
      if (k === 'l' || k === 'r') keys[k] = true;
      if (k === 'jump') jumpQ = true;
      if (k === 'swap') { swapQ = true; aim = null; }
    };
    const off = () => { b.classList.remove('on'); if (k === 'l' || k === 'r') keys[k] = false; };
    b.addEventListener('pointerdown', on);
    b.addEventListener('pointerup', off);
    b.addEventListener('pointercancel', off);
    b.addEventListener('lostpointercapture', off);
    b.addEventListener('contextmenu', e => e.preventDefault());
    b.addEventListener('click', e => e.preventDefault());
  });
  addEventListener('blur', () => { keys.l = keys.r = keys.kl = keys.kr = false; aim = null; });
  addEventListener('keydown', e => {
    if (screens.game.hidden) return;
    const c = e.code;
    if (c === 'ArrowLeft' || c === 'KeyA') keys.kl = true;
    else if (c === 'ArrowRight' || c === 'KeyD') keys.kr = true;
    else if ((c === 'ArrowUp' || c === 'KeyW' || c === 'Space') && !e.repeat) jumpQ = true;
    else if ((c === 'ArrowDown' || c === 'KeyS' || c === 'KeyX' || c === 'ShiftLeft' || c === 'ShiftRight') && !e.repeat) { swapQ = true; aim = null; }
    else if (c === 'KeyR' && !e.repeat) startStage(li);
    else return;
    e.preventDefault();
  });
  addEventListener('keyup', e => {
    const c = e.code;
    if (c === 'ArrowLeft' || c === 'KeyA') keys.kl = false;
    if (c === 'ArrowRight' || c === 'KeyD') keys.kr = false;
  });
  $('#restart').addEventListener('click', () => startStage(li));
  $('#stuckRestart').addEventListener('click', () => startStage(li));
  $('#next').addEventListener('click', next);
  $('#skip').addEventListener('click', () => { if (prog.run) { prog.run.skipped = true; saveProg(); } next(); });
  $('#quit').addEventListener('click', showEnd);

  /* ---- タイトル（2回目以降） ---- */
  function showTitle() {
    const r = prog.run;
    $('#titleSub').textContent = '旗を投げて、入れ替わる。';
    if (r) {
      $('#tContinue').textContent = `つづきから（${r.stage + 1}面）`;
      $('#tNew').hidden = false;
    } else { $('#tContinue').textContent = 'はじめる'; $('#tNew').hidden = true; }
    show('title');
  }
  $('#tContinue').addEventListener('click', () => { const r = prog.run; if (r) startStage(r.stage); else startRun(); });
  $('#tNew').addEventListener('click', startRun);

  /* ---- 終了画面 ---- */
  const WANT = ['もっと遊びたい', '少し遊びたい', 'もういい'];
  function showEnd() {
    clearTimeout(skipTimer); clearTimeout(cardTimer);
    const r = prog.run || { times: Array(N).fill(null) };
    const done = r.times.filter(v => v != null), total = done.reduce((a, b) => a + b, 0) / 60;
    $('#endTitle').textContent = done.length >= N ? '全7面 クリア' : 'おつかれさま';
    $('#eN').textContent = done.length;
    $('#eT').textContent = done.length ? total.toFixed(1) + '秒' : '-';
    const ul = $('#eRows'); ul.innerHTML = '';
    r.times.forEach((v, i) => {
      const el = document.createElement('li'); if (v != null) el.className = 'ok';
      el.textContent = i + 1;
      const sm = document.createElement('i'); sm.textContent = v != null ? (v / 60).toFixed(1) : '-';
      el.appendChild(sm); ul.appendChild(el);
    });
    const bt = M.get().bestTotalTime;
    $('#eBest').textContent = bt != null ? `7面通しのベスト ${bt.toFixed(1)}秒` : '';
    prog.run = null; saveProg();
    renderOpts(); $('#thanks').textContent = '';
    show('end');
    M.flush();
  }
  function renderOpts() {
    const box = $('#opts'), cur = M.get().wantMore; box.innerHTML = '';
    WANT.forEach(v => {
      const el = document.createElement('button'); el.type = 'button'; el.className = 'opt'; el.textContent = v;
      el.setAttribute('aria-pressed', String(cur === v));
      el.addEventListener('click', () => { M.apply(m => { m.wantMore = v; }); renderOpts(); $('#thanks').textContent = 'ありがとう。参考にします'; });
      box.appendChild(el);
    });
  }
  $('#again').addEventListener('click', startRun);

  /* ---- はじまり：初めてなら説明なしで1面へ、2回目以降はタイトル ---- */
  if (firstSession) startRun(); else showTitle();
  M.init();

  // テスト用の窓口（ページ内の操作には使わない）
  window.__hata = { state: () => s, li: () => li, startStage, metrics: () => M.get(), prog: () => prog,
    throwNow(vx, vy) { throwQ = { vx, vy }; }, forceClear() { if (!s.clear) { s = Object.assign({}, s, { clear: true, t: lv.author }); onClear(); } }, swap() { swapQ = true; }, setKeys(l, r) { keys.l = l; keys.r = r; }, jump() { jumpQ = true; } };
})();
</script>
</body></html>
