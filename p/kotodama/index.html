<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.5 system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body><title>Solin Nen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Dela+Gothic+One&family=Yomogi&family=Shippori+Mincho:wght@500&display=swap');
/* 単一テーマ：2Dアニメ（ADV）風。温かい昼の色（橙・木・緑）と、夜や反転後の冷たい青紫の対比 */
:root{
  color-scheme: dark;
  --bg:#1b1628; --bg2:#251d33; --line:#4a3f5e;
  --ink:#fff7ea; --ink2:#e2d4bf; --ink3:#a597b4;
  --gold:#ffcf6e; --glow:#ffe08a; --rose:#ff94a8; --violet:#8a7bf0; --danger:#ff7a8e; --cold:#9fb2ff;
  --win:rgba(22,20,46,.88); --winLine:#e8c47a;
  --paper:#f7eedb; --paperLine:#e6d6b6; --inkP:#3b2a2a; --inkP2:#86705c; --redLine:#e2958a;
  --desk1:#3b2b30; --desk2:#2a1f27;
  --card:#f6ead0; --card2:#e8d6b0;
  --skin:#ffe8d8; --skinS:#f4bda6;
  --sans:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif;
  --logo:'Dela Gothic One','Hiragino Sans','Noto Sans JP',sans-serif;
  --hand:'Yomogi','Zen Maru Gothic','Hiragino Maru Gothic ProN',sans-serif;
  --mincho:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px dashed var(--gold);outline-offset:2px}
/* 画面とパネルは重ねて置くので、左右の余白は各画面（＝外側のラッパー）に1回だけ */
.wrap{height:100%;max-width:520px;margin:0 auto;position:relative;overflow:hidden}
.screen,.sheet{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
.inner{position:relative;height:100%;display:flex;flex-direction:column;min-height:0}

/* ===== 架空文字：下地の太い線＋上の細い線（看板の文字のような筆致） ===== */
.gl{fill:none;stroke-linecap:round;stroke-linejoin:round;overflow:visible;display:block}
.gl .gu path{stroke:rgba(30,16,30,.55);stroke-width:4.6}
.gl .gt path{stroke:currentColor;stroke-width:2.1}
.gl .gu .dt{stroke-width:6.8}.gl .gt .dt{stroke-width:3.8}
.sg{fill:none;stroke-linecap:round;stroke-linejoin:round}
.sg .gu path{stroke:rgba(40,20,20,.55);stroke-width:4.4}
.sg .gt path{stroke:#ffeec2;stroke-width:2.2}
.sg .gu .dt{stroke-width:6.6}.sg .gt .dt{stroke-width:3.8}
.sg.ink .gu path{stroke:rgba(255,250,235,.0)}
.sg.ink .gt path{stroke:#3b2a2a;stroke-width:2.5}
.sg.lit .gu path{stroke:rgba(255,205,110,.5);stroke-width:7}
.sg.lit .gt path{stroke:#fffbe8}
.lbl{font:700 8.5px var(--sans);fill:#fff;stroke:#2a1a20;stroke-width:2.4px;paint-order:stroke;text-anchor:middle}
/* 文の並び（会話ウィンドウ・ログ・手帳） */
.ln{display:inline-flex;align-items:flex-end;gap:4px;flex-wrap:wrap;color:#ffe9b8}
.ln .w{display:flex;flex-direction:column;align-items:center;min-width:22px}
.ln .w i{font-style:normal;font-size:10px;color:var(--ink2);line-height:1.2;min-height:12px;white-space:nowrap}
.ln .w .kn{font-size:9px;color:var(--ink3);min-height:11px;letter-spacing:-.02em}
.ln .w.pt .gl{margin-top:2px}
/* 字をタップして手帳に書きとめる（会話ウィンドウ・ログ） */
.ln .w.cw{pointer-events:auto;cursor:pointer;border-radius:6px;padding:1px 2px 0;position:relative;touch-action:manipulation}
.ln .w.cw:active{background:rgba(255,230,160,.18)}
.ln .w.cw::after{content:'';position:absolute;left:30%;right:30%;bottom:-2px;height:2px;border-radius:2px;background:rgba(255,220,140,.55)}
.ln .w.cw.got::after{background:none;border-bottom:1px dotted rgba(255,255,255,.25)}
.ln .w.cw.more::after{background:none;border-bottom:1.5px dashed rgba(255,220,140,.5)}
.ln .w.cw.got .gl{opacity:.8}
.ln .w.hl .gt path{stroke:#c4553f}
.ro{font-size:11px;color:#d8cfe9;font-style:italic;letter-spacing:.02em;margin-top:3px;line-height:1.35}
.ro .cp{font-style:normal;color:var(--ink3);margin-left:6px}
.lit{font-size:12px;color:#cfc4e2;margin-top:2px}
.lit b{font-weight:500;color:var(--ink3);font-size:10px;margin-right:4px;letter-spacing:.06em}
.inner{font-size:12.5px;color:#cfe0ff;margin-top:5px;font-family:var(--mincho)}
.fly{position:fixed;z-index:60;pointer-events:none;color:#ffeec2;transition:transform .62s cubic-bezier(.4,.1,.3,1),opacity .62s ease-in}
.ln.wish{color:#fffbe6}
.ln.wish .gu path{stroke:rgba(255,196,90,.55);stroke-width:7.5}
.ln.wish .w{animation:waver 1.8s ease-in-out infinite}
.ln.wish .w:nth-child(2){animation-delay:.25s}.ln.wish .w:nth-child(3){animation-delay:.5s}.ln.wish .w:nth-child(4){animation-delay:.75s}
@keyframes waver{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.flick{animation:flick 2.4s steps(1) infinite}
@keyframes flick{0%{opacity:1}12%{opacity:.25}18%{opacity:.9}40%{opacity:.3}46%{opacity:1}70%{opacity:.45}76%{opacity:1}}

/* ===== タイトル ===== */
#title{padding:0;justify-content:space-between;align-items:center;text-align:center;overflow:hidden}
.tHead{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:10px;padding:max(48px,calc(env(safe-area-inset-top,0px) + 32px)) 16px 0;width:100%}
.tHead .sub{color:#3b2c55;font-size:15px;letter-spacing:.14em;text-shadow:0 0 8px rgba(255,248,236,.95),0 0 2px rgba(255,248,236,.9)}
#titleStage{position:absolute;left:0;top:0;width:100%;aspect-ratio:2/3}
#titleStage .tBg{position:absolute;inset:0;width:100%;height:100%;display:block}
#titleArt{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
.tBox{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:12px;padding:48px 16px max(40px,env(safe-area-inset-bottom,0px));width:100%;
  background:linear-gradient(180deg,rgba(27,22,40,0) 0%,rgba(27,22,40,.35) 60%,rgba(27,22,40,.55) 100%)}
.logo{font-family:var(--logo);font-size:clamp(34px,12.5vw,52px);white-space:nowrap;letter-spacing:.12em;line-height:1.05;margin-left:.12em;color:#fff3cf;
  background:linear-gradient(180deg,#fffaf0 0%,#ffe08a 55%,#ff9f6a 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 2px 0 #4a2338) drop-shadow(0 0 3px rgba(60,30,70,.6)) drop-shadow(0 0 14px rgba(255,190,110,.6))}
.ttlGlyphs{display:flex;gap:12px;color:#4a3868;filter:drop-shadow(0 0 6px rgba(255,248,236,.9))}
.ttlGlyphs .gl .gu path{stroke:rgba(255,190,100,.45);stroke-width:7}
.tBox .sub{color:var(--ink2);font-size:14px}
.big{padding:12px 36px;border-radius:999px;background:linear-gradient(180deg,#ffe39a,#ffbe5c);color:#3a2014;font-weight:700;font-size:17px;
  box-shadow:0 3px 0 #a5652a,0 0 18px rgba(255,200,110,.35)}
.big:active{transform:translateY(2px);box-shadow:0 1px 0 #a5652a}
.ghost{padding:8px 14px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);font-size:13px}

/* ===== ゲーム画面 ===== */
#game{background:linear-gradient(180deg,#221a2e 0%,var(--desk1) 62%,var(--desk2) 100%)}
.top{display:flex;align-items:center;gap:6px;padding-top:max(8px,env(safe-area-inset-top,0px));padding-bottom:6px}
.day{font-size:12px;color:var(--gold);min-width:62px;font-weight:700;letter-spacing:.04em}
#map{display:flex;gap:2px;flex:1}
#map button{flex:1;font-size:12px;padding:6px 2px;border-radius:8px 8px 0 0;border-bottom:2px solid transparent;color:var(--ink3)}
#map button.here{color:var(--ink);border-color:var(--gold);background:rgba(255,207,110,.08)}
#map button.can{color:var(--ink2)}
.tb{position:relative;font-size:12px;padding:6px 10px;border-radius:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:var(--ink)}
.tb .bd{position:absolute;top:-5px;right:-5px;min-width:16px;height:16px;border-radius:8px;background:var(--danger);color:#fff;font-size:10px;line-height:16px;display:none}
.tb .bd.on{display:block}
.tb.pulse{animation:pulse 1.2s ease-in-out 3}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(255,207,110,.45)}}

#sceneBox{position:relative;width:100%;aspect-ratio:360/460;max-height:calc(100% - 300px);border-radius:12px;overflow:hidden;background:#120f1e;flex:0 0 auto;touch-action:none;
  box-shadow:0 0 0 1px rgba(255,255,255,.08),0 6px 18px rgba(0,0,0,.35)}
/* 場面：背景の画像（1024x1536）と同じ座標の「舞台」。舞台は場面の幅いっぱいに置き、縦は場面ごとの見せたい範囲が会話ウィンドウの上に入るよう JS でずらす。
   舞台の中は「背景の画像」→「SVG の層」と「人物の画像」を交互に重ねる（奥の物・人物・手前の物の順。z-index は描く順） */
#scene{position:absolute;inset:0;overflow:hidden;z-index:0}
#stage{position:absolute;left:0;top:0;width:100%;aspect-ratio:2/3}
#stage>.bg{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity 1.2s ease;-webkit-user-drag:none}
#stage>.bg.on{opacity:1}
#stage>.bg.snap{transition:none}
#stage>.bg.dim{filter:brightness(.5) saturate(.6) hue-rotate(12deg)}
#bgTone{position:absolute;inset:0;background:#2c2f78;mix-blend-mode:multiply;opacity:0;transition:opacity 1.2s;pointer-events:none}
#bgTone.on{opacity:.45}
#stage>svg{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;overflow:hidden}
#stage>svg .obj{pointer-events:auto}
/* 物の当たり判定は .hb（と札の字の四角）だけ。光や炎などの飾りはタップを奪わない */
#stage>svg .obj *{pointer-events:none}
#stage>svg .obj .hb,#stage>svg .obj .cw rect{pointer-events:all}
/* ===== 人物の立ち絵（assets/ の画像。本人が用意した仮の絵） =====
   .fig（位置と切り抜き：端をぼかす・窓や屋台で隠す）> .mBr（呼吸）> .mSw（話す揺れ・願う・眠る）> .mPic（輪郭と光） */
.fig{position:absolute;display:none;pointer-events:none;--fl:0%;--fr:0%;--fb:100%;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 var(--fl),#000 calc(100% - var(--fr)),transparent 100%),linear-gradient(180deg,#000 var(--fb),transparent 100%);-webkit-mask-composite:source-in;
  mask-image:linear-gradient(90deg,transparent 0,#000 var(--fl),#000 calc(100% - var(--fr)),transparent 100%),linear-gradient(180deg,#000 var(--fb),transparent 100%);mask-composite:intersect}
.fig.on{display:block}
.fig .mBr,.fig .mSw,.fig .mPic{position:absolute;inset:0}
.fig .mBr{transform-origin:50% 100%;animation:mBreath 3.8s ease-in-out infinite}
.fig.small .mBr{animation-duration:3.2s}
@keyframes mBreath{0%,100%{transform:none}50%{transform:translateY(-.3%) scaleY(1.004)}}
.fig .mSw{transform-origin:50% 100%;transition:transform .45s ease}
.fig.talk .mSw{animation:mTalk 1.1s ease-in-out infinite}
@keyframes mTalk{0%,100%{transform:none}30%{transform:rotate(.35deg) translateY(-.35%)}70%{transform:rotate(-.3deg)}}
.fig.cast .mSw{transform:translateY(-1.2%)}
.fig.sleep .mSw{transform:translateY(1.6%) rotate(-1.8deg)}
.fig.avert .mSw{transform:translate(1.5%,1.2%) rotate(3deg)}
.fig.avert img{filter:brightness(.88) saturate(.85)}
/* 終わりの予感：碑文の最後の一文が、一瞬だけ途切れずに強く灯る */
.omenG{opacity:0}
#sceneBox.omen .omenG{animation:omenG 2.6s ease-in-out both}
#sceneBox.omen .flick{animation:omenF 2.6s ease-in-out both}
#sceneBox.omen #stage{transition:transform 2.6s ease-out;transform-origin:49.4% 50.6%;transform:scale(1.9)}
@keyframes omenG{0%,30%{opacity:0}48%{opacity:1}62%{opacity:.85}100%{opacity:0}}
@keyframes omenF{0%{opacity:.3}12%{opacity:.8}20%{opacity:.25}34%{opacity:1}64%{opacity:1}74%{opacity:.35}100%{opacity:.5}}
/* 引きの場面：主人公が駆けていく（位置と大きさは JS で from → to へ。走る上下の揺れ） */
.fig.run .mBr{animation:runBob .36s ease-in-out infinite}
@keyframes runBob{0%,100%{transform:translateY(0) rotate(-.7deg)}50%{transform:translateY(-1.8%) rotate(.7deg)}}
.fig .mPic{--rim:rgba(255,226,170,.5);--glow:rgba(255,214,120,0);
  filter:drop-shadow(0 0 .5px #4a2626) drop-shadow(0 0 .7px rgba(74,38,38,.85)) drop-shadow(var(--rdx,0px) -1px 3px var(--rim)) drop-shadow(0 0 10px var(--glow));transition:filter .5s}
.fig.small .mPic{filter:drop-shadow(0 0 .4px #4a2626) drop-shadow(calc(var(--rdx,0px) * .5) 0 1.5px var(--rim))}
/* 場面の光に合わせる：明るさ・彩度・色味（場面ごとに JS で --br --sa --se を指定）。縁の光は光の来る側（--rdx） */
.fig img{filter:brightness(var(--br,1)) saturate(var(--sa,1)) sepia(var(--se,0))}
/* 接地：下の端（画面の枠・屋台の台で切れるところ）に向かって、弱く影を落とす */
.fig .mAO{z-index:3;opacity:1;background:var(--ao,linear-gradient(180deg,rgba(30,16,24,0) 74%,rgba(30,16,24,.42) 100%))}
.fig.night .mPic{--rim:rgba(150,165,255,.45)}
.fig.cold .mPic{--rim:rgba(178,150,255,.42)}
.fig.cast .mPic{--glow:rgba(255,214,120,.9)}
.fig.cast.cold .mPic{--glow:rgba(190,160,255,.85)}
.fig img{position:absolute;left:0;top:0;width:100%;height:auto;max-width:none;opacity:0;transition:opacity .32s ease;-webkit-user-drag:none}
.fig img.on{opacity:1}
.fig img.top{z-index:2}
.fig.snap img{transition:none}
.fig.night img{filter:brightness(.86) saturate(.8)}
.fig.sleep img{filter:brightness(.78) saturate(.7)}
/* 画像が読めなかったとき：名札だけの影（遊びは続けられる） */
.fig.err .mPic{filter:none}
.fig.err .mPic::after{content:attr(data-name);position:absolute;left:20%;right:20%;top:10%;height:45%;border-radius:40% 40% 12% 12%;background:rgba(40,30,60,.55);
  color:#fff7ea;font:700 12px var(--sans);display:flex;align-items:center;justify-content:center}
/* 本性への切り替え：笑顔のまま一拍 → 上から影が落ちるように本性の絵へ */
.fig img.turn,.fc .tw.turn{transition:none;
  -webkit-mask-image:linear-gradient(180deg,#000 40%,transparent 60%);-webkit-mask-size:100% 250%;-webkit-mask-repeat:no-repeat;
  mask-image:linear-gradient(180deg,#000 40%,transparent 60%);mask-size:100% 250%;mask-repeat:no-repeat}
.fig img.turn{animation:mTurn 1s ease-in .6s both}
@keyframes mTurn{from{-webkit-mask-position:0 100%;mask-position:0 100%}to{-webkit-mask-position:0 0;mask-position:0 0}}
/* 夜の色（青紫の層）と、顔の上半分の影。どちらも立ち絵の形で切り抜く（mask は JS で人物ごとに指定） */
.fig .mTone{position:absolute;left:0;top:0;width:100%;aspect-ratio:2/3;z-index:3;opacity:0;transition:opacity 1s;-webkit-mask-size:100% 100%;mask-size:100% 100%}
.fig .mNight{background:#5a5cb8;mix-blend-mode:multiply}
.fig.night .mNight{opacity:.5}
.fig .mShade{background:linear-gradient(180deg,rgba(37,22,74,0) 8%,rgba(37,22,74,.62) 22%,rgba(58,36,104,.32) 33%,rgba(58,36,104,0) 41%)}
.fig.shade .mShade{opacity:1}
/* 画像の上に重ねる演出（状態が変わった直後だけ動く） */
.fxIn{animation:fxIn 1.4s ease-out both}
@keyframes fxIn{0%{opacity:0}100%{opacity:1}}
.fxBurn{animation:fxBurn 1.8s ease-out both}
@keyframes fxBurn{0%{opacity:0}15%{opacity:1;filter:brightness(2.2)}100%{opacity:1;filter:none}}
.fxOut{animation:fxOut 1.6s ease-in both}
@keyframes fxOut{0%{opacity:1}100%{opacity:0}}
.steam{animation:steam 2.4s ease-out both}
@keyframes steam{0%{opacity:0;transform:translateY(0) scale(.6)}25%{opacity:.85}100%{opacity:0;transform:translateY(-160px) scale(1.5)}}
.ember{animation:ember 2.6s ease-in-out infinite}
@keyframes ember{0%,100%{opacity:.25}50%{opacity:1}}
.doorSwing{transform-box:fill-box;transform-origin:100% 50%;animation:doorSwing .9s ease-out both}
@keyframes doorSwing{from{transform:scaleX(4)}to{transform:none}}
/* 顔の切り抜き（ログ・演出カード）。位置は人物ごとに JS で指定 */
.fc{position:relative;display:block;width:100%;height:100%;overflow:hidden}
.fc img{position:absolute;max-width:none;-webkit-user-drag:none}
.fc .tw{position:absolute;inset:0}
.fc .tw.turn{animation:mTurn 1.1s ease-in .9s both}
#scene .obj{cursor:pointer}
#scene .hb{fill:transparent;stroke:none}
#scene .obj.hot .hb{fill:rgba(255,236,170,.16);stroke:rgba(255,236,170,.85);stroke-width:5;stroke-dasharray:16 12}
#scene .kira{display:none;fill:#fff6cf}
#scene .obj.glow .kira{display:block}
#scene .obj.glow .kira path{animation:kira 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes kira{0%,100%{opacity:.25;transform:scale(.6)}50%{opacity:1;transform:scale(1.1)}}
#scene.shake{animation:shk .35s linear 2}
@keyframes shk{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.zz{animation:zz 2.4s ease-in-out infinite}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}100%{opacity:0;transform:translate(6px,-12px)}}
.castG{animation:castG 1.4s ease-in-out infinite}
@keyframes castG{0%,100%{opacity:.75}50%{opacity:1}}
.seal{animation:sealp 2s ease-in-out infinite}
@keyframes sealp{50%{opacity:.55}}
.mote{animation:mote 3s ease-in-out infinite}
@keyframes mote{0%{opacity:0;transform:translateY(0)}40%{opacity:.9}100%{opacity:0;transform:translateY(-22px)}}
.flame{animation:flame .9s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flame{from{transform:scale(1,1)}to{transform:scale(.92,1.08)}}

#tint{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(70,50,150,.18),rgba(40,30,110,.28));opacity:0;transition:opacity 1.2s}
#tint.on{opacity:1}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle at var(--fx,50%) var(--fy,50%),rgba(255,252,230,.95) 0,rgba(255,220,140,.55) 22%,rgba(255,220,140,0) 60%)}
#flash.go{animation:flash .6s ease-out}
#flash.bad{background:radial-gradient(circle at var(--fx,50%) var(--fy,50%),rgba(255,120,150,.6) 0,rgba(255,120,150,0) 55%)}
@keyframes flash{0%{opacity:0}18%{opacity:1}100%{opacity:0}}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.spark{position:absolute;width:6px;height:6px;margin:-3px;border-radius:50%;background:#fff6cf;box-shadow:0 0 6px 2px rgba(255,214,120,.8);animation:spark .9s ease-out forwards}
@keyframes spark{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3)}}
.toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(20,18,40,.9);border:1px solid rgba(232,196,122,.6);
  color:var(--ink);font-size:13px;padding:6px 12px;border-radius:8px;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;animation:fadeout 2.6s forwards;z-index:3}
.toast.voice{top:48px;color:#d9d0ff;font-style:italic;border-color:rgba(160,150,255,.5)}
@keyframes fadeout{0%{opacity:0}8%{opacity:1}80%{opacity:1}100%{opacity:0}}
.veil{position:absolute;inset:0;background:#05040c;opacity:0;transition:opacity .6s;pointer-events:none;z-index:2}

/* ===== 一人称の視界（2026-11-06〜）：主人公の姿は映さず、眠気は画面の効果で表す =====
   まぶた：画面の上下から暗い帯が迫る（冒頭の「まぶたが開く」と同じ形）。--o＝開き具合 0〜1（JS が L.sightOf から指定）。
   重いときは、ときどき一段深く垂れてから持ち上がる（--nod）。にじみ・暗さ・ゆっくりした揺れは場面に掛ける */
/* 下のまぶたは会話ウィンドウの上の縁から（見えている範囲の上下から迫る）。bottom は JS がウィンドウの高さに合わせる */
#sight{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden;--o:1}
#sight .dim{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 46%,rgba(5,4,12,0) 30%,rgba(5,4,12,.92) 100%);opacity:var(--dark,0);transition:opacity 1.2s}
#sight .lw{position:absolute;inset:0}
#sight.heavy .lw.t{animation:nodT 5.4s ease-in-out infinite}
#sight.heavy .lw.b{animation:nodB 5.4s ease-in-out infinite}
@keyframes nodT{0%,60%,100%{transform:none}76%{transform:translateY(var(--nod,6%))}}
@keyframes nodB{0%,60%,100%{transform:none}76%{transform:translateY(calc(var(--nod,6%) * -1))}}
#sight .lid{position:absolute;left:-10%;right:-10%;height:52%;background:#05040c;transition:transform var(--lt,1.2s) cubic-bezier(.5,0,.3,1)}
#sight .lid.t{top:0;border-radius:0 0 50% 50% / 0 0 28% 28%;box-shadow:0 10px 26px 12px rgba(5,4,12,.88);transform:translateY(calc(var(--o) * -140%))}
#sight .lid.b{bottom:0;border-radius:50% 50% 0 0 / 28% 28% 0 0;box-shadow:0 -10px 26px 12px rgba(5,4,12,.88);transform:translateY(calc(var(--o) * 140%))}
/* 打ち消したとき：まぶたが開いて、視界が戻る */
#sight.wake .lid.t{transform:translateY(-140%);transition-duration:.35s}
#sight.wake .lid.b{transform:translateY(140%);transition-duration:.35s}
#sight.wake .dim{opacity:0;transition-duration:.35s}
#sceneBox.drowse #scene{filter:blur(var(--blur,0px)) brightness(var(--bri,1))}
#scene{transition:filter 1.2s}
#sceneBox.wake #scene{filter:none;transition-duration:.35s}
#sceneBox.sway #stage{animation:sway 6.5s ease-in-out infinite}
#sceneBox.wake #stage{animation:none}
@keyframes sway{0%,100%{transform:scale(1.03)}30%{transform:translate(calc(var(--sw,0) * 6px),calc(var(--sw,0) * 3px)) rotate(calc(var(--sw,0) * .6deg)) scale(1.03)}70%{transform:translate(calc(var(--sw,0) * -5px),calc(var(--sw,0) * -2px)) rotate(calc(var(--sw,0) * -.5deg)) scale(1.03)}}
/* 自分（画面の下の縁＝自分の胸もと）。カードを運んで離さずにいると、自分に願える。ふだんは控えめ */
#selfT{position:absolute;left:50%;bottom:0;width:136px;height:26px;margin-left:-68px;z-index:4;cursor:pointer;touch-action:none;opacity:.5;transition:opacity .4s}
#selfT svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
#selfT .hz{position:absolute;left:-14px;right:-14px;bottom:0;height:30px}
/* カードを運んでいるあいだは、下の縁いっぱいが「自分」 */
#sceneBox.dragging #selfT .hz{left:-260px;right:-260px;height:42px}
#selfT .sGlow{opacity:.25;transition:opacity .4s}
#selfT .sWave{opacity:0}
#selfT .lb{position:absolute;left:50%;margin-left:13px;bottom:2px;font-size:10.5px;color:#ffeec2;letter-spacing:.12em;opacity:0;transition:opacity .3s;text-shadow:0 0 6px rgba(0,0,0,.9),0 0 2px rgba(0,0,0,.9);pointer-events:none;white-space:nowrap}
#selfT.glow{opacity:.95}
#selfT.glow .sGlow{opacity:.6;animation:castG 1.6s ease-in-out infinite}
#selfT.call{opacity:1}
#selfT.call .sGlow{opacity:1;animation:castG 1.1s ease-in-out infinite}
#selfT.call .sWave{animation:sWave 1.6s ease-out infinite}
#selfT.call .lb,#selfT.hot .lb{opacity:1}
#selfT.hot{opacity:1}
#selfT.hot .sGlow{opacity:1;animation:none}
@keyframes sWave{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(2.6)}}
#selfT .sWave{transform-box:fill-box;transform-origin:center}
/* 引きの場面：上下に黒い帯（映画の画面のように）。会話ウィンドウと「自分」は隠す */
#sceneBox::before,#sceneBox::after{content:'';position:absolute;left:0;right:0;height:0;background:#000;z-index:5;transition:height .6s ease;pointer-events:none}
#sceneBox::before{top:0}#sceneBox::after{bottom:0}
#sceneBox.wide::before,#sceneBox.wide::after{height:9%}
/* 会話ウィンドウと演出の文字は、まぶた（視界）より上 */
#win{transition:opacity .4s;z-index:3}
#fx{z-index:4}
#sceneBox.wide #win,#sceneBox.wide #selfT,#sceneBox.wide #sight{opacity:0;pointer-events:none}

/* 会話ウィンドウ（場面の下に重ねる） */
#win{position:absolute;left:6px;right:6px;bottom:6px;min-height:96px;border-radius:10px;background:var(--win);
  border:1px solid rgba(232,196,122,.55);box-shadow:inset 0 0 0 3px rgba(22,20,46,.88),inset 0 0 0 4px rgba(232,196,122,.25);

.mini{font-size:12px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink);background:rgba(255,255,255,.05)}

#spell{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:11px;color:var(--ink3)}

#hand{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));align-content:start;gap:5px;padding:4px 2px max(10px,env(safe-area-inset-bottom,0px));touch-action:pan-y}

.card{height:62px;border-radius:7px;background:linear-gradient(180deg,var(--card),var(--card2));border:1.5px solid #b89a6a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--inkP);touch-action:none;position:relative;
  box-shadow:0 2px 0 rgba(0,0,0,.3)}

@keyframes cup{0%{transform:scale(1)}30%{transform:scale(1.14);box-shadow:0 0 18px rgba(255,220,130,1)}100%{transform:scale(1)}}

.ring{position:absolute;left:50%;top:50%;width:96px;height:96px;margin:-48px 0 0 -48px;pointer-events:none;display:none}

  font:500 16px var(--sans);-webkit-user-select:text;user-select:text;-webkit-appearance:none;appearance:none;touch-action:manipulation}

/* ===== 冒頭（暗転 → まぶたが開く → 一文 → 木の天井から部屋へ）と、記憶のかけら ===== */
#intro{position:absolute;inset:0;z-index:35;background:#000;display:none;overflow:hidden;opacity:1;transition:opacity .9s ease}

#intro .iv{position:absolute;inset:0;opacity:0;transition:opacity .6s}

#intro .iv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 0%;transform-origin:50% 0;transform:scale(1.9);filter:blur(7px) brightness(.82) saturate(.85);transition:filter 1.2s ease}

#intro .lid{position:absolute;left:-10%;right:-10%;height:52%;background:#000;transition:transform 1s cubic-bezier(.5,0,.3,1)}
/* まぶたの形と縁のぼかしは、最後の夜の眠気（#sight）と同じ */
#intro .lid.t{top:0;border-radius:0 0 50% 50% / 0 0 28% 28%;box-shadow:0 10px 26px 12px rgba(0,0,0,.88);transform:translateY(calc(var(--o,0) * -115%))}
#intro .lid.b{bottom:0;border-radius:50% 50% 0 0 / 28% 28% 0 0;box-shadow:0 -10px 26px 12px rgba(0,0,0,.88);transform:translateY(calc(var(--o,0) * 115%))}
#introTx{position:absolute;left:24px;right:24px;top:44%;text-align:center;font-family:var(--mincho);font-size:16.5px;line-height:1.8;letter-spacing:.06em;white-space:nowrap;color:#f4efe6;opacity:0;transition:opacity 1.1s ease;text-shadow:0 0 12px rgba(0,0,0,.8)}
#introTx.on{opacity:1}
#introTx.mem{color:#eef4ff;letter-spacing:.24em;text-shadow:0 0 14px rgba(190,210,255,.9),0 0 2px #fff;animation:memf 2.6s ease-in-out infinite}
@keyframes memf{0%,100%{filter:blur(.4px)}50%{filter:blur(1.4px);opacity:.75}}
#introSkip{position:absolute;right:16px;bottom:max(18px,env(safe-area-inset-bottom,0px));font-size:12px;color:#9a93ab;border:1px solid #3a3450;border-radius:999px;padding:6px 12px;display:none}
#introSkip.on{display:block}
.sbtn{font-size:11px;padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.sbtn.off{color:var(--ink3);text-decoration:line-through}

/* ===== 終了画面 ===== */
#end{align-items:center;text-align:center;gap:12px;overflow-y:auto;padding-top:20px;padding-bottom:24px;background:linear-gradient(180deg,#0f1436,#1b1628 60%)}
#end h2{font-family:var(--logo);font-size:26px;color:#fff1c4;letter-spacing:.06em;text-shadow:0 0 12px rgba(255,200,110,.5)}
#endBox{position:relative;width:100%;max-width:360px;border-radius:12px;flex:0 0 auto;overflow:hidden}
#endArt{width:100%;display:block}
#endHero{position:absolute;left:32%;width:36%;top:36%;max-width:none;filter:brightness(.7) saturate(.8) drop-shadow(0 0 4px rgba(150,165,255,.5));
  -webkit-mask-image:linear-gradient(180deg,#000 30%,transparent 46%);mask-image:linear-gradient(180deg,#000 30%,transparent 46%)}
.stats{display:grid;grid-template-columns:auto auto;gap:4px 14px;font-size:13px;color:var(--ink2);text-align:left}
.stats b{color:var(--ink)}
.truths{display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--ink2);max-width:330px}
.q{font-size:14px;margin-top:6px}
#opts{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.opt{padding:8px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px}
.opt[aria-pressed="true"]{background:var(--gold);color:#2a1f12;border-color:var(--gold)}
#thanks{font-size:12px;color:var(--ink3);min-height:16px}
@media (prefers-reduced-motion: reduce){
  .ln.wish .w,.flick,.seal,.zz,.castG,.mote,.flame,#scene .obj.glow .kira path,#scene.shake,.tb.pulse,.gf.ng input,.born .card,.ctx.flash,.gl g.shine,.card.up,.sheet.on,.mc,.ring .mt{animation:none}
  #scene .obj.glow .kira{opacity:.9}
  .fig .mBr,.fig.talk .mSw,.fig img.turn,.fc .tw.turn,.fxIn,.fxBurn,.fxOut,.steam,.ember,.doorSwing{animation:none}
  .fig img.turn,.fc .tw.turn{-webkit-mask-image:none;mask-image:none}
  .steam{opacity:0}
  .toast{animation-duration:3s}
  #introTx.mem{animation:none}
  #intro .lid,#intro .iv img,#introTx,.fly{transition-duration:.2s}
  #flash.go{animation:none}
  #sight.heavy .lw.t,#sight.heavy .lw.b,#sceneBox.sway #stage,#selfT .sGlow,#selfT.call .sWave,.fig.run .mBr{animation:none}
  #sceneBox.omen .omenG,#sceneBox.omen .flick{animation:none;opacity:1}
  #sceneBox.omen #stage{transition:none}
}

<script id="logic">
/* ===== Solin Nen：ルール（純粋関数。tests/logic.test.js が Node で検証する） ===== */
const L = (() => {
  /* ---- 語彙 16 語＋自分で組み立てる言葉 3 語。
     文字は「形」の組み合わせ。枠の形1つ（物・生・作・添）＋中の形 0〜2 つ。
     同じ形はどの文字でも同じ役割（画面では説明せず、プレイヤーが手帳で気づく） ---- */
  // ro＝読み（音）。音素と音節の規則は下の「音」。カタカナは ro から自動で作る（kanaOf）
  const WORDS = [
    { id: 'ka', pos: 'n', jp: '火', cls: '物', el: ['熱'], ro: 'pila' },
    { id: 'mi', pos: 'n', jp: '水', cls: '物', el: ['流'], ro: 'lume' },
    { id: 'to', pos: 'n', jp: '扉', cls: '物', el: ['隔'], ro: 'tova' },
    { id: 'yo', pos: 'n', jp: '夜', time: true, cls: '物', el: ['静'], ro: 'noven' },
    { id: 'na', pos: 'n', jp: 'あなた', being: true, cls: '生', el: ['外'], ro: 'enu' },
    { id: 'wa', pos: 'n', jp: '私', being: true, cls: '生', el: ['内'], ro: 'ami' },
    { id: 'hito', pos: 'n', jp: '人', being: true, cls: '生', el: [], ro: 'halo' },
    { id: 'uso', pos: 'n', jp: '嘘', cls: '物', el: ['光', '否'], ro: 'seta' },
    { id: 'maho', pos: 'n', jp: '魔法', cls: '物', el: ['熱', '光'], ro: 'solin' },
    { id: 'hira', pos: 'v', jp: '開く', neg: '開かない', tr: true, cls: '作', el: ['外'], ro: 'tilu' },
    { id: 'nemu', pos: 'v', jp: '眠る', neg: '眠らない', tr: false, cls: '作', el: ['静'], ro: 'sulen' },
    { id: 'uru', pos: 'v', jp: '売る', neg: '売らない', tr: true, cls: '作', el: ['流'], ro: 'kanta' },
    { id: 'kome', pos: 'v', jp: '守る', neg: '守らない', jp2: '閉じ込める', neg2: '閉じ込めない', tr: true, cls: '作', el: ['隔'], ro: 'mavi' },
    { id: 'shin', pos: 'v', jp: '信じる', neg: '信じない', tr: true, cls: '作', el: ['光'], ro: 'lito' },
    { id: 'oo', pos: 'm', jp: '大きい', cls: '添', el: ['強'], ro: 'ola' },
    { id: 'nai', pos: 'm', jp: 'ない', cls: '添', el: ['否'], ro: 'nen' },
  ];
  // 村の誰も話さない、形を見よう見まねで書いてできる言葉。効果は形の役割から決まる。誰も口にしないので読み（音）はない
  const MADE = [
    { id: 'yu', pos: 'n', jp: '湯', cls: '物', el: ['熱', '流'], made: true, ro: null },
    { id: 'same', pos: 'v', jp: '目覚める', neg: '目覚めない', tr: false, cls: '作', el: ['外', '静'], made: true, ro: null },
    { id: 'toku', pos: 'v', jp: '解く', neg: '解かない', tr: true, cls: '作', el: ['外', '隔'], made: true, ro: null },
  ];
  /* ---- 小辞（文の中での役割を示す小さな字）。名詞句の前に置く前置詞と、文末の願いの印。
     魔法にはならない（はたらきの形を持たない）。回収して、役割の絵を当てて読めるようになる ---- */
  const PARTS = [
    { id: 'pe', role: 'subj', ro: 'e', name: '主語の印', gl: { ja: 'は', en: '[subj]' }, d: ['M8.5 19.5 A3.5 3.5 0 1 0 15.5 19.5 A3.5 3.5 0 1 0 8.5 19.5', '.M12 10.5 L12.01 10.5'] },
    { id: 'pk', role: 'obj', ro: 'ko', name: '目的語の印', gl: { ja: 'を', en: '[obj]' }, d: ['M6.5 14 L11.5 22.5 L18 12'] },
    { id: 'pl', role: 'time', ro: 'li', name: '時の印', gl: { ja: 'に', en: '[at]' }, d: ['M6.5 15 L17.5 15', 'M9 21.5 L15 21.5'] },
    { id: 'ph', role: 'wish', ro: 'ha', name: '願いの印', gl: { ja: 'よ', en: '[wish]' }, d: ['M12 10.5 C12.8 16 13.6 17 19 18.2 C13.6 19.4 12.8 20.4 12 26 C11.2 20.4 10.4 19.4 5 18.2 C10.4 17 11.2 16 12 10.5Z'] },
  ];
  const PART = {}; PARTS.forEach(p => { PART[p.id] = p; });
  const CASE = { pe: 'subj', pk: 'obj', pl: 'time' };

  /* ---- 音：母音 a e i o u ／子音 p t k m n s h v l（9）。音節は (子音)母音(n)。n は次が母音でないときだけ音節の終わりに付く。
     強さは最初の音節。カタカナは規則で決まる（ti=ティ, tu=トゥ, si=スィ, va=ヴァ, l の行はラ行） ---- */
  const KANA = {
    '': ['ア', 'イ', 'ウ', 'エ', 'オ'], p: ['パ', 'ピ', 'プ', 'ペ', 'ポ'], t: ['タ', 'ティ', 'トゥ', 'テ', 'ト'], k: ['カ', 'キ', 'ク', 'ケ', 'コ'],
    m: ['マ', 'ミ', 'ム', 'メ', 'モ'], n: ['ナ', 'ニ', 'ヌ', 'ネ', 'ノ'], s: ['サ', 'スィ', 'ス', 'セ', 'ソ'], h: ['ハ', 'ヒ', 'フ', 'ヘ', 'ホ'],
    v: ['ヴァ', 'ヴィ', 'ヴ', 'ヴェ', 'ヴォ'], l: ['ラ', 'リ', 'ル', 'レ', 'ロ'] };
  const SYL = /([ptkmnshvl]?)([aeiou])(n(?![aeiou]))?/g;
  function syllables(ro) {
    if (!ro) return [];
    const out = []; let m, at = 0; SYL.lastIndex = 0;
    while ((m = SYL.exec(ro))) { if (m.index !== at) return null; out.push({ c: m[1], v: m[2], n: !!m[3], s: m[0] }); at = SYL.lastIndex; }
    return at === ro.length ? out : null;
  }
  function kanaOf(ro) { const sy = syllables(ro); return sy ? sy.map(x => KANA[x.c]['aiueo'.indexOf(x.v)] + (x.n ? 'ン' : '')).join('') : ''; }
  const W = {}; WORDS.concat(MADE).forEach(w => { W[w.id] = w; });
  const roOf = id => (W[id] || PART[id] || {}).ro || null;
  const isPart = id => !!PART[id];
  // 形（枠は 24x28 そのもの、中の形は 16x18 の小枠に描き、1つなら中央、2つなら左右に縮めて置く）。memo は手帳の余白に書く主人公のメモ
  const CLS = {
    '物': { role: 'もの', d: ['M3 26 L21 26'] },
    '生': { role: 'いきもの', d: ['M1.6 5 A2.4 2.4 0 1 0 6.4 5 A2.4 2.4 0 1 0 1.6 5', 'M4 8 L4 25'] },
    '作': { role: 'はたらき', d: ['M3 3 L3 25 L6 23'] },
    '添': { role: 'そえる', d: ['M12 2.4 L12.01 2.4'] },
  };
  const EL = {
    '熱': { role: '熱', d: ['M8 17 C2 12 5 7 8 1 C11 7 14 12 8 17', 'M8 14 C6.5 12.5 7 10.5 8 9'] },
    '流': { role: '流れ', d: ['M0 6 C3 3 5 3 8 6 C11 9 13 9 16 6', 'M0 13 C3 10 5 10 8 13 C11 16 13 16 16 13'] },
    '隔': { role: '隔て', d: ['M2 18 L2 5 C2 0 14 0 14 5 L14 18'] },
    '外': { role: '外へ', d: ['M3 2 L13 9 L3 16'] },
    '内': { role: '内へ', d: ['M13 2 L3 9 L13 16'] },
    '静': { role: '静けさ', d: ['M1 6 C5 13 11 13 15 6', 'M4 11 L2 15', 'M8 12.5 L8 17', 'M12 11 L14 15'] },
    '光': { role: '光', d: ['M8 0 L8 8', 'M4 4 L12 4', 'M3 16 C3 10 13 10 13 16'] },
    '否': { role: '打ち消し', d: ['M1 9 L15 9', 'M11 2 L5 16'] },
    '強': { role: '強さ', d: ['M0 17 L8 1 L16 17', 'M4 11 L12 11'] },
  };
  // 手帳の余白に書く、主人公のメモ（疑問形。断定しない）
  const MEMO = { '物': 'もの？', '生': 'ひと？', '作': 'する？', '添': 'そえる？', '熱': 'あつい？', '流': 'ながれる？', '隔': 'へだてる？', '外': 'そとへ？', '内': 'うちへ？', '静': 'しずか？', '光': 'ひかる？', '否': 'けす？', '強': 'つよい？' };
  const ELPOS = { 1: ['translate(6.5 6)'], 2: ['translate(5.5 9) scale(.6)', 'translate(14 9) scale(.6)'] };
  const DOT_CLS = '添';
  // 文字の描画（svg の中身）。形ごとに <g data-r> でまとめる（手帳で同じ形を光らせるため）
  function glyphInner(cls, el) {
    let g = `<g data-r="${cls}">` + CLS[cls].d.map(d => `<path d="${d}"${cls === DOT_CLS ? ' class="dt"' : ''}/>`).join('') + '</g>';
    el.forEach((e, i) => { g += `<g data-r="${e}" transform="${ELPOS[el.length][i]}">` + EL[e].d.map(d => `<path d="${d}"/>`).join('') + '</g>'; });
    return g;
  }
  const partInner = id => '<g data-r="小">' + PART[id].d.map(d => d[0] === '.' ? `<path class="dt" d="${d.slice(1)}"/>` : `<path d="${d}"/>`).join('') + '</g>';
  const glyphOf = id => PART[id] ? partInner(id) : glyphInner(W[id].cls, W[id].el);
  const partsOf = id => PART[id] ? [] : [W[id].cls].concat(W[id].el);
  // 形の見本：確定した2語以上に共通して出てくると、手帳の余白に書きとめられる
  function radicalsKnown(confirmed) {
    const cnt = {}; confirmed.forEach(w => { if (!W[w] || W[w].made) return; partsOf(w).forEach(r => { cnt[r] = (cnt[r] || 0) + 1; }); });

  /* 正規化：前後の空白・全角半角（NFKC）・大文字小文字・カタカナ→ひらがな・語尾の「。」「！」・かぎかっこ・「〜」を吸収。

  function norm(text) {
    let x = String(text == null ? '' : text).normalize('NFKC').toLowerCase();
    x = x.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
    x = x.replace(/[「」『』"“”()（）\[\]〜~～]/g, ' ').replace(/[’‘`]/g, "'");
    x = x.replace(/[\s　]+/g, ' ').trim();
    x = x.replace(/[。．.、,，!！?？…・'\s]+$/g, '').replace(/^[。．.、,，!！?？…・\s]+/, '').trim();
    if (/^[\x00-\x7f]+$/.test(x)) {
      x = x.replace(/'/g, '').replace(/[.,!?;:]/g, ' ').replace(/\s+/g, ' ').trim();
      for (let i = 0; i < 2; i++) x = x.replace(/^(a|an|the|to) (?=\S)/, '');
    } else {
      const y = x.replace(/(という意味|って意味|の意味|の印|のしるし|を表す|を示す|の助詞|でしょう|かな|かも|です|だよ|だ)$/, '').trim();
      if (y) x = y;
    }
    return x;
  }
  // 動詞の活用（よくある形だけ）。ok＝同じ意味で受ける形、neg＝否定形（意味が逆なので「近い」）

  function jaForms(w, type) {
    const b = w.slice(0, -1), e = w.slice(-1);
    if (type === '1') return { ok: [w, b, b + 'ます', b + 'ました', b + 'ましょう', b + 'て', b + 'た', b + 'ろ', b + 'よ', b + 'よう', b + 'たい', b + 'ている', b + 'ています', b + 'てる', b + 'れば', b + 'られる', b + 'てください', b + 'なさい'],

      neg: [b + a + 'ない', b + i + 'ません', b + a + 'なかった', w + 'な', b + a + 'ないで'] };

    const s = /(s|sh|ch|x|z|o)$/.test(h) ? h + 'es' : /[^aeiou]y$/.test(h) ? h.slice(0, -1) + 'ies' : h + 's';

  function expand(list) {

  function guessOf(w, text, ctx) {
    const A = ansOf(w); const n = norm(text);
    if (!A || !n) return { r: 'empty' };

    const cands = [n]; if (lang === 'en' && n.length > 3) { if (n.endsWith('es')) cands.push(n.slice(0, -2)); if (n.endsWith('s')) cands.push(n.slice(0, -1)); }

    const forms = [...A.ok, ...A.alt];

    if (misses >= HINT_AT.len) out.push({ k: 'len', text: `ひらがなで ${[...A.yomi].length} 文字の言葉らしい` });
    if (misses >= HINT_AT.first) {

      out.push(y.length >= 2 && guessOf(w, y[0]).r !== 'ok' ? { k: 'first', text: `最初の1文字は「${y[0]}」` } : { k: 'first', text: `英語なら「${labelOf(w, 'en').charAt(0)}」で始まる` });

  const PART_EN = { pe: 'subject', pk: 'object', pl: 'when', ph: 'wish' };
  function labelOf(w, lang, revealed) {
    if (PART[w]) return lang === 'en' ? PART_EN[w] : PART[w].gl.ja;

  /* ---- 魔法の形：1語、大きい＋語、語＋ない ---- */
  function spellOf(words) {
    if (!words.length || words.length > 2) return { ok: false, why: '二語まで' };
    const p = parse(words);
    // 語順の誤り（添える言葉の位置・動詞のあと）は言葉がもつれて暴発する
    if (!p.ok) return { ok: false, misfire: ['nai-pos', 'oo-pos', 'oo-end', 'verb-last'].includes(p.why), why: 'ことばがもつれた' };
    if (p.vp && p.nps.length) return { ok: false, why: '文になった。けれど魔法は起きない' };
    if (p.nps.length > 1) return { ok: false, why: '名前が二つ並んだだけ' };
    const h = p.vp || p.nps[0];
    return { ok: true, w: h.w, big: h.big, neg: h.neg, key: keyOf(h) };
  }

  function witnessKey(toks) {
    const p = parse(toks); if (!p.ok) return null;
    if (p.vp) return keyOf(p.vp);
    return p.nps.length === 1 ? keyOf(p.nps[0]) : null;

  /* ---- 確信（0〜3）：語を確定=1、目撃=2、自分で成功=3。

  // 自分で書いた言葉は、書いたあとに意味を当ててはじめてカードになる（named）

    if (ws.length === 1 && W[k].made) { const rd = radDone(s); if (W[k].el.every(e => rd.has(e))) return 2; }

  function needOf(s, target) {
    if (s.phase === 'final' && s.fin) {

      if (target === 'mira') return s.fin.mc + 1;

    return Math.max(2, RESIST[target] || 0);
  }

  function objectsAt(s) {

  }

  /* ---- 自作の言葉の効果は形の役割で決まる：熱＋流れ＝溶かす／外へ＋静けさ＝目覚めさせる／外へ＋隔て＝解く ---- */
  const RADFX = { '流熱': 'melt', '外静': 'wake', '外隔': 'unseal' };
  const radFx = w => W[w] && W[w].made ? RADFX[[...W[w].el].sort().join('')] : null;
  /* ---- 魔法の効果（願いを込めたときだけ呼ばれる）。ok=何かが変わる ---- */
  function effect(s, sp, tgt) {
    const o = s.obj, w = sp.w, big = sp.big, neg = sp.neg;
    const ok = (set, msg, x) => Object.assign({ ok: true, set, msg }, x || {});
    const no = msg => ({ ok: false, msg });
    if (isDark(s) && tgt !== 'torch' && tgt !== 'self') return no('暗くて見えない');
    const rf = neg ? null : radFx(w);
    if (rf === 'melt') return tgt === 'gate' && o.gate === 'frozen' ? ok({ gate: 'closed' }, '湯気が立ちのぼり、氷が溶けた') : no(tgt === 'gate' ? '氷はもうない' : 'あたりに湯気が立っただけ');
    if (rf === 'wake') {
      if ((tgt === 'dog' || tgt === 'merchant') && o[tgt] === 'asleep') return ok({ [tgt]: tgt === 'dog' ? 'awake' : 'idle' }, '目を覚ました');
      if (tgt === 'self') return s.phase === 'final' ? ok({}, '眠りの言葉が外へほどけた', { counter: true }) : no('頭がすっきりした');
      return no('眠ってはいない');
    }
    if (rf === 'unseal') {
      if ((tgt === 'door' || tgt === 'gate') && o[tgt] === 'sealed') return ok({ [tgt]: 'closed' }, '封印がほどけた');
      if ((tgt === 'dog' || tgt === 'merchant') && o[tgt] === 'caged') return ok({ [tgt]: tgt === 'dog' ? 'awake' : 'idle' }, '檻が消えた');
      if (tgt === 'gate' && o.gate === 'frozen') return no('氷は封印ではない');
      return no('ほどくものがない');
    }
    if (tgt === 'gate' && o.gate === 'frozen') {
      if (w === 'ka') return no('炎は氷の表面で消えた。熱だけでは溶けない');
      if (w === 'mi') return no('氷が厚くなった。流れだけでは溶けない');
      if (w === 'hira') return no('氷に閉ざされている');
      if (w === 'kome' && neg) return no('封印ではない。氷だ');
    }
    switch (tgt) {
      case 'torch':
        if (w === 'ka' && !neg) return o.torch === 'out' ? ok({ torch: 'lit' }, '松明に火が灯った') : no('もう燃えている');
        if ((w === 'mi' && !neg) || (w === 'ka' && neg)) return o.torch === 'lit' ? ok({ torch: 'out' }, '火が消えた') : no('もう消えている');
        break;
      case 'door': case 'gate': {
        const st = o[tgt];
        if (w === 'hira' && !neg) {
          if (st === 'sealed') return no('封印の文字にはじかれた');
          if (st === 'open') return no('もう開いている');
          if (tgt === 'gate' && o.thorns !== 'burnt') return no('茨が絡みついて開かない');
          return ok({ [tgt]: 'open' }, tgt === 'gate' ? '門が開いた' : '扉が開いた', tgt === 'gate' ? { then: 'final' } : null);
        }
        if (w === 'hira' && neg) return st === 'open' ? ok({ [tgt]: 'closed' }, '閉じた') : no('もう閉じている');
        if (w === 'kome' && !neg) return st === 'closed' ? ok({ [tgt]: 'sealed' }, '封印の文字が浮かんだ') : no(st === 'sealed' ? 'もう封じられている' : '開いたままでは封じられない');
        if (w === 'kome' && neg) return st === 'sealed' ? ok({ [tgt]: 'closed' }, '封印がほどけた') : no('封じられてはいない');
        break;
      }
      case 'dog': case 'merchant': {
        const st = o[tgt], up = tgt === 'dog' ? 'awake' : 'idle';
        if (w === 'nemu' && !neg) return st === up ? ok({ [tgt]: 'asleep' }, tgt === 'dog' ? '犬が眠った' : '商人が眠りこんだ') : no('いまは効かない');
        if (w === 'nemu' && neg) return st === 'asleep' ? ok({ [tgt]: up }, '目を覚ました') : no('眠ってはいない');
        if (w === 'kome' && !neg) return st !== 'caged' ? ok({ [tgt]: 'caged' }, '光の檻に閉じ込めた', { kome: true }) : no('もう檻の中だ');
        if (w === 'kome' && neg) return st === 'caged' ? ok({ [tgt]: up }, '檻が消えた') : no('檻はない');
        if (w === 'ka') return no('生きものに火は向けられない');
        break;
      }
      case 'trough':
        if (w === 'mi' && !neg) return o.trough === 'full' ? no('もう満ちている') : big ? ok({ trough: 'full', dog: o.dog === 'awake' ? 'drinking' : o.dog }, '水桶があふれ、犬が水を飲みに来た') : no('桶の底がぬれただけ…');
        if (w === 'mi' && neg) return o.trough === 'full' ? ok({ trough: 'dry', dog: o.dog === 'drinking' ? 'awake' : o.dog }, '水が消えた') : no('もう空だ');
        break;
      case 'cage':
        if (w === 'kome' && neg) return no('札の封印は、もう誰も入れていない檻のものだ');
        break;
      case 'thorns':
        if (w === 'ka' && !neg) return o.thorns === 'burnt' ? no('もう焼けている') : big ? ok({ thorns: 'burnt' }, '大きな炎が茨を焼きはらった') : no('少し焦げただけ…');
        if (w === 'mi') return no('茨がぬれただけ');
        break;
      case 'self':
        if (w === 'nemu' && neg) return s.phase === 'final' ? ok({}, '眠りの言葉を打ち消した', { counter: true }) : no('頭がすっきりした');
        if (w === 'nemu') return no('まぶたが重い…すぐに目を覚ました');
        break;
      case 'mira':
        if (s.phase === 'final' && ((w === 'nemu' && !neg) || (w === 'kome' && !neg))) return ok({}, w === 'nemu' ? 'ミラが崩れるように眠った' : 'ミラを光の檻に閉じ込めた', { bind: true, kome: w === 'kome' });
        if (s.phase !== 'final' && ((w === 'nemu' && !neg) || (w === 'kome' && !neg))) return ok({}, '', { bind: true });
        break;
    }
    if (W[w].pos === 'n' && w !== 'ka' && w !== 'mi') return no('名前を呼んだだけ…');
    return no('何も起きない');
  }

  /* ---- 最後の夜：ターン制の頭脳戦。
     ミラの確信 mc（4から）。予兆：sing（子守歌・魔法なし）→ cast（眠り。強さ=mc）を交互。
     警戒すると毎回 big（大きく眠る。強さ=mc+1、まぶた+2）。寝たふりで油断させると次は careless（強さ=mc-1）。
     自分の手：counter（眠る＋ない に願い）／accuse（「あなた 売る」と言う）／accuseKome（「あなた 閉じ込める」）／
     show（約束の札を見せる）／feign（寝たふり）／wish（ミラに願いの魔法。ミラの確信を上回れば縛れる）／wait。
     mc が 1 以下になったら勝ち。まぶたが 3 で負け ---- */
  function strengthOf(f) { return { sing: 0, cast: f.mc, big: f.mc + 1, careless: f.mc - 1 }[f.intent]; }
  function finalInit(alert) { return { mc: 4, alert: !!alert, drowsy: 0, round: 0, intent: alert ? 'big' : 'sing', feign: false, used: [], done: null }; }
  function finalStep(fin, ctx, a) {
    const f = JSON.parse(JSON.stringify(fin)); const out = { r: 'none', countered: false, hit: false, win: null };
    if (f.done) return { fin: f, out };
    const str = strengthOf(f);
    switch (a.k) {
      case 'counter':
        if (f.intent === 'sing') { f.alert = true; out.r = 'wasted'; }
        else if (ctx.P >= str) { out.countered = true; f.mc -= 1; f.alert = true; out.r = 'countered'; }
        else out.r = 'doubt';
        break;
      case 'counterHidden': // 自作の「目覚める」：相手は知らない言葉なので、打ち消されたことに気づけない（警戒しない）
        if (f.intent === 'sing') out.r = 'none';
        else if ((ctx.Ph || 0) >= str) { out.countered = true; f.mc -= 1; out.r = 'countered'; }
        else out.r = 'doubt';
        break;
      case 'accuse':
        if (ctx.canAccuse && !f.used.includes('uru')) { f.used.push('uru'); f.mc -= 2; f.alert = true; out.r = 'shaken'; } else out.r = 'smile';
        break;
      case 'accuseKome':
        if (ctx.canAccuseKome && !f.used.includes('kome')) { f.used.push('kome'); f.mc -= 1; f.alert = true; out.r = 'shaken'; } else out.r = 'smile';
        break;
      case 'show':
        if (ctx.hasTag && !f.used.includes('tag')) { f.used.push('tag'); f.mc -= 1; f.alert = true; out.r = 'shaken'; } else out.r = 'none';
        break;
      case 'feign':
        if (f.intent === 'sing' && !f.alert) { f.feign = true; out.r = 'feign'; } else out.r = 'seen';
        break;
      case 'wish': {
        const c = (ctx.conf && ctx.conf[a.key]) || 0;
        if ((a.key === 'nemu' || a.key === 'kome' || a.key === 'oo+nemu') && c > f.mc) { out.r = 'bound'; out.win = a.key; f.mc = 0; }
        else { f.alert = true; out.r = 'repelled'; }
        break;
      }
      default: out.r = 'wait';
    }
    f.mc = Math.max(0, f.mc);
    if (f.mc <= 1) { out.win = out.win || 'crumble'; f.done = 'win'; return { fin: f, out }; }
    if (str > 0 && !out.countered) { out.hit = true; f.drowsy += f.intent === 'big' ? 2 : 1; if (f.drowsy >= 3) { f.done = 'lose'; return { fin: f, out }; } }
    const was = f.intent; f.round++;
    f.intent = f.alert ? 'big' : was === 'sing' ? (f.feign ? 'careless' : 'cast') : 'sing';
    f.feign = false;
    return { fin: f, out };
  }
  const INTENT_LINE = { sing: 'f0', cast: 'f1', big: 'f2', careless: 'f3' };
  function finalCtx(s) {
    const c = {}; ['nemu', 'kome', 'oo+nemu'].forEach(k => { c[k] = conf(s, k.split('+')); });
    return { P: conf(s, ['nemu', 'nai']), Ph: conf(s, ['same']), conf: c, hasTag: !!s.tag,
      canAccuse: ['na', 'uru'].every(w => s.confirmed.includes(w)),
      canAccuseKome: s.revealed && ['na', 'kome'].every(w => s.confirmed.includes(w)) };
  }

  /* ---- ゲームの状態と1手 ---- */
  function newGame() {
    return { day: 1, phase: 'play', place: 'house', night: false, mira: 'house', miraStep: 0, merchStep: 0, miraLook: true,
      obj: { torch: 'out', door: 'sealed', dog: 'awake', merchant: 'idle', trough: 'dry', jar: 'empty', thorns: 'thick', gate: 'frozen' },
      made: [], named: [],
      heard: [], seen: [], uses: {}, pconf: [], labels: [], confirmed: [], revealed: false, cageSeen: false, komeCast: false,
      lang: {}, tries: {}, guesses: 0,
      witnessed: [], succeeded: [], wordsDone: [], belief: false, twistAt: null, twistLine: null, truths: [],
      wary: false, tag: false, combos: [], fin: null, won: false, sleeps: 0, selfCast: false, asked: [] };
  }
  const clone = o => JSON.parse(JSON.stringify(o));
  const SQUARE_WORDS = ['uru', 'oo', 'hito', 'maho', 'shin'];

  function act(s0, a) {
    const s = clone(s0), ev = [];
    const E = (type, o) => ev.push(Object.assign({ type, snap: clone(s) }, o || {}));
    // 回収できる文：聞いたセリフ（L:id）か、いまこの場にある書かれた文字（B:物:行）。暗いと松明の文字しか読めない
    function srcToks(src) {
      const m = /^L:(\w+)$/.exec(src || '');
      if (m) return LINES[m[1]] && s.heard.some(h => h.id === m[1]) ? LINES[m[1]].s : null;
      const b = /^B:(\w+):(\d+)$/.exec(src || ''); if (!b) return null;
      const lb = LABELS[b[1]]; if (!lb || !lb.s[+b[2]]) return null;
      if (!(objectsAt(s).includes(b[1]) || (b[1] === 'tag' && s.tag))) return null;
      if (isDark(s) && b[1] !== 'torch') return null;
      return lb.s[+b[2]];
    }
    const truthful = toks => toks.every(w => s.confirmed.includes(w)) && (!toks.includes('kome') || s.revealed);
    function checkBelief() {
      if (!s.belief && s.labels.includes('statue') && BELIEF_LINE.every(w => s.confirmed.includes(w))) { s.belief = true; E('belief'); }
    }
    function checkTwist() {
      s.heard.forEach(h => {
        const ln = LINES[h.id]; if (!ln.truth || s.truths.includes(h.id) || !truthful(ln.t)) return;
        s.truths.push(h.id);
        if (s.twistAt == null) { s.twistAt = s.confirmed.length; s.twistLine = h.id; E('twist', { id: h.id }); }
        else E('truth', { id: h.id });
      });
    }
    function checkReveal() {
      if (!s.revealed && s.confirmed.includes('kome') && (s.cageSeen || s.komeCast)) { s.revealed = true; E('reveal'); checkTwist(); }
    }
    function say(id) {
      const ln = LINES[id];
      if (!s.heard.some(h => h.id === id && h.day === s.day)) s.heard.push({ id, day: s.day });
      if (ln.wish) { const k = witnessKey(ln.t); if (k && !s.witnessed.includes(k)) s.witnessed.push(k); }
      if (ln.wish && ln.fx) { Object.keys(ln.fx).forEach(k => { if (k in s.obj) s.obj[k] = ln.fx[k]; }); }
      E('say', { id });
      checkTwist();
    }
    function label(id, quiet) {
      if (!s.labels.includes(id)) s.labels.push(id);
      E('label', quiet ? { id, quiet: true } : { id });
      if (id === 'cage') { s.cageSeen = true; checkReveal(); }
      checkBelief();
    }
    function morning() {
      s.day++; s.place = 'house'; s.phase = 'play'; s.night = false; s.fin = null;
      Object.assign(s.obj, { torch: 'lit', door: 'closed', dog: 'awake', merchant: 'idle', trough: 'dry', gate: s.obj.gate === 'frozen' ? 'frozen' : 'closed' });
      s.mira = 'house'; s.miraLook = true; E('morning');
      say('h6'); s.mira = 'square'; E('miraLeave'); say('n1');
    }
    function toNight() {
      say('s3'); s.place = 'house'; s.mira = 'house'; s.night = true; s.obj.torch = 'lit'; s.obj.door = 'closed'; E('goHome');
      say('n1'); say('n2'); s.sleeps++; E('sleep'); morning();
    }
    function startFinal() {
      s.phase = 'final'; s.night = true; s.mira = 'gate'; s.fin = finalInit(s.wary); E('nightfall');
      say(INTENT_LINE[s.fin.intent]); E('final');
    }
    function finalAction(k, extra) {
      const r = finalStep(s.fin, finalCtx(s), Object.assign({ k }, extra || {}));
      s.fin = r.fin;
      if (r.out.r === 'countered') { const kk = k === 'counterHidden' ? 'same' : 'nemu+nai'; if (!s.succeeded.includes(kk)) s.succeeded.push(kk); }
      E('fturn', { out: r.out });
      if (r.fin.done === 'win') { s.phase = 'won'; s.won = true; E('escape', { how: r.out.win }); return; }
      if (r.fin.done === 'lose') { s.phase = 'lost'; E('lost'); return; }
      say(INTENT_LINE[s.fin.intent]);
    }
    function watched() { return s.mira === s.place && s.phase === 'play' && s.miraLook; }
    function afterAction() { if (s.place === 'square' && s.mira === 'square' && s.phase === 'play') s.miraLook = !s.miraLook; }

    switch (a.t) {
      case 'tap': {
        const o = a.obj;
        if (s.phase === 'final') { if (o === 'self') finalAction('feign'); break; }
        if (s.phase !== 'play') break;
        if (!objectsAt(s).includes(o)) break;
        if (isDark(s) && o !== 'torch' && o !== 'self') { E('msg', { text: '暗くて見えない' }); break; }
        if (o === 'mira') {
          if (s.place === 'house' && s.day === 1) {
            const seq = ['h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'h7', 'h8']; const id = seq[s.miraStep];
            if (!id) break; s.miraStep++;
            if (id === 'h8') { say('h8'); s.mira = 'square'; E('miraLeave'); s.obj.door = 'closed'; s.obj.torch = 'out'; E('wind'); break; }
            say(id); break;
          }
          if (s.place === 'square') {
            if (!s.heard.some(h => h.id === 's1' && h.day === s.day)) { say('s1'); say('s2'); }
            else if (s.day === 1 && SQUARE_WORDS.every(w => s.seen.includes(w))) { toNight(); break; }
            else E('msg', { text: 'ミラは商人と話しこんでいる' });
          }
          afterAction(); break;
        }
        if (o === 'merchant') {
          if (s.obj.merchant !== 'idle') E('msg', { text: s.obj.merchant === 'asleep' ? 'ぐっすり眠っている' : '光の檻の中' });
          else { const seq = ['m1', 'm2', 'm3']; say(seq[s.merchStep % 3]); s.merchStep++; }
          afterAction(); break;
        }
        if (o === 'tag') {
          label('tag');
          if (s.obj.merchant === 'idle') E('msg', { text: '商人の目が光っている' });
          else { s.tag = true; E('take'); if (watched()) { s.wary = true; E('wary'); } }
          afterAction(); break;
        }
        // 像に初めて触れる：像を指さして村人を見上げる（「……この人は？」）→ 窓の人が答える。碑文は次に触れたとき会話ウィンドウに出る
        const ask = STORY.ask[o];
        if (ask && !(s.asked || []).includes(o)) {
          (s.asked = s.asked || []).push(o); E('ask', { id: o }); ask.lines.forEach(say); E('askEnd', { id: o });
          if (LABELS[o]) label(o, true);
          afterAction(); break;
        }
        if (LABELS[o]) { label(o); afterAction(); break; }
        if (o === 'gate' && s.obj.gate === 'frozen') { label('gate'); E('msg', { text: '分厚い氷。火だけでも、水だけでも溶けそうにない' }); break; }
        const flavor = { bed: 'まだ温かい寝床', self: '胸に手を当てた。自分の鼓動が聞こえる', dog: '犬がうなって、路地をふさいでいる', trough: '空っぽの水桶', thorns: '鋭い茨が門をふさいでいる' };
        E('msg', { text: o === 'dog' && s.obj.dog !== 'awake' ? '路地が通れる' : flavor[o] || '…' });
        afterAction(); break;
      }
      case 'move': {
        const r = canMove(s, a.to);
        if (r !== true) { if (r) E('msg', { text: r === 'door' ? '扉が閉まっている' : '犬が路地をふさいでいる' }); break; }
        s.place = a.to; if (a.to === 'square') s.miraLook = false; E('move'); break;
      }
      case 'wake': if (!s.heard.length) say('h0'); break;
      case 'collect': {
        // 字をタップして手帳に書きとめる。同じ字を別の文から回収すると用例が増える
        const toks = srcToks(a.src);
        if (!toks || !toks.includes(a.w)) break;
        const isNew = !s.seen.includes(a.w); if (isNew) s.seen.push(a.w);
        const u = s.uses[a.w] || (s.uses[a.w] = []), fresh = !u.includes(a.src); if (fresh) u.push(a.src);
        E('collect', { w: a.w, src: a.src, isNew, fresh }); break;
      }
      case 'guess': {
        // 意味を入力して判定する（1語ずつ）。回収した語・小辞・自分で書いた字だけ
        const w = a.w, made = !!(W[w] && W[w].made);
        if (!(PART[w] || W[w]) || !(made ? s.made.includes(w) : s.seen.includes(w))) break;
        if (s.confirmed.includes(w) || s.pconf.includes(w) || s.named.includes(w)) break;
        const g = guessOf(w, a.text, s);
        if (g.r === 'empty') break;
        s.guesses++;
        if (g.r === 'ok') {
          s.lang[w] = g.lang;
          if (PART[w]) { s.pconf.push(w); E('pconfirm', { w, lang: g.lang }); }
          else if (made) { s.named.push(w); E('named', { w, lang: g.lang }); }
          else { if (g.alt) s.komeAlt = true; s.confirmed.push(w); E('confirm', { words: [w], w, lang: g.lang, alt: g.alt }); checkReveal(); checkBelief(); checkTwist(); }
          break;
        }
        if (g.r === 'hold' || g.r === 'sound') { E(g.r, { w }); break; }
        const n = s.tries[w] = (s.tries[w] || 0) + 1;
        E(g.r, { w, n, hint: Object.keys(HINT_AT).find(k => HINT_AT[k] === n) || null });
        break;
      }
      case 'compose': {
        const known = radicalsKnown(s.confirmed), el = a.el || [];
        if (!known.includes(a.cls) || !el.length || el.length > 2 || el.some(e => !known.includes(e)) || new Set(el).size !== el.length) { E('composeFail', { why: 'まだよく分からない形がある' }); break; }
        const w = wordFromParts(a.cls, el);
        if (!w) { E('composeFail', { why: '何も起きない。ただの落書きだ' }); break; }
        if (!w.made) { E('composeKnown', { w: w.id }); break; }
        if (!s.made.includes(w.id)) s.made.push(w.id);
        E('composed', { w: w.id }); break;
      }
      case 'cast': {
        const words = a.words || [], tgt = a.target;
        if (!words.length) break;
        if (words.some(w => !knows(s, w))) { E('fizzle', { why: 'まだ意味のわからない言葉' }); break; }
        if (words.length === 2) { const k = words.join('+'); if (!s.combos.includes(k)) s.combos.push(k); }
        // 自分に願った（一人称：画面の下の「自分」へカードを運んだ）。初めての呼びかけの光はここで止まる
        if (a.wish && tgt === 'self' && (s.phase === 'final' || s.phase === 'play')) s.selfCast = true;
        if (s.phase === 'final') {
          if (!a.wish) {

  /* ---- 森の門：茨の絡んだ石のアーチと木の扉。扉の下半分を氷が覆う ---- */

  /* ---- 状態 ---- */
  let S = L.newGame(), bar = null, sel = null, busy = false, runNo = 0, runCounted = false, escapeHow = null;

  /* ---- 一人称の視界：眠気（まぶた・にじみ・暗さ・揺れ）を L.sightOf から画面に掛ける ---- */

  function applySight(st) {

  const fitSight = () => { const w = $('#win'); $('#sight').style.bottom = Math.max(0, w.offsetHeight + 6 - 16) + 'px'; };
  if (window.ResizeObserver) new ResizeObserver(fitSight).observe($('#win'));

  // 眠りを打ち消した：まぶたが開いて、にじみと揺れが消える（しばらくして、いまの眠気の具合に戻る）

  }
  const cold = st => st.twistAt != null || st.wary;
  // 顔の切り抜き（ログ・演出カード用）
  function faceCrop(who, o) {
    o = o || {};

  // 訳の言葉（日本語／英語）。localStorage は覚えておくだけ（無くても遊べる）

  let LANG = 'ja', langChosen = false; try { const v = localStorage.getItem('kotodama.lang'); if (v === 'en' || v === 'ja') { LANG = v; langChosen = true; } } catch (e) {}
  const knownOf = st => (st || S).confirmed.concat((st || S).pconf || []);
  const kanaW = t => L.kanaOf(L.roOf(t));
  // 1文：架空文字＋読み（カタカナ）＋分かった語の訳。src を渡すと、字をタップして手帳に書きとめられる。hl＝強調する字
  function lineHtml(toks, wish, h, flick, src, hl) {

    const ln = `<span class="ln${wish ? ' wish' : ''}${flick ? ' flick' : ''}">${toks.map((t, i) => {
      // got＝この文から書きとめ済み。more＝ほかの文で書きとめた字（タップすると用例が増える）
      const pt = L.isPart(t), got = src && (S.uses[t] || []).includes(src), more = !got && S.seen.includes(t);

  // 訳：中身の語が全部分かると逐語訳、小辞も分かると自然な訳（日本語／英語）
  function transHtml(toks, speaker, truth, tag) {
    const v = L.view(toks, knownOf(), { lang: LANG, revealed: S.revealed, speaker });

    if (v.natural) return `<${tag} class="full${truth ? ' truth' : ''}">「${v.natural}」</${tag}>`;

    if (S.place === 'square') return '……にぎやかな広場。知らない言葉が、あちこちから聞こえる。';

        const fl = lb.flicker === i;
        return `<div class="row">${lineHtml(ln, fl, h, fl, `B:${lastSay.label}:${i}`)}${fl && lb.tear ? '<span class="tear">涙の跡</span>' : ''}${transHtml(ln, null, false, 'span')}</div>`;

    const pv = lastSay.prev && L.LINES[lastSay.prev], prev = pv ? `<div class="prev"><span class="pn">${whoName(pv.who)}</span>${lineHtml(pv.s, pv.wish, 18, false, 'L:' + lastSay.prev)}${transHtml(pv.s, pv.who, isTruthShown(lastSay.prev), 'span')}</div>` : '';

      + `<div class="ro">「${L.romaji(ln.s)}」<span class="cp">（${ln.cap}）${ln.wish ? '✦光っている' : ''}</span></div>`

  }
  function renderHint() {

  // カードの表記：当てたときの言語（日本語で当てたら日本語、英語なら英語）。自作の字は、うまく使えるまで「？」つき。

  function idleGlow() {

  }

  /* ---- 演出 ---- */
  function toast(text, voice) {
    const d = document.createElement('div'); d.className = 'toast' + (voice ? ' voice' : ''); d.textContent = text;
    // 重ならないように、出ているトーストの下に積む

    const ts = [...document.querySelectorAll('#fx .toast')]; if (ts.length >= 3) { ts[0].remove(); ts.slice(1).forEach((t, i) => { t.style.top = (10 + i * 38) + 'px'; }); }
    const n = Math.min(ts.length, 2); if (n) d.style.top = (10 + n * 38) + 'px';
    $('#fx').appendChild(d); setTimeout(() => d.remove(), 2700);
  }
  let talkTimer = 0;
  function talkMark(who) {
    clearTimeout(talkTimer);
    talkTimer = setTimeout(() => { document.querySelectorAll('#scene .talk').forEach(el => el.classList.remove('talk')); }, reduced ? 0 : 1100);
    void who;
  }
  function objPos(id) {
    const box = $('#sceneBox').getBoundingClientRect(), el = id === 'self' ? $('#selfT svg') : document.querySelector(`#scene [data-obj="${id}"] .hb`);
    if (!el) return { x: box.width / 2, y: box.height / 2, box };
    const r = el.getBoundingClientRect(); return { x: r.left - box.left + r.width / 2, y: r.top - box.top + r.height / 2, box };
  }
  function flashAt(id, bad) {
    if (FAST || reduced) return;

    fl.style.setProperty('--fx', p.x + 'px'); fl.style.setProperty('--fy', p.y + 'px');
    fl.classList.toggle('bad', !!bad); fl.classList.remove('go'); void fl.offsetWidth; fl.classList.add('go');
    if (bad) return;
    for (let i = 0; i < 14; i++) {
      const s = document.createElement('div'); s.className = 'spark';
      const a = i / 14 * Math.PI * 2, r = 40 + (i % 3) * 18;
      s.style.left = p.x + 'px'; s.style.top = p.y + 'px'; s.style.setProperty('--dx', Math.cos(a) * r + 'px'); s.style.setProperty('--dy', Math.sin(a) * r + 'px');
      $('#fx').appendChild(s); setTimeout(() => s.remove(), 1000);
    }
  }
  async function veil(to, ms) { const v = $('#veil'); v.style.transition = `opacity ${FAST ? 0 : ms}ms`; v.style.opacity = to; await wait(ms); }
  let modalResolve = null;
  function modal(html) {
    if (FAST) return Promise.resolve();
    $('#mcard').innerHTML = html + '<button class="big" id="mOk" type="button">…</button>';
    $('#modal').classList.add('on');
    return new Promise(r => { modalResolve = r; $('#mOk').addEventListener('click', () => { $('#modal').classList.remove('on'); modalResolve = null; r(); }); });
  }

  let chain = [];   // 1回の操作で続けて話されたセリフ（直前の1つを会話ウィンドウに小さく残す）
  async function play(ev) {
    busy = true; chain = [];
    for (const e of ev) {
      switch (e.type) {
        case 'say': { const ln = L.LINES[e.id]; lastSay = { id: e.id, prev: chain.length ? chain[chain.length - 1] : null }; chain.push(e.id); innerTx = []; renderScene(e.snap, e.id); renderWin(); talkMark(ln.who); newLog++; renderTop(); const vd = VO.speak(ln.s, ln.who, ln.wish); await wait(Math.max(ln.wish ? 1400 : 1000, vd + 200)); break; }
        case 'label': if (e.quiet) break; lastSay = { label: e.id }; innerTx = []; renderWin(); renderTop(); await wait(600); break;
        // 問いかけ（L.STORY.ask）：身ぶりと心の声 → 村人の答え（say）→ 余韻の心の声
        case 'ask': { const a = L.STORY.ask[e.id]; lastSay = { nar: a.nar }; innerTx = []; renderScene(e.snap); renderWin(); await runStory(a.before); break; }
        case 'askEnd': await runStory(L.STORY.ask[e.id].after); break;
        case 'collect': collectFx(e); break;
        case 'pconfirm': case 'named': case 'near': case 'miss': case 'hold': case 'sound': noteEvent(e); break;
        case 'msg': toast(e.text); break;
        case 'fizzle': toast(e.why); break;
        case 'misfire': toast('ことばがもつれて、光がはじけた（並べ方…？）'); flashAt(e.target || 'self', true); $('#scene').classList.add('shake'); await wait(700); $('#scene').classList.remove('shake'); break;
        case 'composed': toast('見よう見まねで書いた字が、ほのかに光った。……なんという言葉だろう'); if (!sel || S.confirmed.includes(sel) || S.named.includes(sel)) sel = e.w; newNote++; renderTop(); if ($('#note').classList.contains('on')) renderNote(); break;
        case 'composeKnown': toast(S.confirmed.includes(e.w) ? `見覚えのある字だ…「${cardLabel(e.w, true)}」` : '見覚えのある字だ'); break;
        case 'composeFail': toast(e.why); break;
        case 'doubt': toast('…できない気がする', true); break;
        case 'speak': toast('「' + e.words.map(w => cardLabel(w, true)).join(' ') + '」と口にした'); break;
        case 'fx': renderScene(e.snap); flashAt(e.target); toast(e.msg); await wait(800); break;
        case 'wary': toast('ミラの目つきが変わった'); renderScene(e.snap); await wait(1700); break;
        case 'take': toast('約束の札を手に入れた'); renderScene(e.snap); break;
        case 'miraLeave': renderScene(e.snap); await wait(500); break;
        case 'wind': toast('風が吹きこみ、扉が閉まった'); renderScene(e.snap); $('#scene').classList.add('shake'); await wait(900); $('#scene').classList.remove('shake'); break;
        case 'move': lastSay = null; innerTx = []; renderScene(e.snap); renderWin(); break;
        case 'goHome': await veil(1, 500); renderScene(e.snap); await veil(0, 500); break;
        case 'sleep': await lidsTo(0, 1100); await veil(1, 400); if (e.snap.sleeps === 1) await runStory([].concat(...(L.STORY.at.sleep1 || []).map(id => L.STORY.memories[id]))); break;
        case 'morning': {

            : `<h3>この言葉は「${a}」ではなかった</h3><div class="faces">${cd(a)}<span class="arrow">→</span>${cd(b)}</div><div class="full truth">${b}</div>`); break;
        }
        case 'belief': await modal(`<h3>碑文の最後の一行</h3>${lineHtml(L.BELIEF_LINE, true, 36, true)}<div class="full">「魔法は ない」</div><div class="cap">涙の跡。……なのに、途切れ途切れに光っている</div><div class="boost">胸の奥で、何かがほどけた</div>`); renderHand(); break;
        case 'twist': case 'truth': {
          const ln = L.LINES[e.id], g = L.gloss(ln.t, e.snap.confirmed, e.snap.revealed);

          if (e.type === 'truth') { toast('ログの訳が変わった'); break; }
          M.apply(m => { if (m.twistAt == null) m.twistAt = e.snap.twistAt; });
          renderScene(e.snap);
          await modal(`<h3>あの言葉が、訳せてしまった</h3><div class="faces">${faceCrop('mira', { face: 'smile' })}<span class="arrow">→</span>${faceCrop('mira', { face: 'true', from: 'smile' })}</div>${lineHtml(ln.s, ln.wish, 26)}<div class="cap">（${ln.cap}）</div><div class="full truth">「${g.full}」</div>${e.snap.confirmed.includes('nemu') && e.snap.confirmed.includes('nai') ? '<div class="boost">もう眠らされない。「眠る＋ない」の確信が満ちた</div>' : '<div class="boost">確信が胸に灯った</div>'}`);
          renderHand(); break;
        }
        case 'fturn': await finalTurn(e); break;
        case 'retry': toast('もう一度'); break;
        case 'lost': renderScene(e.snap); await lostPanel(); break;
        case 'escape': escapeHow = e.how; renderScene(e.snap); flashAt('mira'); toast(e.how === 'crumble' ? 'ミラの確信が崩れ、眠りの言葉が消えた' : 'ミラの魔法が止まった'); await wait(1600);
          // 引きの場面：門の向こうへ駆け出す（L.STORY.cutAt.escape）。カード欄・ヒントは逃げきった状態に

      }

      { const cut = L.cutsOf(e.type); if (cut.length) await runStory(cut); }
    }
    busy = false;

  }
  function collectFx(e) {
    const k = L.kanaOf(L.roOf(e.w)) || '字';
    if (e.isNew || e.fresh) { flyGlyph(e.w); newNote++; }
    toast(e.isNew ? `「${k}」を手帳に書きとめた` : e.fresh ? `「${k}」の用例が増えた` : 'もう書きとめてある');
    renderWin(); renderTop(); if ($('#note').classList.contains('on')) renderNote();
  }
  async function finalTurn(e) {
    const o = e.out, msg = { countered: '眠りの言葉を、目の前で打ち消した', doubt: '…できない気がする（ミラの確信が強すぎる）', wasted: 'まだ何も唱えていない。理解していると気づかれた',
      shaken: 'ミラの顔から笑みが消えた。確信が揺らいでいる', smile: 'ミラは首をかしげて微笑んだ', feign: '寝たふりをした。ミラが油断した', seen: '寝たふりは見抜かれている',
      bound: '', repelled: 'ミラの確信にはじかれた', wait: '様子を見た', none: '…' }[o.r];
    if (msg) toast(msg, o.r === 'doubt');
    renderScene(e.snap); renderFinalSnap(e.snap);
    if (o.r === 'countered') { flashAt('self'); wakeFx(); }
    await wait(900);
    // 眠りがしみこむ：まぶたが一度深く落ちてから、少しだけ持ち上がる
    if (o.hit) { toast('眠りの言葉がしみこむ…'); await lidsTo(.05, 380); await wait(220); lidsFree(); await wait(500); }
  }
  function renderFinalSnap(st) { const keep = S; S = Object.assign({}, S, { fin: st.fin, confirmed: st.confirmed }); renderFinal(); S = keep; }
  function lostPanel() {
    return new Promise(r => {
      $('#mcard').innerHTML = `<h3>眠らされてしまった</h3><div class="cap">ミラの確信を崩す順番を、もう一度</div><button class="big" id="lRetry" type="button">その場でやり直す</button><button class="ghost" id="lMorning" type="button">朝に戻って準備する</button>`;
      $('#modal').classList.add('on');
      const done = a => { $('#modal').classList.remove('on'); r(); setTimeout(() => dispatch(a), 0); };
      $('#lRetry').addEventListener('click', () => done({ t: 'retry' }));

  function dispatch(a) { return dispatchMany([a]); }
  // 続けて行う手（物に触れて、その字を書きとめる など）は、まとめて1回で演出する
  function dispatchMany(acts) {
    if (busy) return;
    let st = S; const ev = [];
    acts.forEach(a => { const r = L.act(st, a); st = r.s; ev.push(...r.ev); });
    S = st;
    trackMetrics(ev, acts);
    if (!ev.length) { render(); return; }
    return play(ev);
  }
  function trackMetrics(ev, acts) {
    // guessAttempts：意味を入力して判定した回数の合計（空の入力は数えない）
    const g = ev.filter(e => ['confirm', 'pconfirm', 'named', 'miss', 'near', 'hold', 'sound'].includes(e.type) && (acts || []).some(a => a.t === 'guess')).length;
    if (g) M.apply(m => { m.guessAttempts = (m.guessAttempts || 0) + g; }, true);
    if (ev.some(e => e.type === 'confirm')) {
      const n = S.confirmed.length;
      M.apply(m => {
        m.wordsConfirmed = Math.max(m.wordsConfirmed || 0, n);
        if (n >= 3 && firstSession && runNo === 1 && Date.now() - openedAt <= 180000) m.firstRunCleared = true;
      });
    }
    if (S.combos.length) {
      let all = [];
      try { all = JSON.parse(localStorage.getItem('kotodama.combos') || '[]'); } catch (e) {}
      const set = new Set(all.concat(S.combos));
      try { localStorage.setItem('kotodama.combos', JSON.stringify([...set])); } catch (e) {}
      M.apply(m => { m.combosTried = Math.max(m.combosTried || 0, set.size); }, true);
    }
  }

  /* ---- 手帳：説明はしない。同じ形が光り、2語でたしかめた形は余白に書きとめられる。
     意味は1語ずつ入力して当てる（日本語か英語。外れが続くと手がかりが増える） ---- */

      const k = Math.min(1, (now - t0) / FILL_MS), v = Math.min(k, to);
      fgs.forEach(f => { f.style.strokeDashoffset = CIRC * (1 - v); });
      halo.style.transform = `scale(${.2 + v * .9})`;
      if (k >= to) { drag.fill.done = true; finishWish(ws, ok); return; }
      requestAnimationFrame(step);
    })(t0);
  }
  function stopHold() {
    if (!drag) return; clearTimeout(drag.holdT); drag.fill = null;
    if (drag.ghost) { const ring = drag.ghost.querySelector('.ring'); ring.classList.remove('on'); ring.querySelectorAll('.rfg,.rfg2').forEach(f => { f.style.strokeDashoffset = CIRC; }); }
  }
  function endDrag() { if (!drag) return; stopHold(); if (drag.ghost) drag.ghost.remove(); setHot(null); $('#sceneBox').classList.remove('dragging'); drag = null; }
  function finishWish(ws, ok) {
    const tgt = drag.tgt, useBar = !!bar;
    if (!ok) toast('…できない気がする', true);
    endDrag();
    if (useBar) bar = null;
    dispatch({ t: 'cast', words: ws, target: tgt, wish: true });
  }
  addEventListener('pointerup', e => {
    if (!drag || e.pointerId !== drag.id) return;
    if (!drag.moved) { const w = drag.w; endDrag(); if (busy) return; bar = bar === w ? null : w; renderHand(); idleGlow(); return; }
    const t = drag.tgt, ws = words(), filling = drag.fill && !drag.fill.done;
    endDrag();
    if (!t) return;
    if (filling) { toast('願いが途切れた', true); return; }
    bar = null; dispatch({ t: 'cast', words: ws, target: t, wish: false });
  });
  addEventListener('pointercancel', endDrag);

  /* ---- はじまりと終わり ---- */
  const show = id => { ['title', 'game', 'end'].forEach(x => $('#' + x).classList.toggle('on', x === id)); };
  $('#ttlG').innerHTML = ['ka', 'na', 'nemu', 'maho'].map(w => glyph(w, 34)).join('');
  // タイトルの絵：丘の上から朝の村を見下ろす主人公の後ろ姿（キービジュアル title_main。タイトルだけは「引き」の絵）。最初に要るのはこの1枚だけ
  $('#titleArt').innerHTML = Array.from({ length: 12 }, (_, i) => `<circle class="mote" cx="${180 + i * 52}" cy="${520 + (i * 131) % 600}" r="5" fill="#fff8de" style="animation-delay:${i * .4}s"/>`).join('');
  function layoutTitle() {
    const t = $('#title'), W = t.clientWidth, H = t.clientHeight; if (!W) return;
    const k = Math.max(W / 1024, H / 1536), sw = 1024 * k, sh = 1536 * k;
    // 主人公（x≈310）と像（x≈680）のあいだを中央に。縦は下（主人公と村）を優先し、上の空にロゴを重ねる
    const ox = Math.min(0, Math.max(W - sw, W / 2 - 500 * k)), oy = Math.min(0, H - sh);
    Object.assign($('#titleStage').style, { width: sw + 'px', left: ox + 'px', top: oy + 'px' });
  }
  layoutTitle();
  if (window.ResizeObserver) new ResizeObserver(layoutTitle).observe($('#title'));
  // 残りの画像は、最初の画面が出てから順に読み込む（合わせて約2.5MB）
  const preload = () => { const q = ['bg_house_day', 'mira_smile', 'bg_house_night', 'mira_neutral', 'mira_true', 'hero_back', 'bg_square', 'merchant_normal', 'merchant_smirk', 'villager_child', 'villager_woman', 'bg_gate']; (function next() { const n = q.shift(); if (!n) return; const im = new Image(); im.onload = im.onerror = next; im.src = A(n); })(); };
  if (document.readyState === 'complete') setTimeout(preload, 0); else addEventListener('load', preload);
  $('#endArt').innerHTML = '<rect width="360" height="200" fill="url(#gSkyN)"/><circle cx="270" cy="50" r="40" fill="url(#gMoon)"/><circle cx="270" cy="50" r="13" fill="#f8f6ff"/>'
    + '<path d="M0 120 Q40 80 80 110 Q120 70 160 104 Q200 76 240 106 Q290 72 360 100 V200 H0Z" fill="#1b2150"/><path d="M0 150 Q60 120 120 146 Q200 116 260 144 Q320 126 360 140 V200 H0Z" fill="#121636"/>'
    + '<path d="M140 200 Q170 150 180 130 Q190 150 220 200Z" fill="#2e3060"/>'
    + [0, 1, 2, 3, 4, 5].map(i => `<circle class="mote" cx="${60 + i * 50}" cy="${120 + (i * 17) % 50}" r="1.8" fill="#e8ff9a" style="animation-delay:${i * .5}s"/>`).join('');
  /* ---- 物語の演出（L.STORY のデータを順に見せる）。前日譚・記憶のかけらも同じ仕組みで差し込める ---- */
  const intro = $('#intro'), introTx = $('#introTx'), introImg = $('#introImg'), introIv = intro.querySelector('.iv');
  let storySkip = false;
  const setLids = (o, ms) => intro.querySelectorAll('.lid').forEach(l => { l.style.transitionDuration = (FAST ? 0 : ms || 0) + 'ms'; l.style.setProperty('--o', o); });
  async function hideIntro() { intro.style.opacity = 0; await wait(800); intro.classList.remove('on'); intro.style.opacity = 1; introTx.className = ''; }
  async function runStory(steps) {
    if (!steps || !steps.length) return;
    storySkip = false;
    for (const st of steps) {
      if (storySkip) break;
      switch (st.k) {
        case 'black':
          intro.classList.add('on'); intro.style.opacity = 1; introIv.classList.remove('on', 'clear'); setLids(0, 0);
          introImg.style.transition = 'none'; introImg.style.transform = ''; await wait(st.ms || 800); break;
        case 'lids':
          if (!introImg.getAttribute('src')) introImg.src = A('bg_house_day');
          introIv.classList.add('on'); if (st.clear) introIv.classList.add('clear');
          setLids(st.open, st.ms); await wait(st.ms || 800); break;
        case 'text': case 'memory':
          introTx.textContent = st.text; introTx.className = (st.k === 'memory' ? 'mem ' : '') + 'on';
          await wait(st.ms || 2400); introTx.classList.remove('on'); await wait(1000); break;
        case 'pan':
          // 木の天井から、ゆっくり部屋へ目をおろす
          introImg.style.transition = `transform ${st.ms || 2000}ms ease-in-out, filter 1.2s ease`; introImg.style.transform = 'scale(1.06)';
          await wait(st.ms || 2000); await hideIntro(); break;
        case 'say':
          if (st.id === 'h0' && !S.heard.length) await dispatch({ t: 'wake' });
          else { lastSay = { id: st.id }; renderWin(); }
          break;
        case 'inner': innerTx.push(st.text); renderWin(); await wait(st.ms || 1500); break;
        case 'gesture': toast(st.text); await wait(st.ms || 900); break;
        case 'shot': await playShot(st); break;
        case 'omen': await playOmen(st); break;
      }
    }
    if (intro.classList.contains('on')) await hideIntro();
  }
  // 引きの場面：上下に黒い帯が入り、主人公（後ろ姿）を映す。hero.from → hero.to へ ms かけて動かす（駆け出して、小さくなっていく）
  async function playShot(step) {
    const box = $('#sceneBox'), ms = FAST ? 0 : reduced ? Math.min(step.ms || 2400, 900) : step.ms || 2400;
    SHOT = step; box.classList.add('wide');
    const st = step.place && step.place !== S.place ? Object.assign({}, S, { place: step.place }) : S;
    renderScene(st);
    const r = rigs.hero, h = step.hero;
    if (r && h && h.to) {
      r.classList.add('run'); r.style.transition = 'none'; r.style.opacity = 1; r.style.setProperty('--fb', '58%'); void r.offsetWidth;
      await wait(500);
      const e = 'cubic-bezier(.4,.1,.55,1)';
      r.style.transition = `left ${ms}ms ${e},top ${ms}ms ${e},width ${ms}ms ${e},height ${ms}ms ${e},opacity ${Math.round(ms * .35)}ms ease-in ${Math.round(ms * .65)}ms`;
      placeRig(r, heroAt(h.to, st.place)); r.style.opacity = 0;
    }
    await wait(ms + 400);
    SHOT = null;
    if (r) { r.classList.remove('run'); r.style.transition = ''; r.style.opacity = ''; r.style.setProperty('--fb', (FIG.hero.fb || 100) + '%'); }
    box.classList.remove('wide');
  }
  // 終わりの予感：暗転 → 夜の広場の像の碑文へ寄っていき、最後の一文が一瞬だけ強く灯る → 暗転（文字は出さない）
  async function playOmen(step) {
    const box = $('#sceneBox'), ms = FAST ? 0 : reduced ? 900 : step.ms || 2600;
    await veil(1, 500);
    box.classList.add('wide');
    renderScene(Object.assign({}, S, { place: step.place || 'square', night: true }));
    await veil(0, 500);
    box.classList.add('omen');
    await wait(ms);
    await veil(1, 600);
    box.classList.remove('omen', 'wide');
    renderScene(); await veil(0, 0);
  }
  $('#introSkip').addEventListener('click', () => {
    storySkip = true; intro.classList.remove('on'); intro.style.opacity = 1;
    if (S.phase === 'play' && !S.heard.length) { innerTx = L.STORY.prologue.filter(x => x.k === 'inner').map(x => x.text); dispatch({ t: 'wake' }); }
  });
  async function playIntro() {
    $('#introSkip').classList.toggle('on', runNo > 1 || !firstSession);
    await runStory(L.STORY.before.concat(L.STORY.prologue));
    if (!S.heard.length) await dispatch({ t: 'wake' });
    render();
  }
  function startRun() {
    runNo++; S = L.newGame(); bar = null; sampleCount = 0; sel = null; firstHint = null; langAuto = false; noteFlash = null; lastSay = null; newNote = 0; newLog = 0; runCounted = false; escapeHow = null; prevConf = {}; seenSamples = new Set(); comp = { cls: null, el: [] };
    M.apply(m => { if (m.runsStarted >= 1) m.replayed = true; m.runsStarted++; });
    show('game'); innerTx = []; render();
    if (!TEST_NOINTRO) playIntro();
    if (runNo === 1 && firstSession) { anyInput = false; stuckTimer = setTimeout(() => { if (!anyInput) M.apply(m => { m.tutorialStuck = true; }); }, 30000); }
  }
  const WANT = ['もっと遊びたい', '少し遊びたい', 'もういい'];
  function finishRun() {
    if (!runCounted) { runCounted = true; M.apply(m => { m.runsCompleted++; m.bestScore = Math.max(m.bestScore || 0, S.confirmed.length); m.wordsConfirmed = Math.max(m.wordsConfirmed || 0, S.confirmed.length); }); }
    $('#stats').innerHTML = `<span>解読した言葉</span><b>${S.confirmed.length} / ${L.N_WORDS}</b><span>真実に気づいた時点</span><b>${S.twistAt != null ? S.twistAt + '語目' : '気づかないまま'}</b><span>意味を書いた回数</span><b>${S.guesses}回</b><span>試した組み合わせ</span><b>${S.combos.length}種類</b><span>かかった日数</span><b>${S.day}日</b>`;
    $('#truthList').innerHTML = ['h6', 's1', 's2', 'n2'].filter(id => S.heard.some(h => h.id === id)).map(id => {
      const ln = L.LINES[id], v = L.view(ln.s, knownOf(), { lang: LANG, revealed: S.revealed, speaker: ln.who }), tx = v.natural || v.literal;
      return `<div>${lineHtml(ln.s, ln.wish, 20)}<br>${ln.cap} → ${tx ? '「' + tx + '」' : '（まだ読めない）'}</div>`;
    }).join('');
    // 終了画面は引き（L.STORY.camera.end）：森へ逃げた主人公の後ろ姿を映す
    const endWide = L.CAMS[L.STORY.camera.end || 'fp'].hero;
    $('#endHero').style.display = endWide ? '' : 'none';
    if (endWide && !$('#endHero').getAttribute('src')) $('#endHero').src = A('hero_back');
    renderOpts(); $('#thanks').textContent = ''; show('end'); M.flush();
  }
  function renderOpts() {
    const box = $('#opts'), cur = M.get().wantMore; box.innerHTML = '';
    WANT.forEach(v => {
      const el = document.createElement('button'); el.type = 'button'; el.className = 'opt'; el.textContent = v;
      el.setAttribute('aria-pressed', String(cur === v));
      el.addEventListener('click', () => { M.apply(m => { m.wantMore = v; }); renderOpts(); $('#thanks').textContent = 'ありがとう。参考にします'; });
      box.appendChild(el);
    });
  }
  $('#startBtn').addEventListener('click', () => { VO.unlock(); startRun(); });
  $('#againBtn').addEventListener('click', () => { VO.unlock(); startRun(); });
  addEventListener('pointerdown', () => VO.unlock(), { once: true });
  const renderBtns = () => { $('#langBtn').textContent = LANG === 'ja' ? '訳 日本語' : '訳 English'; const b = $('#sndBtn'); b.textContent = VO.muted ? '声 OFF' : '声 ON'; b.classList.toggle('off', VO.muted); };
  $('#langBtn').addEventListener('click', () => { LANG = LANG === 'ja' ? 'en' : 'ja'; langChosen = true; try { localStorage.setItem('kotodama.lang', LANG); } catch (e) {} renderBtns(); renderWin(); if ($('#log').classList.contains('on')) renderLog(); });
  $('#sndBtn').addEventListener('click', () => { VO.toggle(); renderBtns(); });
  renderBtns();
  M.init();

  // テスト用の窓口（?test=1 のときだけ）
  if (TEST) window.__k = {
    get S() { return S; }, get busy() { return busy; }, L, startRun, dispatch, render, finishRun, renderScene,
    async run(acts) { while (busy) await new Promise(r => setTimeout(r, 30)); FAST = true; for (const a of acts) { await dispatch(a); } FAST = false; render(); },
    set(fn) { fn(S); render(); }, setBar(w) { bar = w; render(); }, openNote(w) { sel = w; renderNote(); $('#note').classList.add('on'); }, openLog() { renderLog(); $('#log').classList.add('on'); },
    say(id) { lastSay = { id }; renderScene(S, id); renderWin(); }, label(id) { lastSay = { label: id }; renderWin(); }, modal, show, faceCrop,
    setLang(l) { LANG = l; renderBtns(); render(); }, inner(t) { innerTx = t; renderWin(); }, runStory, dispatchMany, playShot, get shot() { return SHOT; },
  };
})();
</script>
